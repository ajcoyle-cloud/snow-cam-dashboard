  //  • No active snowfall → the FREEZING LEVEL itself (the 0°C isotherm). Below it
  //    the air is above freezing, so nothing should be tinted. (Previous bug: this
  //    used freezing − 300m, so the blue drape spilled ~300m below the freezing
  //    level — e.g. covering a +1.8°C base that sits below the freezing level.)
  //  • Active snowfall → the SNOW LINE. Wet-bulb gives the real crossing when
  //    the model has it (hour.snowLineWB); freezing − 300m is the fallback,
  //    which is the same crossing assumed at one fixed humidity.
  const snowLine = (snowing && hour.snowLineWB != null)
    ? hour.snowLineWB
    : hour.freezingLevel - SNOW_OFFSET;
  const boundary = snowing ? snowLine : hour.freezingLevel;

  // Nothing to draw when the boundary is above the entire displayed terrain —
  // e.g. an off-season resort with the freezing level kilometres above the peak.
  // A flat transparent ramp avoids the static cap the clamp would otherwise pin
  // to the summit (which never moves as you scrub the timeline).
  if (boundary >= TOP_ELEV) {
    return [
      'interpolate', ['linear'], ['elevation'],
      0, 'rgba(255,255,255,0)',
      TOP_ELEV, 'rgba(255,255,255,0)'
    ];
  }

  // Clamp below TOP_ELEV so the ramp's stops stay strictly ascending.
  const line = Math.min(boundary, TOP_ELEV - 2);

  if (!snowing) {
    // Freezing-level overlay (no active snowfall). Dark contour mode uses a
    // darker blue than the daytime tint (which read as too bright/saturated
    // against the dark relief basemap), but at 0.15 opacity it disappeared
    // entirely against the near-black terrain — bumped back up so it's
    // still visibly darker/less saturated than daytime, just not invisible.
    const color = darkTerrainActive ? 'rgba(35,85,180,0.35)' : 'rgba(60,130,255,0.2)';
    return [
      'interpolate', ['linear'], ['elevation'],
      line - 1, 'rgba(255,255,255,0)',
      line, color,
      TOP_ELEV, color
    ];
  }

  const midPoint = Math.min(line + 100, TOP_ELEV - 1);

  // Dark contour mode: darker grey instead of the near-white daytime tint —
  // white read as blown-out against the dark relief basemap. This hue blend
  // (low tone -> mid tone -> high tone by POSITION) is a purely visual style
  // choice, unchanged — "closer to the summit looks brighter" isn't meant to
  // imply more snow. Actual snowfall amount is opacity, below.
  const [c0, c1, c2] = darkTerrainActive
    ? ['90,95,105', '110,115,125', '130,135,145']
    : ['205,225,255', '225,240,255', '248,251,255'];
  const hueAt = (elev) => (elev <= midPoint
    ? lerpRgbStr(c0, c1, (elev - line) / Math.max(1, midPoint - line))
    : lerpRgbStr(c1, c2, (elev - midPoint) / Math.max(1, TOP_ELEV - midPoint)));

  // Opacity — what actually reads as "how much snow" — now comes from the
  // REAL per-elevation rate (currentHourBandRates, scaled to match this
  // hour's own resort-level snowfallMm; see computeElevationBandRates)
  // sampled at fixed steps up the mountain, instead of one flat intensity
  // applied everywhere. Previously a spot right at the snow line and a spot
  // at the summit looked identically solid as long as both were "snowing
  // this hour" — now a spot with genuinely more forecast snow reads more
  // solid. Falls back to the old flat intensity (uniform hour.snowfallMm)
  // when band data isn't available — e.g. mid-frame during startPlay's
  // smooth blend between two hours, which intentionally skips real
  // per-elevation data for a purely decorative animation frame.
  const rateAt = (elev) => (currentHourBandRates
    ? interpolateBandArray(currentHourBandRates, elev)
    : hour.snowfallMm / 10) * 10; // cm -> mm
  const alphaAt = (elev) => Math.max(0.65, Math.min(1, rateAt(elev) / 14)).toFixed(2);

  const SNOW_RAMP_SAMPLE_STEP_M = 80;

  // Sleet band — the slice between the rain line and the snow line, where
  // wet-bulb sits in the mixed range. Violet, and deliberately flatter/more
  // transparent than the snow above it so it reads as "marginal, not banked
  // snow". Only drawn when wet-bulb actually gave us both crossings AND they
  // leave a real gap below the snow line; otherwise the ramp starts at the
  // snow line exactly as before. sleetBandFor() owns those conditions, and the
  // tap-to-probe popup reads the same answer.
  const sleetBand = sleetBandFor(hour);

  const stops = sleetBand
    ? [
        'interpolate', ['linear'], ['elevation'],
        sleetBand.floor - 1, `rgba(${SLEET_RGB},0)`,
        sleetBand.floor, `rgba(${SLEET_RGB},0.45)`,
        // Hold the violet up to just under the snow line, then hand over to
        // the snow hue so the two zones meet at a visible edge rather than
        // cross-fading into an ambiguous mush.
        sleetBand.top - 1, `rgba(${SLEET_RGB},0.55)`
      ]
    : ['interpolate', ['linear'], ['elevation'], line - 1, `rgba(${c0},0)`];

  for (let elev = line; elev < TOP_ELEV; elev += SNOW_RAMP_SAMPLE_STEP_M) {
    stops.push(elev, `rgba(${hueAt(elev)},${alphaAt(elev)})`);
  }
  stops.push(TOP_ELEV, `rgba(${hueAt(TOP_ELEV)},${alphaAt(TOP_ELEV)})`);
  return stops;
}

// The 'snow-relief' layer isn't guaranteed to exist the instant the map is
// constructed (style/layers attach asynchronously), so poll briefly until it
// does rather than relying on a single 'load'/'idle' event that may fire too early.
let applyRampToken = 0;
function applyRampWhenReady(rampArray) {
  if (!map) return; // map failed to initialize — nothing to paint, and must not throw here
  const token = ++applyRampToken;
  const tryApply = () => {
    if (token !== applyRampToken) return; // a newer selection was made — abandon this one
    if (map.getLayer('snow-relief')) {
      map.setPaintProperty('snow-relief', 'color-relief-color', rampArray);
    } else {
      setTimeout(tryApply, 80);
    }
  };
  tryApply();
}

// Pin + black pill at a map point. On the HOURLY map it sits persistently at the
// field (this hour's snowfall rate). On the ACCUMULATED map it opens at the field
// (window total), fades out after 4s, and tapping the map moves it to that point
// and restarts the fade.
let snowfallMarker = null;
let snowfallFadeTimer = null;

function ensureSnowfallMarker(lngLat, label) {
  if (!snowfallMarker) {
    const el = document.createElement('div');
    el.className = 'snowfall-marker';
    el.innerHTML = '<div class="sf-pill"></div><div class="sf-stem"></div><div class="sf-dot"></div>';
    snowfallMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat(lngLat).addTo(map);
  }
  const el = snowfallMarker.getElement();
  el.querySelector('.sf-pill').textContent = label;
  snowfallMarker.setLngLat(lngLat);
  el.style.opacity = '1';
  return el;
}

function removeSnowfallMarker() {
  if (snowfallFadeTimer) { clearTimeout(snowfallFadeTimer); snowfallFadeTimer = null; }
  if (snowfallMarker) { snowfallMarker.remove(); snowfallMarker = null; }
}

// Hourly: persistent pill at the field (no fade). Empty label hides it.
function showSnowfallMarker(label) {
  // This pins a single flat "cm/hr" reading to one fixed point (LOC.center)
  // regardless of where snow actually falls harder or lighter — exactly the
  // position-blind reading High-Res's precise tap-to-probe replaced. Showing
  // it there by default (with no tap) both duplicates and contradicts the
  // whole point of the orographic map. Same reasoning as removing the
  // "Selected Forecast Hour" drawer from this page earlier.
  if (isHighResMode) { removeSnowfallMarker(); return; }
  if (!label) { removeSnowfallMarker(); return; }
  if (snowfallFadeTimer) { clearTimeout(snowfallFadeTimer); snowfallFadeTimer = null; }
  ensureSnowfallMarker(LOC.center || [LOC.lon, LOC.lat], label);
}

// Accumulated: pill at lngLat that fades out after 4s. Empty label hides it.
function flashSnowfallMarker(lngLat, label) {
  if (!label) { removeSnowfallMarker(); return; }
  ensureSnowfallMarker(lngLat, label);
  if (snowfallFadeTimer) clearTimeout(snowfallFadeTimer);
  snowfallFadeTimer = setTimeout(() => {
    if (snowfallMarker) snowfallMarker.getElement().style.opacity = '0';
  }, 4000);
}

let currentIndex = -1;

function openMapView(index) {
  // The terrain/satellite map must always exist regardless of whether
  // forecast data is ready yet (a slow weather fetch shouldn't leave the
  // whole map blank) — initMap() never depended on forecastHours before, and
  // must not start doing so now. Isolated in try/catch: everything below
  // (the timeline UI / data panel) is plain DOM/data logic that has nothing
  // to do with WebGL, and must not break just because the map did.
  try { initMap(); } catch (e) { console.error('initMap failed', e); }

  // forecastHours can legitimately be empty (e.g. every model's hourly rows
  // got filtered out for this resort/period, or the weather fetch is still
  // in flight) — bail out of the hour-dependent bits instead of indexing
  // into it, since the fallback would be `hour === undefined` and
  // buildSnowRamp(undefined) used to throw (corrupting the map's snow-relief
  // paint expression and blanking the whole render loop, not just the
  // overlay). The base map still shows fine either way.
  if (forecastHours.length === 0) {
    applyRampWhenReady(buildSnowRamp(null));
    return;
  }
  currentIndex = Math.max(0, Math.min(index, forecastHours.length - 1));
  const hour = forecastHours[currentIndex];

  // Must mirror buildSnowRamp's own boundary exactly (see the "Previous
  // bug" comment there) — this used freezing-300m unconditionally, so on a
  // non-snowing hour the probe's "above the line" cutoff sat 300m below
  // where the map actually stops tinting, letting a tap in that gap report
  // non-zero snowfall for an area showing no shading at all.
  const hourSnowing = hour.snowfallMm >= SNOWFALL_THRESHOLD_MM;
  currentSnowLine = hourSnowing
    ? (hour.snowLineWB != null ? hour.snowLineWB : hour.freezingLevel - SNOW_OFFSET)
    : hour.freezingLevel;
  currentHourCm = hourSnowing ? hour.snowfallMm / 10 : 0;
  // Real per-elevation rate for this exact hour (see computeElevationBandRates)
  // — assigned before buildSnowRamp runs, since it now reads this to vary
  // opacity by real elevation instead of one flat intensity. null when not
  // snowing (buildSnowRamp's non-snowing branch is a flat freezing-level
  // tint, unrelated to snowfall amount) or when band data isn't available.
  currentHourBandRates = hourSnowing ? computeElevationBandRates(hour.time, currentHourCm) : null;
  // Same hour buildSnowRamp is about to paint from, so the probe's "sleet"
  // answer and the violet on screen come from one decision (see sleetBandFor).
  currentSleetBand = sleetBandFor(hour);

  applyRampWhenReady(buildSnowRamp(hour));
  // Split mode: pane B's drape, the difference readout and both comparison
  // graphs all key off the hour pane A just moved to.
  if (splitMode) renderSplitAll();
  // Regenerating orographic-snow-layer's tiles is real per-pixel DEM work,
  // unlike buildSnowRamp's cheap interpolation array — only worth doing on
  // an actual hour change (here), not on every smooth-playback animation
  // frame (see startPlay's blendHour loop, which intentionally skips this).
  refreshOrographicSnow();

  document.getElementById('si-time').textContent = fmtTime(hour.time);
  document.getElementById('si-temp').textContent = hour.temp.toFixed(1) + '°C';
  document.getElementById('si-fl').textContent = Math.round(hour.freezingLevel) + ' m';
  // Wet-bulb snow line where available, with the sleet band's lower edge shown
  // alongside it so the violet zone on the map has a number attached.
  document.getElementById('si-sl').textContent = hour.snowLineWB != null
    ? Math.round(hour.snowLineWB) + ' m'
    : Math.round(hour.freezingLevel - SNOW_OFFSET) + ' m';
  const sleetEl = document.getElementById('si-sleet');
  if (sleetEl) {
    const showSleet = hour.snowLineWB != null && hour.rainLineWB != null
      && hour.rainLineWB < hour.snowLineWB;
    sleetEl.parentElement.style.display = showSleet ? '' : 'none';
    if (showSleet) {
      // The band's LOWER edge only — its top is the Snow Line already shown
      // directly above, so a range just restated that number.
      sleetEl.textContent = Math.round(hour.rainLineWB) + ' m';
    }
  }
  document.getElementById('si-snow').textContent = hour.snowfallMm.toFixed(1) + ' mm';
  document.getElementById('si-wind').textContent = hour.windSpeedKmh != null
    ? `${Math.round(hour.windSpeedKmh)} km/h ${degToCompass(hour.windDirDeg)}`
    : '—';

  document.getElementById('tl-prev').disabled = currentIndex <= 0;
  document.getElementById('tl-next').disabled = currentIndex >= forecastHours.length - 1;
  document.getElementById('tl-label').textContent = fmtTime(hour.time);

  const slider = document.getElementById('tl-slider');
  slider.max = forecastHours.length - 1;
  slider.value = currentIndex;

  if (currentIndex >= forecastHours.length - 1) stopPlay();

  // Render freezing level overlay for hourly view
  if (viewMode === 'hourly') {
    pwRenderFreezingOverlay();
    // Update observation pills to show forecasted temperature
    for (const id in pwState) pwRenderPill(id);
    // Update pseudo pills to show forecasted temperature
    pwRenderPseudoPills();
    // Snowfall pin/pill at the field (only while snow is falling this hour)
    showSnowfallMarker(hour.snowfallMm >= SNOWFALL_THRESHOLD_MM ? `❄ ${(hour.snowfallMm / 10).toFixed(2)} cm/hr` : '');
  }

  setTimeout(() => { if (map) map.resize(); }, 60);
}

function stepHour(delta) {
  if (currentIndex < 0) return;
  openMapView(currentIndex + delta);
}

// ── Accumulated snowfall view — total depth over the next 5/10/15 days ──────
// The mountain is tinted with all eight depth bands stacked by elevation so the
// colour key is visible across the terrain; the legend highlights which single
// band the actual forecast total falls into. Band colours come from DEPTH_BANDS
// (the Plasma palette).
function renderDepthLegend(activeBand) {
  const el = document.getElementById('depth-legend');
  el.innerHTML = DEPTH_BANDS.map(b => `
    <div class="legend-row${b === activeBand ? ' active-band' : ''}">
      <div class="legend-swatch" style="background:${b.swatch}"></div>
      <span>${b.label}</span>
    </div>
  `).join('');
}

// Colour stops now come from the SAME real per-elevation data the
// tap-to-probe pill reads (getDepthAtElevation) — this used to stack
// DEPTH_BANDS evenly by raw position between the snow line and summit,
// entirely independent of the real elevation-band snowfall curve
// (computeElevationBandTotals). That meant the colour painted at a point
// could disagree with what tapping it actually reported — e.g. a
// comfortably-coloured patch popping up "0.0cm" because GFS's real,
// non-linear curve puts negligible snow there, while the old evenly-spaced
// colouring had no way to know and painted it anyway (the reported bug).
//
// Walks up from the snow line in fixed steps, samples the real depth at
// each via getDepthAtElevation, and emits a new colour stop only where the
// DEPTH_BANDS bucket actually changes — same hard-edged-step look as
// before, but the edges now sit wherever the real data crosses a
// threshold instead of an arbitrary even split. Requires currentSnowLine/
// elevationBandTotals/currentAccumTotalCm to already be set (see call site
// in renderAccumulatedView, which assigns those before calling this).
const ACCUM_RAMP_SAMPLE_STEP_M = 30;
function colorForDepth(cm) {
  const idx = DEPTH_BANDS.findIndex((b) => cm <= b.max);
  return (idx === -1 ? DEPTH_BANDS[DEPTH_BANDS.length - 1] : DEPTH_BANDS[idx]).color;
}
function buildAccumRamp(snowLine) {
  const stops = ['interpolate', ['linear'], ['elevation'], snowLine - 1, 'rgba(255,255,255,0)'];
  let prevColor = null;
  for (let elev = snowLine; elev <= TOP_ELEV; elev += ACCUM_RAMP_SAMPLE_STEP_M) {
    const color = colorForDepth(getDepthAtElevation(elev));
    if (color !== prevColor) {
      // Hold the previous colour right up to the edge of this step (mirrors
      // the old code's `end - edgeGap` trick) so the transition reads as a
      // hard edge, not a gradient blend between the two colours.
      if (prevColor !== null) stops.push(elev - 1, prevColor);
      stops.push(elev, color);
      prevColor = color;
    }
  }
  stops.push(TOP_ELEV, colorForDepth(getDepthAtElevation(TOP_ELEV)));
  return stops;
}

function renderAccumulatedView() {
  if (forecastHours.length === 0) return;
  initMap();

  const nowMs = Date.now();
  let startIdx = 0, bestDiff = Infinity;
  forecastHours.forEach((r, i) => {
    const diff = Math.abs(new Date(r.time).getTime() - nowMs);
    if (diff < bestDiff) { bestDiff = diff; startIdx = i; }
  });
  const window_ = forecastHours.slice(startIdx, startIdx + accumDays * 24);
  const totalCm = window_.reduce((s, r) => s + r.snowfallMm, 0) / 10;
  // Use the lowest freezing level reached during the window, not the average —
  // averaging dilutes a cold snow event with milder days elsewhere in the same
  // window, which made a longer period (e.g. 15 Day) show a *higher* snow line
  // than a shorter one (10 Day) it fully contains. The minimum can only stay
  // the same or drop as the window grows, so longer periods never show less
  // low-elevation coverage than the shorter periods nested inside them.
  const minFreezing = Math.min(...window_.map((r) => r.freezingLevel));
  // Clamp below TOP_ELEV — see buildSnowRamp for why (freezing level can
  // forecast above the resort's summit in its off-season).
  const snowLine = Math.min(minFreezing - SNOW_OFFSET, TOP_ELEV - 2);

  const bandIndex = DEPTH_BANDS.findIndex(b => totalCm <= b.max);
  const band = bandIndex === -1 ? DEPTH_BANDS[DEPTH_BANDS.length - 1] : DEPTH_BANDS[bandIndex];

  // Assigned before buildAccumRamp runs — it calls getDepthAtElevation
  // internally, which reads these three module-level vars.
  currentSnowLine = snowLine;
  currentAccumTotalCm = totalCm;
  elevationBandTotals = computeElevationBandTotals(window_[0]?.time, accumDays * 24, totalCm);

  applyRampWhenReady(buildAccumRamp(snowLine));

  document.getElementById('accum-period-label').textContent = `Next ${accumDays} Days`;
  document.getElementById('accum-total').textContent = totalCm.toFixed(0) + ' cm';
  document.getElementById('accum-snowline').textContent = Math.round(snowLine) + ' m';
  renderDepthLegend(band);
  updateAccumMinSummary();
  // Snowfall pin/pill — opens at the field with the window total, then fades
  // after 4s. Tapping the map moves it (see the map click handler).
  if (totalCm >= 0.1) flashSnowfallMarker(LOC.center || [LOC.lon, LOC.lat], `❄ ${totalCm.toFixed(0)} cm`);
  else removeSnowfallMarker();

  setTimeout(() => { if (map) map.resize(); }, 60);
}

// Headline figures shown in the minimised drawer's grey space (accumulated mode).
function updateAccumMinSummary() {
  const el = document.getElementById('drawer-min-summary');
  if (!el) return;
  el.innerHTML = `
    <div class="dms-main">
      <span class="dms-eyebrow">Next ${accumDays} Days · Snowfall</span>
      <span class="dms-total">${currentAccumTotalCm != null ? currentAccumTotalCm.toFixed(0) + ' cm' : '—'}</span>
    </div>
    <div class="dms-side">
      <span class="l">Snow line</span>
      <span class="v">${currentSnowLine != null ? Math.round(currentSnowLine) + ' m' : '—'}</span>
    </div>`;
}

// ── Isobars (pressure) view ─────────────────────────────────────────────
// Grids Open-Meteo's pressure_msl over a fixed box spanning southern
// Australia, the Tasman Sea, and all of NZ, and contours it into isobars at
// a standard hPa step — same approach verified in scripts/isobar_poc.mjs,
// ported client-side.
//
// Went through three size changes before landing here:
//   1. ~110km x 100km, centred on whichever resort was active — synoptic
//      gradients run ~1 hPa per 100-200km, so a box that small routinely had
//      less than one 4 hPa step of spread across it: correct, but visually
//      empty most of the time.
//   2. A fixed ~750km x 500km North Island box — enough room for isobars to
//      actually appear, but still only shows a system after it's already on
//      top of the country, not the wider pattern approaching from the
//      Tasman/Southern Ocean this view exists to show.
//   3. ~2160km x 3850km, southern Australia/Tasman/all of NZ.
// This box is that one widened again to 6x its area: one more block-width
// added east and west (3 blocks wide total), and one more block-height
// added south into the Southern Ocean (2 blocks tall total) — a 3x2 grid of
// the size-3 box. The east edge (223) is left UNWRAPPED past 180 rather
// than normalised into -180..180: MapLibre's fitBounds/GeoJSON rendering
// treats longitude as a continuous line and handles the antimeridian
// crossing correctly as long as coordinates stay continuous, whereas
// wrapping it here would make the box's east edge jump back to land next to
// its west edge on screen. Only the actual Open-Meteo request (a real
// geographic API that rejects lon > 180) normalises — see normalizeLon,
// used from fetchWeatherChunk below.
//
// latMax pushed from -28 to -10: north edge now clears Cape York (-10.7),
// the tip of the Australian mainland — lonMin/lonMax unchanged (same width,
// taller box).
const ISOBAR_BBOX = { latMin: -67, latMax: -10, lonMin: 91, lonMax: 223 };
// 24 (576 points) as a SINGLE request broke in production ("Status:
// Unavailable") — too large a batch against some Open-Meteo limit (URL
// length, location-count cap, or timeout; no way to tell which without
// live access). Back to 24, but now fetched as ISOBAR_FETCH_CHUNKS
// smaller parallel requests instead of one — see fetchGriddedSeries.
const ISOBAR_GRID_SIZE = 24;
// 24 rows / 4 = 6 rows x 24 cols = 144 points per request — deliberately
// sized to match 12x12=144, the exact request size already proven to work
// in production, rather than guessing at some other safe size.
const ISOBAR_FETCH_CHUNKS = 4;
const ISOBAR_STEP_HPA = 4;

function normalizeLon(lon) {
  let l = lon;
  while (l > 180) l -= 360;
  while (l < -180) l += 360;
  return l;
}

// Fetches one horizontal band of the grid (a subset of rows, every
// column) for ONE hourly variable — see renderIsobarsView below for why
// pressure, temperature and precipitation are three entirely separate sets
// of chunk requests rather than one variable riding along with another.
// Returns { rows, times } or null if this band's request failed.
async function fetchWeatherChunk(latsChunk, lons, hourlyVar, models) {
  const flatLat = [], flatLon = [];
  for (const lat of latsChunk) for (const lon of lons) { flatLat.push(lat.toFixed(4)); flatLon.push(normalizeLon(lon).toFixed(4)); }
  // The bbox spans several countries/timezones — 'auto' resolves each
  // location's own local timezone. Doesn't affect what we read back
  // (a plain number, unaffected by how its timestamp is formatted) but
  // keeps the request honest regardless.
  const modelsParam = models ? `&models=${models}` : '';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${flatLat.join(',')}&longitude=${flatLon.join(',')}&hourly=${hourlyVar}&forecast_days=7&timezone=auto${modelsParam}`;
  const json = await fetchJsonCached(url, { timeoutMs: 20000, retries: 1 });
  if (!json) return null;
  const entries = Array.isArray(json) ? json : [json];
  if (entries.length !== latsChunk.length * lons.length) return null;

  const times = entries.find((e) => e?.hourly?.time)?.hourly?.time;
  if (!times) return null;

  const rows = [];
  let i = 0;
  for (let r = 0; r < latsChunk.length; r++) {
    const row = [];
    for (let c = 0; c < lons.length; c++) {
      const h = entries[i++]?.hourly;
      row.push(h?.[hourlyVar] ?? null);
    }
    rows.push(row);
  }
  return { rows, times };
}

// Fetches one variable's full 7-day hourly series for every grid point,
// split into ISOBAR_FETCH_CHUNKS row-bands fetched in PARALLEL rather than
// one request for the whole grid — a single 576-point (24x24) request
// broke in production, almost certainly some Open-Meteo limit on batch
// size/response payload. Each chunk is sized to exactly match
// 12x12=144 points of ONE variable, the shape already proven to work as a
// single request — bundling a second variable into the same chunk requests
// roughly doubled that payload and broke again, so each variable gets its
// own fully independent set of chunked requests instead.
// If one chunk's request fails, it gets one retry attempt on its own
// before giving up (see below); if that also fails, its rows come back
// null rather than the whole fetch failing — the contouring code already
// treats null grid cells as "no data here", so the result is a gap in
// that one band, not the entire view going blank.
// Returns { seriesGrid, lats, lons, times } | null.
async function fetchGriddedSeries(bbox, hourlyVar, models) {
  const lats = [], lons = [];
  for (let r = 0; r < ISOBAR_GRID_SIZE; r++) {
    lats.push(bbox.latMax - (r / (ISOBAR_GRID_SIZE - 1)) * (bbox.latMax - bbox.latMin));
  }
  for (let c = 0; c < ISOBAR_GRID_SIZE; c++) {
    lons.push(bbox.lonMin + (c / (ISOBAR_GRID_SIZE - 1)) * (bbox.lonMax - bbox.lonMin));
  }

  const rowsPerChunk = Math.ceil(ISOBAR_GRID_SIZE / ISOBAR_FETCH_CHUNKS);
  const chunkStarts = [];
  for (let start = 0; start < ISOBAR_GRID_SIZE; start += rowsPerChunk) chunkStarts.push(start);
  const chunks = await Promise.all(
    chunkStarts.map((start) => fetchWeatherChunk(lats.slice(start, start + rowsPerChunk), lons, hourlyVar, models))
  );

  // A chunk coming back null here isn't necessarily a persistent problem —
  // fetchOrNull already retries transient network errors internally, but a
  // whole chunk still failing after that (a brief upstream hiccup, a
  // momentary rate limit) is common enough to be worth one more attempt at
  // just the failed band(s) before settling for a gap in the isobars. A
  // failed attempt is never cached (see fetchJsonCached/forecastCacheSet),
  // so retrying here genuinely goes back to the network rather than
  // replaying the same failure from cache.
  const failedIdx = chunkStarts.map((_, i) => i).filter((i) => !chunks[i]);
  if (failedIdx.length > 0) {
    const retried = await Promise.all(
      failedIdx.map((i) => fetchWeatherChunk(lats.slice(chunkStarts[i], chunkStarts[i] + rowsPerChunk), lons, hourlyVar, models))
    );
    failedIdx.forEach((i, j) => { chunks[i] = retried[j]; });
  }

  const times = chunks.map((c) => c?.times).find(Boolean);
  if (!times) return null; // every chunk failed — genuinely nothing to show

  const seriesGrid = [];
  chunkStarts.forEach((start, idx) => {
    const chunk = chunks[idx];
    if (chunk) {
      seriesGrid.push(...chunk.rows);
    } else {
      const chunkRowCount = Math.min(rowsPerChunk, ISOBAR_GRID_SIZE - start);
      for (let r = 0; r < chunkRowCount; r++) seriesGrid.push(lons.map(() => null));
    }
  });

  return { seriesGrid, lats, lons, times };
}

// Open-Meteo pressure-level variable used as a stand-in for "temperature at
// 1000m" — Open-Meteo doesn't expose a fixed-ALTITUDE free-air temperature,
// only fixed PRESSURE levels. 900hPa sits at ~988m under the ICAO standard
// atmosphere, the closest standard level to 1000m (1000hPa is only ~110m —
// too close to the surface to show cold air aloft; 850hPa is ~1500m, too
// high). An approximation, not an exact 1000m reading.
const ISOBAR_TEMP_HOURLY_VAR = 'temperature_900hPa';
// Open-Meteo's default 'auto' model choice can pick, per point, whichever
// source model has the best native resolution there — and not every model
// in that pool carries pressure-level fields, only surface ones. In
// production this showed up as pressure_msl staying complete right down to
// the Antarctic coast while temperature_900hPa quietly went empty over the
// remote southern half of ISOBAR_BBOX specifically — the signature of
// 'auto' landing on a surface-only model down there rather than an actual
// fetch failure (pressure_msl's own identical-shaped requests all
// succeeded). Pinning GFS explicitly sidesteps that: it's a single global
// model with full pole-to-pole pressure-level coverage, so every point in
// the box resolves the same way. Left off pressure_msl, which already works
// reliably as-is — no reason to risk changing behaviour that isn't broken.
const ISOBAR_TEMP_MODEL = 'gfs_seamless';

// Open-Meteo's hourly liquid-equivalent precipitation total (mm), pinned to
// the same GFS model as temperature above for the same reason — 'auto' risks
// silently swapping in a surface-only model over part of the box and leaving
// a patchy read, and GFS already carries this field everywhere pressure_msl
// does.
const ISOBAR_PRECIP_HOURLY_VAR = 'precipitation';
const ISOBAR_PRECIP_MODEL = 'gfs_seamless';

// Precipitation gets its OWN, much smaller bbox — NZ, the Tasman Sea lows
// typically track through/approach from, and a margin east of NZ — rather
// than reusing the full ISOBAR_BBOX pressure/temperature share. Fetched at
// the SAME ISOBAR_GRID_SIZE/ISOBAR_FETCH_CHUNKS budget (no extra requests,
// no extra rate-limit risk), a box this much smaller packs those same 24x24
// sample points roughly 2x closer together (~275-300km apart over the full
// continent-scale box down to ~145-150km here) — the fix for narrow frontal
// rain bands falling entirely between samples and never registering at
// all. The tradeoff: precipitation only ever renders within this tighter
// window, unlike the pressure isobars/cold-air overlay which still cover
// the full wide view. Bounds deliberately generous westward (lonMin 145)
// since the deep lows this overlay most needs to catch tend to sit well out
// in the Tasman, not right on top of NZ.
const ISOBAR_PRECIP_BBOX = { latMin: -58, latMax: -28, lonMin: 145, lonMax: 185 };

// Pressure, temperature and precipitation are fetched as three fully
// independent gridded fetches, orchestrated directly in renderIsobarsView
// rather than bundled behind one function — see that function for why
// they're SEQUENCED (not run together via Promise.all) and why rendering no
// longer waits for all three before showing anything.

// Slices one hour's worth of values out of fetchGriddedSeries's per-point
// arrays into a plain grid — the same { grid, lats, lons } shape
// buildIsobarSegments/findPressureExtrema already expect, so a single
// frame's rendering is identical to how the old current=-only snapshot
// worked, just called once per animation frame instead of once total.
function isobarGridAtHour(seriesGrid, hourIdx) {
  return seriesGrid.map((row) => row.map((cellSeries) => {
    const v = cellSeries?.[hourIdx];
    return typeof v === 'number' ? v : null;
  }));
}

// Linear blend between two hourly grids, point for point — pressure
// evolves continuously at any given spot, so blending consecutive hours
// here (then recontouring the blend fresh, same pipeline as any other
// frame) reads as the isobars actually moving between hours instead of
// visibly jump-cutting to a new shape once an hour during playback.
function interpolateGrid(gridA, gridB, t) {
  return gridA.map((row, r) => row.map((v, c) => {
    const b = gridB[r][c];
    if (v == null || b == null) return null;
    return v + (b - v) * t;
  }));
}

// Bilinear-upsamples a grid to a finer resolution before contouring — with
// only ISOBAR_GRID_SIZE=24 source points across a box this wide (~57°
// latitude), the marching-squares boundary follows edges roughly 2-5°
// long, which reads as an obviously faceted/blocky polygon rather than a
// smooth coastline-like curve. Running the exact same contourer over a
// finer, smoothly-interpolated grid instead produces many more, much
// smaller facets whose piecewise-linear boundary already looks smooth at
// this map's zoom levels — cheaper and simpler than post-processing the
// traced polygon, and it's what the cold-air fill/line overlay both
// contour, so they stay pixel-consistent with each other. A null source
// corner poisons its interpolated neighbourhood to null too, same "no data
// here" convention the contourer itself already uses.
function upsampleGrid(grid, lats, lons, factor) {
  const rows = grid.length, cols = grid[0].length;
  const newLats = [];
  for (let r = 0; r <= (rows - 1) * factor; r++) {
    const t = r / factor, r0 = Math.floor(t), r1 = Math.min(r0 + 1, rows - 1), f = t - r0;
    newLats.push(lats[r0] + (lats[r1] - lats[r0]) * f);
  }
  const newLons = [];
  for (let c = 0; c <= (cols - 1) * factor; c++) {
    const t = c / factor, c0 = Math.floor(t), c1 = Math.min(c0 + 1, cols - 1), f = t - c0;
    newLons.push(lons[c0] + (lons[c1] - lons[c0]) * f);
  }
  const newGrid = [];
  for (let r = 0; r < newLats.length; r++) {
    const tr = r / factor, r0 = Math.floor(tr), r1 = Math.min(r0 + 1, rows - 1), fr = tr - r0;
    const row = [];
    for (let c = 0; c < newLons.length; c++) {
      const tc = c / factor, c0 = Math.floor(tc), c1 = Math.min(c0 + 1, cols - 1), fc = tc - c0;
      const v00 = grid[r0][c0], v01 = grid[r0][c1], v10 = grid[r1][c0], v11 = grid[r1][c1];
      if (v00 == null || v01 == null || v10 == null || v11 == null) { row.push(null); continue; }
      const top = v00 + (v01 - v00) * fc;
      const bot = v10 + (v11 - v10) * fc;
      row.push(top + (bot - top) * fr);
    }
    newGrid.push(row);
  }
  return { grid: newGrid, lats: newLats, lons: newLons };
}

// Standard marching-squares contourer — see scripts/isobar_poc.mjs for the
// full derivation/comments on the case table and saddle-case handling; kept
// identical here so the two stay verifiably in sync.
const ISOBAR_EDGE_PAIRS = {
  1: ['S', 'W'], 2: ['E', 'S'], 3: ['E', 'W'], 4: ['N', 'E'],
  6: ['N', 'S'], 7: ['N', 'W'], 8: ['N', 'W'], 9: ['N', 'S'],
  11: ['N', 'E'], 12: ['E', 'W'], 13: ['E', 'S'], 14: ['S', 'W'],
};
function isobarLerp(v0, v1, p0, p1, level) {
  const t = (level - v0) / (v1 - v0);
  return p0 + t * (p1 - p0);
}
function isobarEdgePoint(edge, corners, coords, level) {
  const { TL, TR, BR, BL } = corners;
  const { latTop, latBot, lonL, lonR } = coords;
  switch (edge) {
    case 'N': return [isobarLerp(TL, TR, lonL, lonR, level), latTop];
    case 'S': return [isobarLerp(BL, BR, lonL, lonR, level), latBot];
    case 'W': return [lonL, isobarLerp(TL, BL, latTop, latBot, level)];
    case 'E': return [lonR, isobarLerp(TR, BR, latTop, latBot, level)];
    default: return null;
  }
}
function isobarContourLevel(grid, lats, lons, level) {
  const segments = [];
  for (let r = 0; r < grid.length - 1; r++) {
    for (let c = 0; c < grid[r].length - 1; c++) {
      const TL = grid[r][c], TR = grid[r][c + 1];
      const BL = grid[r + 1][c], BR = grid[r + 1][c + 1];
      if ([TL, TR, BL, BR].some((v) => v == null)) continue;
      let caseIdx = (TL >= level ? 8 : 0) | (TR >= level ? 4 : 0) | (BR >= level ? 2 : 0) | (BL >= level ? 1 : 0);
      if (caseIdx === 0 || caseIdx === 15) continue;
      const corners = { TL, TR, BR, BL };
      const coords = { latTop: lats[r], latBot: lats[r + 1], lonL: lons[c], lonR: lons[c + 1] };
      let pairs;
      if (caseIdx === 5 || caseIdx === 10) {
        const avg = (TL + TR + BR + BL) / 4;
        pairs = caseIdx === 5
          ? (avg >= level ? [['N', 'W'], ['E', 'S']] : [['N', 'E'], ['W', 'S']])
          : (avg >= level ? [['N', 'E'], ['W', 'S']] : [['N', 'W'], ['E', 'S']]);
      } else {
        pairs = [ISOBAR_EDGE_PAIRS[caseIdx]];
      }
      for (const [e1, e2] of pairs) {
        const p1 = isobarEdgePoint(e1, corners, coords, level);
        const p2 = isobarEdgePoint(e2, corners, coords, level);
        if (p1 && p2) segments.push({ level, coords: [p1, p2] });
      }
    }
  }
  return segments;
}
function buildIsobarSegments(grid, lats, lons, stepHpa) {
  const values = grid.flat().filter((v) => v != null);
  if (values.length === 0) return { min: null, max: null, levels: [], segments: [] };
  const min = Math.min(...values);
  const max = Math.max(...values);
  const firstLevel = Math.ceil(min / stepHpa) * stepHpa;
  const levels = [];
  for (let lvl = firstLevel; lvl <= max; lvl += stepHpa) levels.push(lvl);
  const segments = levels.flatMap((lvl) => isobarContourLevel(grid, lats, lons, lvl));
  return { min, max, levels, segments };
}
// Marching squares emits one disconnected 2-point segment per grid cell a
// level crosses — fine for the raw min/max/level stats, but rendered
// directly it reads as a scatter of short jagged shards rather than lines,
// especially now the grid is this coarse. Chains same-level segments that
// share an endpoint into continuous polylines before anything gets smoothed
// or drawn. Endpoints from isobarEdgePoint are exact float matches when two
// cells share an edge (same lerp inputs), so a plain string key is enough —
// no fuzzy-distance matching needed.
function stitchSegmentsToLines(segments) {
  const byLevel = new Map();
  for (const s of segments) {
    if (!byLevel.has(s.level)) byLevel.set(s.level, []);
    byLevel.get(s.level).push(s.coords);
  }

  const key = (p) => `${p[0].toFixed(6)},${p[1].toFixed(6)}`;
  const lines = [];
  for (const [level, coordsList] of byLevel) {
    const adjacency = new Map(); // point key -> [{ to: [lon,lat], segIdx }]
    coordsList.forEach(([a, b], i) => {
      for (const [from, to] of [[a, b], [b, a]]) {
        const k = key(from);
        if (!adjacency.has(k)) adjacency.set(k, []);
        adjacency.get(k).push({ to, segIdx: i });
      }
    });
    const used = new Array(coordsList.length).fill(false);

    for (let i = 0; i < coordsList.length; i++) {
      if (used[i]) continue;
      used[i] = true;
      let coords = [...coordsList[i]];

      let extended = true;
      while (extended) {
        extended = false;
        for (const cand of adjacency.get(key(coords[coords.length - 1])) || []) {
          if (used[cand.segIdx]) continue;
          used[cand.segIdx] = true;
          coords.push(cand.to);
          extended = true;
          break;
        }
      }
      extended = true;
      while (extended) {
        extended = false;
        for (const cand of adjacency.get(key(coords[0])) || []) {
          if (used[cand.segIdx]) continue;
          used[cand.segIdx] = true;
          coords.unshift(cand.to);
          extended = true;
          break;
        }
      }
      lines.push({ level, coords });
    }
  }
  return lines;
}

// Chaikin corner-cutting: replaces each interior vertex with two points 1/4
// and 3/4 of the way along its adjacent edges, repeated a couple of times.
// Standard, cheap way to turn an angular polyline into a smooth-looking
// curve without any curve-fitting library — endpoints are left untouched
// (open lines don't shrink back from the grid box's true edge) or fed back
// as the closing point when the chain looped into a closed ring.
function chaikinSmooth(coords, iterations = 2) {
  let pts = coords;
  if (pts.length < 3) return pts;
  const closed = key0(pts[0]) === key0(pts[pts.length - 1]);
  for (let iter = 0; iter < iterations; iter++) {
    const n = pts.length;
    const next = [];
    if (!closed) next.push(pts[0]);
    for (let i = 0; i < n - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      next.push([0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1]);
      next.push([0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1]);
    }
    if (!closed) next.push(pts[n - 1]);
    else next.push(next[0]);
    pts = next;
  }
  return pts;
}
function key0(p) { return `${p[0].toFixed(6)},${p[1].toFixed(6)}`; }

function buildSmoothedIsobarLines(segments) {
  return stitchSegmentsToLines(segments).map((l) => ({ level: l.level, coords: chaikinSmooth(l.coords) }));
}

function isobarLinesToGeoJSON(lines) {
  return {
    type: 'FeatureCollection',
    features: lines.filter((l) => l.coords.length >= 2).map((l) => ({
      type: 'Feature',
      properties: { pressure_msl: Math.round(l.level) },
      geometry: { type: 'LineString', coordinates: l.coords },
    })),
  };
}

// Refines a detected extremum from its exact grid point to a sub-grid
// position via 1D parabolic interpolation along each axis independently —
// the standard technique for sub-sample peak/trough localisation (same
// idea used for audio pitch detection, image corner refinement, etc).
// Without this, an H/L marker can only ever sit exactly on one of the
// grid's ~576 points — so even though the pressure field itself is
// already blended smoothly between hours during playback (interpolateGrid),
// the detected extremum still visibly SNAPS from one grid point straight
// to the next as that field shifts, rather than gliding. This is what
// actually fixes that (a rendering/animation tweak alone couldn't — the
// snapping is a detection-precision problem, not a transition one).
function refineExtremumPosition(grid, lats, lons, r, c) {
  const v = grid[r][c];
  let dCol = 0;
  if (c > 0 && c < lons.length - 1) {
    const vL = grid[r][c - 1], vR = grid[r][c + 1];
    if (vL != null && vR != null) {
      const denom = vL - 2 * v + vR;
      if (Math.abs(denom) > 1e-6) dCol = 0.5 * (vL - vR) / denom;
    }
  }
  let dRow = 0;
  if (r > 0 && r < lats.length - 1) {
    const vT = grid[r - 1][c], vB = grid[r + 1][c];
    if (vT != null && vB != null) {
      const denom = vT - 2 * v + vB;
      if (Math.abs(denom) > 1e-6) dRow = 0.5 * (vT - vB) / denom;
    }
  }
  // Parabolic fits can occasionally overshoot near-flat/degenerate regions
  // — clamp so the refined point never leaves the cell it was detected in.
  dCol = Math.max(-0.5, Math.min(0.5, dCol));
  dRow = Math.max(-0.5, Math.min(0.5, dRow));

  const lonStep = c < lons.length - 1 ? lons[c + 1] - lons[c] : lons[c] - lons[c - 1];
  // lats runs north->south (descending, see fetchGriddedSeries), so
  // moving toward r+1 (south) means SUBTRACTING from lat.
  const latStep = r < lats.length - 1 ? lats[r] - lats[r + 1] : lats[r - 1] - lats[r];
  return { lon: lons[c] + dCol * lonStep, lat: lats[r] - dRow * latStep };
}

// Finds local pressure minima/maxima on the grid — the "L"/"H" centres
// marked on every real synoptic chart. Restricted to INTERIOR grid points
// only (never the outer ring): a point on the box's edge winning against
// its few in-bounds neighbours usually just means the true centre is
// outside our sampled area, not that one is actually there — labelling
// that would be a guess dressed up as a reading.
function findPressureExtrema(grid, lats, lons) {
  const extrema = [];
  for (let r = 1; r < grid.length - 1; r++) {
    for (let c = 1; c < grid[r].length - 1; c++) {
      const v = grid[r][c];
      if (v == null) continue;
      let isMin = true, isMax = true;
      for (let dr = -1; dr <= 1 && (isMin || isMax); dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nv = grid[r + dr][c + dc];
          if (nv == null) continue;
          if (nv <= v) isMin = false;
          if (nv >= v) isMax = false;
        }
      }
      if (isMin || isMax) {
        const { lon, lat } = refineExtremumPosition(grid, lats, lons, r, c);
        extrema.push({ label: isMin ? 'L' : 'H', lon, lat, pressure: v });
      }
    }
  }
  return extrema;
}
function isobarExtremaToGeoJSON(extrema) {
  return {
    type: 'FeatureCollection',
    features: extrema.map((e) => ({
      type: 'Feature',
      properties: { label: e.label, pressure_msl: Math.round(e.pressure) },
      geometry: { type: 'Point', coordinates: [e.lon, e.lat] },
    })),
  };
}

// ── Cold-air overlay ─────────────────────────────────────────────────────
// A single flat-colour fill marking where ISOBAR_TEMP_HOURLY_VAR drops to
// or below ISOBAR_TEMP_THRESHOLD_C, plus a smoothed line tracing its exact
// edge — "cold air coming up to NZ" as one clean region, not a graduated
// temperature wash. Same fixed-threshold idea as a cold-front line on a
// real synoptic chart: you're either on the cold side of it or you aren't.
const ISOBAR_TEMP_THRESHOLD_C = 0;
// How much finer than the raw ISOBAR_GRID_SIZE grid to contour at — see
// upsampleGrid's own comment for why. Used whenever there's no per-tick
// budget pressure: landing on a real hour (isobarDrawFrame, manual step/
// drag) or the isobarPlayTick sub-step that lands exactly on the next real
// hour. 5x turns 24x24 into 116x116 (~13.5k cells).
const ISOBAR_TEMP_UPSAMPLE_FACTOR = 5;
// Coarser factor used for the interpolated sub-steps IN BETWEEN real hours
// during autoplay (isobarPlaySubStep 1..ISOBAR_PLAY_SUBSTEPS-1) — the cold
// air overlay now blends every ISOBAR_PLAY_TICK_MS right along with the
// pressure isobars (see isobarPlayTick) rather than jump-cutting once an
// hour, but re-contouring+re-filling at the full 5x resolution on every one
// of those ticks measured at 15-20ms of pure JS just for the fill/line
// build (before MapLibre's own setData cost on top, for a several-thousand-
// feature source) — enough to start eating into the 60ms tick budget on
// real hardware and turn "smoother" into "stuttery". 3x is ~3x cheaper
// (~2-6ms) and still reads as smooth at this map's zoom for the brief
// in-between frames; every landed-on real hour still snaps to the full 5x
// crispness via ISOBAR_TEMP_UPSAMPLE_FACTOR above.
const ISOBAR_TEMP_ANIM_UPSAMPLE_FACTOR = 3;

function buildTempBoundaryGeoJSON(tempGrid, lats, lons) {
  const segments = isobarContourLevel(tempGrid, lats, lons, ISOBAR_TEMP_THRESHOLD_C);
  // Only ONE light Chaikin pass here, deliberately less than the pressure
  // isobars' 2 — this line is drawn over the cold-air FILL (buildTempFillGeoJSON),
  // built from the exact same upsampled grid but never smoothed itself (its
  // per-cell polygons are already close to their true edge and don't need
  // to be — see its own comment). Heavier smoothing pulls the line away from
  // that true edge enough to visibly disagree with where the fill actually
  // starts/stops; since the grid feeding both is already upsampled 5x
  // (ISOBAR_TEMP_UPSAMPLE_FACTOR) before either gets contoured, the raw
  // boundary is fine enough that it barely needs smoothing to read as
  // smooth, so 1 pass is enough polish without the two visibly parting ways.
  const lines = stitchSegmentsToLines(segments).map((l) => ({ ...l, coords: chaikinSmooth(l.coords, 1) }));
  return {
    type: 'FeatureCollection',
    features: lines.filter((l) => l.coords.length >= 2).map((l) => ({
      type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: l.coords },
    })),
  };
}

// Per-cell marching-squares ISOBAND (filled region below a single
// threshold) rather than just a boundary line — same case analysis as
// isobarContourLevel (including its avg-of-corners saddle tie-break, reused
// verbatim so the fill and the line agree at every saddle cell), but each
// case returns the polygon(s) covering the cell's below-threshold area
// instead of just the crossing edge. Cells are rendered as independent
// GeoJSON polygons, all painted with the same single fill colour/opacity —
// adjacent/overlapping cells blend into one seamless region visually, with
// no polygon-union/hole-stitching needed.
function isobarColdFillPolysForCell(TL, TR, BR, BL, coords, level) {
  const { latTop, latBot, lonL, lonR } = coords;
  const corners = { TL, TR, BR, BL };
  const TLp = [lonL, latTop], TRp = [lonR, latTop], BRp = [lonR, latBot], BLp = [lonL, latBot];
  const pt = (edge) => isobarEdgePoint(edge, corners, coords, level);

  const caseIdx = (TL >= level ? 8 : 0) | (TR >= level ? 4 : 0) | (BR >= level ? 2 : 0) | (BL >= level ? 1 : 0);
  if (caseIdx === 0) return [[TLp, TRp, BRp, BLp]]; // whole cell below threshold
  if (caseIdx === 15) return []; // whole cell above threshold — nothing cold here

  if (caseIdx === 5 || caseIdx === 10) {
    // Saddle: the two cold corners sit on opposite diagonals — same avg
    // tie-break isobarContourLevel uses, so the fill and the line it sits
    // under/on top of never disagree about which pairing is "the" boundary.
    const avg = (TL + TR + BR + BL) / 4;
    const coldConnectedThroughCenter = avg < level;
    if (caseIdx === 5) { // TL, BR cold; TR, BL warm
      return coldConnectedThroughCenter
        ? [[TLp, pt('N'), pt('E'), BRp, pt('S'), pt('W')]] // hexagon: TR/BL corners chamfered off
        : [[pt('N'), TLp, pt('W')], [pt('E'), BRp, pt('S')]]; // two isolated corner triangles
    }
    // caseIdx === 10: TR, BL cold; TL, BR warm
    return coldConnectedThroughCenter
      ? [[pt('N'), TRp, pt('E'), pt('S'), BLp, pt('W')]] // hexagon: TL/BR corners chamfered off
      : [[pt('N'), TRp, pt('E')], [pt('W'), BLp, pt('S')]]; // two isolated corner triangles
  }

  // Every other case has exactly one contiguous cold region — walk the cell
  // perimeter (corners + the two crossing edge points ISOBAR_EDGE_PAIRS
  // already identifies for the line) in order, keeping only the cold side.
  const edges = ISOBAR_EDGE_PAIRS[caseIdx];
  const octagon = [
    { pt: TLp, cold: TL < level }, { edge: 'N' },
    { pt: TRp, cold: TR < level }, { edge: 'E' },
    { pt: BRp, cold: BR < level }, { edge: 'S' },
    { pt: BLp, cold: BL < level }, { edge: 'W' },
  ];
  const poly = [];
  for (const node of octagon) {
    if (node.pt) { if (node.cold) poly.push(node.pt); }
    else if (edges.includes(node.edge)) poly.push(pt(node.edge));
  }
  return poly.length >= 3 ? [poly] : [];
}

function buildTempFillGeoJSON(grid, lats, lons, level) {
  const features = [];
  for (let r = 0; r < grid.length - 1; r++) {
    for (let c = 0; c < grid[r].length - 1; c++) {
      const TL = grid[r][c], TR = grid[r][c + 1];
      const BL = grid[r + 1][c], BR = grid[r + 1][c + 1];
      if ([TL, TR, BL, BR].some((v) => v == null)) continue;
      const coords = { latTop: lats[r], latBot: lats[r + 1], lonL: lons[c], lonR: lons[c + 1] };
      for (const ring of isobarColdFillPolysForCell(TL, TR, BR, BL, coords, level)) {
        features.push({
          type: 'Feature', properties: {},
          geometry: { type: 'Polygon', coordinates: [[...ring, ring[0]]] },
        });
      }
    }
  }
  return { type: 'FeatureCollection', features };
}

// ── Precipitation overlay ────────────────────────────────────────────────
// Graduated-intensity fill (not a single on/off threshold like the cold-air
// overlay above) — precipitation rate is a continuum, not a "front" boundary
// you're cleanly on one side of, so a handful of nested bands reads more
// like an actual rain/snow area than one hard edge would. Combined with the
// cold-air fill already on the map, wherever the two overlap is roughly
// where the precip is falling as snow rather than rain.
// Thresholds are deliberately low — this is a 24x24 point-sample grid across
// a box spanning ~57° of latitude (roughly 300km between sample points), so
// a narrow frontal rain band can sit entirely between two sample points and
// never register at all even when it's genuinely raining nearby. At this
// resolution any nonzero hourly total a sample point DOES report is already
// a fairly coarse/diluted signal, not noise — the original 0.2/2/8mm
// thresholds (reasonable for a fine-grained radar-style read) were high
// enough to filter out exactly the light-to-moderate frontal rain (often
// 0.1-1mm/h) this overlay exists to show, leaving it looking empty even
// along an obvious front.
const ISOBAR_PRECIP_BANDS = [
  { level: 0.1, opacity: 0.16 }, // any measurable precip
  { level: 1, opacity: 0.3 },    // moderate
  { level: 5, opacity: 0.48 },   // heavy
];
const ISOBAR_PRECIP_UPSAMPLE_FACTOR = 5; // same rationale as ISOBAR_TEMP_UPSAMPLE_FACTOR
const ISOBAR_PRECIP_ANIM_UPSAMPLE_FACTOR = 3; // same rationale as ISOBAR_TEMP_ANIM_UPSAMPLE_FACTOR

// isobarColdFillPolysForCell fills the region where a value is BELOW a
// level; precipitation bands need the opposite side (AT OR ABOVE a
// threshold). Negating both the four corner values and the level flips
// which side of the boundary counts as "in" (v >= level  <=>  -v < -level)
// while leaving every edge-crossing point it computes identical — the
// interpolation fraction in isobarLerp is unchanged by negating both its
// value inputs and its level — so this reuses that function's case table
// and saddle tie-break exactly rather than re-deriving the geometry.
function isobarAboveFillPolysForCell(TL, TR, BR, BL, coords, level) {
  return isobarColdFillPolysForCell(-TL, -TR, -BR, -BL, coords, -level);
}

// Builds one fill polygon set per band in ISOBAR_PRECIP_BANDS, tagged with
// that band's own threshold as its 'level' property. Each band's qualifying
// area is necessarily a subset of every lower band's (a cell at or above 8
// is also at or above 2 and 0.2), so pushing bands in ascending order here
// means higher/more-intense polygons are always later in the feature list —
// and therefore painted on top — than the broader, lighter band beneath
// them, without any manual z-ordering.
function buildPrecipFillGeoJSON(grid, lats, lons, bands) {
  const features = [];
  for (const band of bands) {
    for (let r = 0; r < grid.length - 1; r++) {
      for (let c = 0; c < grid[r].length - 1; c++) {
        const TL = grid[r][c], TR = grid[r][c + 1];
        const BL = grid[r + 1][c], BR = grid[r + 1][c + 1];
        if ([TL, TR, BL, BR].some((v) => v == null)) continue;
        const coords = { latTop: lats[r], latBot: lats[r + 1], lonL: lons[c], lonR: lons[c + 1] };
        for (const ring of isobarAboveFillPolysForCell(TL, TR, BR, BL, coords, band.level)) {
          features.push({
            type: 'Feature', properties: { level: band.level },
            geometry: { type: 'Polygon', coordinates: [[...ring, ring[0]]] },
          });
        }
      }
    }
  }
  return { type: 'FeatureCollection', features };
}

// Lazily adds the isobar source/layers on first use — mirrors how
// radar-layer gets added on demand in radarDrawFrame(), including the same
// "'satellite' layer existing" check for "the style has actually attached"
// before calling addSource/addLayer (which throws if called too early).
function ensureIsobarLayer() {
  if (!map || map.getSource('isobar-src')) return true;
  if (!map.getLayer('satellite')) return false;
  // Precipitation bands go in FIRST/bottom-most — the cold-air fill and
  // pressure isobars/labels above it are the "where is it" read, this is
  // the "how much" wash underneath both.
  map.addSource('isobar-precip-fill-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'isobar-precip-fill', type: 'fill', source: 'isobar-precip-fill-src',
    paint: {
      'fill-color': '#22c55e',
      'fill-opacity': ['match', ['get', 'level'], ...ISOBAR_PRECIP_BANDS.flatMap((b) => [b.level, b.opacity]), 0],
    },
    layout: { visibility: 'none' },
  });
  // Cold-air fill + boundary line added next so both paint underneath the
  // pressure isobars/labels/H-L markers (but above precipitation, whose
  // opacity is tuned assuming the cold-air blue may render on top of it).
  // Fill before line so the line's stroke isn't hidden under the fill's own edge.
  map.addSource('isobar-temp-fill-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'isobar-temp-fill', type: 'fill', source: 'isobar-temp-fill-src',
    paint: { 'fill-color': '#4db8ff', 'fill-opacity': 0.22 },
    layout: { visibility: 'none' },
  });
  map.addSource('isobar-temp-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'isobar-temp-line', type: 'line', source: 'isobar-temp-src',
    paint: { 'line-color': '#4db8ff', 'line-width': 1.75 },
    layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
  });
  map.addSource('isobar-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'isobar-lines', type: 'line', source: 'isobar-src',
    paint: { 'line-color': 'rgba(0,255,255,0.3)', 'line-width': 1.5 },
    // round joins/caps — the stitched+Chaikin-smoothed lines are already
    // curved, but a sharp miter join at each of the many short segments
    // Chaikin produces would still read as faceted up close, not smooth.
    layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
  });
  // Labels read from their OWN source, separate from isobar-src above, so
  // they can be refreshed on a slower cadence than the line geometry (see
  // isobarRenderGrid's updateLabels param) — stitchSegmentsToLines'
  // chaining of marching-squares segments is sensitive to tiny value
  // changes between adjacent interpolated frames, so recomputing the
  // label set on every 60ms autoplay tick made the hPa numbers hop between
  // positions/lines constantly instead of reading as a smooth animation.
  map.addSource('isobar-label-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'isobar-labels', type: 'symbol', source: 'isobar-label-src',
    layout: {
      visibility: 'none',
      // 'line' repeats the label every symbol-spacing px along the WHOLE
      // line — on a line spanning most of this box that's the same "1008
      // hPa" printed a dozen times. 'line-center' places it once, at the
      // line's midpoint, cutting the label count from "many per isobar" to
      // "one per isobar" without losing the reading altogether.
      'symbol-placement': 'line-center',
      'text-field': ['concat', ['get', 'pressure_msl'], ' hPa'],
      'text-size': 11,
      // Regular weight, not Bold — the H/L markers stay bold (they're the
      // primary read), this is just the per-line hPa value.
      'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular'],
    },
    paint: { 'text-color': '#ffffff', 'text-halo-color': 'rgba(0,0,0,0.65)', 'text-halo-width': 1.2 },
  });
  map.addSource('isobar-extrema-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  // High/Low centre markers — the big bold H/L every synoptic chart marks
  // system centres with. Blue H / red L is the common convention (matches
  // BOM/MetService-style charts); halo keeps it legible over any basemap
  // colour underneath.
  map.addLayer({
    id: 'isobar-extrema-labels', type: 'symbol', source: 'isobar-extrema-src',
    layout: {
      visibility: 'none',
      'text-field': ['get', 'label'],
      'text-size': 26,
      'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
    },
    paint: {
      'text-color': ['match', ['get', 'label'], 'H', '#3b82f6', 'L', '#ef4444', '#ffffff'],
      'text-halo-color': 'rgba(0,0,0,0.75)',
      'text-halo-width': 2,
    },
  });
  return true;
}
function setIsobarLayerVisible(visible) {
  if (!map) return;
  const v = visible ? 'visible' : 'none';
  if (map.getLayer('isobar-precip-fill')) map.setLayoutProperty('isobar-precip-fill', 'visibility', v);
  if (map.getLayer('isobar-temp-fill')) map.setLayoutProperty('isobar-temp-fill', 'visibility', v);
  if (map.getLayer('isobar-temp-line')) map.setLayoutProperty('isobar-temp-line', 'visibility', v);
  if (map.getLayer('isobar-lines')) map.setLayoutProperty('isobar-lines', 'visibility', v);
  if (map.getLayer('isobar-labels')) map.setLayoutProperty('isobar-labels', 'visibility', v);
  if (map.getLayer('isobar-extrema-labels')) map.setLayoutProperty('isobar-extrema-labels', 'visibility', v);
}

// ── Isobars animation timeline (next 7 days) ────────────────────────────
// Same play/step/slider shape as the Radar timeline (radarDrawFrame/
// radarStepFrame/radarTogglePlay etc.) — one fetch loads the whole 7-day
// series, then each frame just slices+recontours locally (cheap: 144
// points, ~10 levels), no per-frame network calls.
let isobarSeries = null; // { seriesGrid, tempSeriesGrid, precipSeriesGrid, lats, lons, times } | null
let isobarFrameIndex = -1;
let isobarPlayTimer = null;

function isobarFormatTs(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-NZ', { weekday: 'short' }) + ' ' + fmtClock(d);
}

// Renders one already-resolved temp grid (a real hour's data, or an
// interpolated in-between blend — caller's job to build it, same split as
// isobarRenderGrid/isobarDrawFrame/isobarPlayTick for pressure) onto the
// fill+line sources. `factor` is the caller's choice of upsampleGrid
// fineness — see the two constants below for why a landed-hour frame and an
// autoplay sub-step tick deliberately use different ones.
function isobarRenderTempOverlay(grid, lats, lons, factor) {
  if (!map) return;
  const fillSrc = map.getSource('isobar-temp-fill-src');
  const lineSrc = map.getSource('isobar-temp-src');
  if (!fillSrc || !lineSrc) return;
  const fine = upsampleGrid(grid, lats, lons, factor);
  fillSrc.setData(buildTempFillGeoJSON(fine.grid, fine.lats, fine.lons, ISOBAR_TEMP_THRESHOLD_C));
  lineSrc.setData(buildTempBoundaryGeoJSON(fine.grid, fine.lats, fine.lons));
}

// Manual navigation / landed-on-a-real-hour case: full ISOBAR_TEMP_UPSAMPLE_
// FACTOR resolution — there's no per-tick budget pressure here, it only
// happens once per hour transition (or on a drag/step), not
// ISOBAR_PLAY_SUBSTEPS times within one.
function isobarUpdateTempOverlay(hourIdx) {
  if (!isobarSeries) return;
  const { tempSeriesGrid, lats, lons } = isobarSeries;
  isobarRenderTempOverlay(isobarGridAtHour(tempSeriesGrid, hourIdx), lats, lons, ISOBAR_TEMP_UPSAMPLE_FACTOR);
}

// Same shape as isobarRenderTempOverlay/isobarUpdateTempOverlay above, one
// fill source instead of fill+line since precipitation bands have no single
// boundary to trace.
function isobarRenderPrecipOverlay(grid, lats, lons, factor) {
  if (!map) return;
  const fillSrc = map.getSource('isobar-precip-fill-src');
  if (!fillSrc) return;
  const fine = upsampleGrid(grid, lats, lons, factor);
  fillSrc.setData(buildPrecipFillGeoJSON(fine.grid, fine.lats, fine.lons, ISOBAR_PRECIP_BANDS));
}
function isobarUpdatePrecipOverlay(hourIdx) {
  if (!isobarSeries) return;
  const { precipSeriesGrid, precipLats, precipLons } = isobarSeries;
  isobarRenderPrecipOverlay(isobarGridAtHour(precipSeriesGrid, hourIdx), precipLats, precipLons, ISOBAR_PRECIP_UPSAMPLE_FACTOR);
}

// Renders one already-resolved grid (a real hour's data, or an
// interpolated in-between blend — caller's job to build it) onto the map
// and info panel. Shared by isobarDrawFrame (exact real hours, used by
// manual step/drag) and isobarPlayTick (interpolated sub-steps, used by
// autoplay) so both paths paint identically — only what grid/label/slider
// position they pass in differs.
//
// updateLabels gates the hPa text labels (isobar-label-src) and the H/L
// extrema markers (isobar-extrema-src) separately from the line geometry
// (isobar-src, always updated). Marching squares recomputes contour
// topology from scratch every call — on a genuine real-hour grid that's
// stable, but on the in-between blends autoplay renders every 60ms, tiny
// interpolated value changes can flip which cells a level crosses and how
// segments chain into lines, so the label set jumped to a new position (or
// a different line entirely) up to 6 times per hour-transition. Callers
// pass false for those in-between ticks so labels only refresh on the
// real-hour frames either side, while the lines/cold-air overlay keep
// updating every tick for a smooth slide.
function isobarRenderGrid(grid, lats, lons, labelText, sliderValue, updateLabels = true) {
  const { segments } = buildIsobarSegments(grid, lats, lons, ISOBAR_STEP_HPA);
  const lines = buildSmoothedIsobarLines(segments);
  map.getSource('isobar-src').setData(isobarLinesToGeoJSON(lines));
  if (updateLabels) {
    map.getSource('isobar-label-src').setData(isobarLinesToGeoJSON(lines));
    map.getSource('isobar-extrema-src').setData(isobarExtremaToGeoJSON(findPressureExtrema(grid, lats, lons)));
  }

  document.getElementById('isbtl-slider').value = sliderValue;
  document.getElementById('isbtl-label').textContent = labelText;
}

// Manual navigation (drag/step buttons) always lands on an exact real
// hour — no interpolation here, so a dragged-to reading is always a true
// forecast value, never a blended one.
function isobarDrawFrame(i) {
  if (!map || !isobarSeries || !isobarSeries.times[i]) return;
  isobarFrameIndex = i;
  isobarPlaySubStep = 0;
  const { seriesGrid, lats, lons, times } = isobarSeries;
  const grid = isobarGridAtHour(seriesGrid, i);
  isobarRenderGrid(grid, lats, lons, isobarFormatTs(times[i]), i);
  isobarUpdateTempOverlay(i);
  isobarUpdatePrecipOverlay(i);

  const slider = document.getElementById('isbtl-slider');
  slider.max = times.length - 1;
  document.getElementById('isbtl-prev').disabled = i <= 0;
  document.getElementById('isbtl-next').disabled = i >= times.length - 1;
}

function isobarStepFrame(delta) {
  if (!isobarSeries) return;
  isobarStopPlay();
  isobarDrawFrame(Math.max(0, Math.min(isobarSeries.times.length - 1, isobarFrameIndex + delta)));
}
function isobarTogglePlay() {
  if (isobarPlayTimer) isobarStopPlay(); else isobarStartPlay();
}

// Autoplay interpolates ISOBAR_PLAY_SUBSTEPS in-between frames per real
// hour (see interpolateGrid) instead of jump-cutting straight to the next
// hour's isobars — 6 sub-steps x 60ms = 360ms per hour-transition, close
// to the previous flat 350ms/frame pacing, but now each of those 360ms
// shows the isobars actually sliding rather than snapping.
const ISOBAR_PLAY_SUBSTEPS = 6;
const ISOBAR_PLAY_TICK_MS = 60;
let isobarPlaySubStep = 0;

function isobarPlayTick() {
  if (!isobarSeries) return;
  const { seriesGrid, tempSeriesGrid, precipSeriesGrid, precipLats, precipLons, lats, lons, times } = isobarSeries;
  if (isobarFrameIndex >= times.length - 1) { isobarStopPlay(); return; }

  isobarPlaySubStep++;
  const frac = Math.min(1, isobarPlaySubStep / ISOBAR_PLAY_SUBSTEPS);
  const gridA = isobarGridAtHour(seriesGrid, isobarFrameIndex);
  const gridB = isobarGridAtHour(seriesGrid, isobarFrameIndex + 1);
  const grid = frac >= 1 ? gridB : interpolateGrid(gridA, gridB, frac);

  const tA = new Date(times[isobarFrameIndex]).getTime();
  const tB = new Date(times[isobarFrameIndex + 1]).getTime();
  const label = isobarFormatTs(new Date(tA + (tB - tA) * frac).toISOString());
  isobarRenderGrid(grid, lats, lons, label, isobarFrameIndex + frac, frac >= 1);

  // Cold-air overlay blends right along with the pressure isobars now,
  // same interpolateGrid technique just applied to tempSeriesGrid — see
  // ISOBAR_TEMP_ANIM_UPSAMPLE_FACTOR's own comment for why this runs at a
  // coarser resolution than a landed-hour frame.
  const tempGridA = isobarGridAtHour(tempSeriesGrid, isobarFrameIndex);
  const tempGridB = isobarGridAtHour(tempSeriesGrid, isobarFrameIndex + 1);
  const tempGrid = frac >= 1 ? tempGridB : interpolateGrid(tempGridA, tempGridB, frac);
  isobarRenderTempOverlay(tempGrid, lats, lons, frac >= 1 ? ISOBAR_TEMP_UPSAMPLE_FACTOR : ISOBAR_TEMP_ANIM_UPSAMPLE_FACTOR);

  // Precipitation bands blend the same way, same reasoning as the cold-air
  // overlay just above.
  const precipGridA = isobarGridAtHour(precipSeriesGrid, isobarFrameIndex);
  const precipGridB = isobarGridAtHour(precipSeriesGrid, isobarFrameIndex + 1);
  const precipGrid = frac >= 1 ? precipGridB : interpolateGrid(precipGridA, precipGridB, frac);
  isobarRenderPrecipOverlay(precipGrid, precipLats, precipLons, frac >= 1 ? ISOBAR_PRECIP_UPSAMPLE_FACTOR : ISOBAR_PRECIP_ANIM_UPSAMPLE_FACTOR);

  if (frac >= 1) {
    // Landed exactly on the next real hour — advance and let the next tick
    // start a fresh 0..1 blend from there, rather than isobarDrawFrame's
    // own resets fighting this loop's own frame/substep bookkeeping.
    isobarFrameIndex++;
    isobarPlaySubStep = 0;
    document.getElementById('isbtl-prev').disabled = isobarFrameIndex <= 0;
    document.getElementById('isbtl-next').disabled = isobarFrameIndex >= times.length - 1;
  }
}

function isobarStartPlay() {
  if (!isobarSeries || isobarSeries.times.length < 2) return;
  if (isobarFrameIndex >= isobarSeries.times.length - 1) isobarDrawFrame(0);
  isobarPlaySubStep = 0;
  document.getElementById('isbtl-play').innerHTML = PAUSE_ICON_SVG;
  isobarPlayTimer = setInterval(() => {
    if (isobarFrameIndex >= isobarSeries.times.length - 1) { isobarStopPlay(); return; }
    isobarPlayTick();
  }, ISOBAR_PLAY_TICK_MS);
}
function isobarStopPlay() {
  if (isobarPlayTimer) { clearInterval(isobarPlayTimer); isobarPlayTimer = null; }
  const btn = document.getElementById('isbtl-play');
  if (btn) btn.textContent = '▶';
}
document.getElementById('isbtl-slider').addEventListener('input', (e) => {
  isobarStopPlay();
  isobarDrawFrame(parseInt(e.target.value, 10));
});

let isobarRenderToken = 0;
// Pressure is fetched and drawn FIRST, alone — temperature and precipitation
// are then fetched sequentially in the background (still one at a time, to
// avoid the concurrent-request limit noted by fetchWeatherChunk/
// fetchGriddedSeries above) and each overlay is folded in and redrawn the
// moment its own fetch resolves. Previously all three were awaited together
// before ANYTHING appeared, so the primary pressure-isobar read sat blank
// for as long as the slowest of the three requests took — including on a
// fast connection, since they're deliberately sequenced rather than
// parallel. The map's own base layer (satellite/terrain) was never gated by
// this fetch chain and already renders immediately; only the isobar-specific
// overlays were waiting on data that hadn't rendered yet.
async function renderIsobarsView() {
  initMap();

  const token = ++isobarRenderToken;
  isobarStopPlay();

  const pressure = await fetchGriddedSeries(ISOBAR_BBOX, 'pressure_msl');
  // Bail if either a newer render superseded this one, OR the user has
  // since switched to a different mode entirely — without the latter check,
  // a slow fetch landing after the user tapped e.g. Live back on would flip
  // the isobar layer visible again right under a mode that's supposed to
  // have cleared it (setViewMode only hides it once, when the switch happens,
  // not on every later async arrival). Every await below repeats this same
  // check for the same reason.
  if (token !== isobarRenderToken || viewMode !== 'isobars') return;

  // The base style (in particular its 'terrain' raster-dem TileJSON fetch)
  // can still be attaching when a user taps Isobars right after the map
  // first mounts — especially on a slow mobile connection, where this is
  // the single biggest source of the "tapping Isobars sometimes just does
  // nothing" report. ensureIsobarLayer() reflects that readiness via
  // 'satellite' existing (see its own comment). This used to retry by
  // re-running renderIsobarsView() from the top on a timer, which re-issued
  // the entire gridded fetch again every 80ms for as long as the style
  // stayed unready — on a slow connection that queued up many overlapping
  // multi-second fetches, frequently tripping Open-Meteo's rate limit and
  // leaving the view stuck with nothing ever drawn until something else
  // (e.g. a resort switch) reset the JS state. Poll ONLY for the layer to
  // attach here instead, reusing the already-fetched result — no
  // re-fetching involved.
  while (!ensureIsobarLayer()) {
    await new Promise((resolve) => setTimeout(resolve, 80));
    if (token !== isobarRenderToken || viewMode !== 'isobars') return;
  }

  if (!pressure) {
    setIsobarLayerVisible(false);
    isobarSeries = null;
    return;
  }

  // Cold-air/precipitation grids start out all-null (both overlays already
  // render as empty over an all-null grid, same as a failed fetch) and get
  // swapped in below the moment their own fetch resolves. precipLats/
  // precipLons start out as placeholders matching the (all-null, so
  // dimensionally-inconsequential) nullGrid's shape — precipitation fetches
  // over its own smaller ISOBAR_PRECIP_BBOX (see that constant's comment),
  // not the wide pressure/temperature one, so it needs its own lat/lon axes
  // once real data replaces this placeholder.
  const nullGrid = pressure.seriesGrid.map((row) => row.map(() => null));
  isobarSeries = {
    seriesGrid: pressure.seriesGrid,
    tempSeriesGrid: nullGrid,
    precipSeriesGrid: nullGrid,
    precipLats: pressure.lats, precipLons: pressure.lons,
    lats: pressure.lats, lons: pressure.lons, times: pressure.times,
  };
  setIsobarLayerVisible(true);

  // Start on whichever hour is closest to right now — forecast_days=7 runs
  // from local midnight, not from this exact moment, and the animation is
  // meant to show "from now, forward" rather than starting hours in the past.
  const nowMs = Date.now();
  let startIdx = 0, bestDiff = Infinity;
  pressure.times.forEach((t, i) => {
    const diff = Math.abs(new Date(t).getTime() - nowMs);
    if (diff < bestDiff) { bestDiff = diff; startIdx = i; }
  });
  isobarDrawFrame(startIdx); // pressure isobars visible now; cold-air/precip overlays draw as empty until their own grid arrives below

  // Small pacing gap before each of the next two variables — pressure alone
  // (4 chunk requests) is the proven-reliable shape; stacking temperature's
  // 4 and precipitation's 4 right behind it with no breathing room risks
  // tripping whatever burst/short-window rate limit previously caused
  // temperature to "quietly go empty" in production (see ISOBAR_TEMP_MODEL's
  // own comment) — now with a third variable added, that risk is higher
  // still. This delay is on the BACKGROUND overlay fetches only; the
  // pressure isobars above have already rendered by this point.
  const ISOBAR_OVERLAY_FETCH_GAP_MS = 1000;

  await sleep(ISOBAR_OVERLAY_FETCH_GAP_MS);
  if (token !== isobarRenderToken || viewMode !== 'isobars' || !isobarSeries) return;
  const temp = await fetchGriddedSeries(ISOBAR_BBOX, ISOBAR_TEMP_HOURLY_VAR, ISOBAR_TEMP_MODEL);
  if (token !== isobarRenderToken || viewMode !== 'isobars' || !isobarSeries) return;
  if (temp) {
    isobarSeries.tempSeriesGrid = temp.seriesGrid;
    isobarUpdateTempOverlay(isobarFrameIndex); // whichever frame is current NOW, not necessarily startIdx
  } else {
    console.warn('Isobars: temperature fetch failed entirely — cold-air overlay unavailable this render.');
  }

  await sleep(ISOBAR_OVERLAY_FETCH_GAP_MS);
  if (token !== isobarRenderToken || viewMode !== 'isobars' || !isobarSeries) return;
  const precip = await fetchGriddedSeries(ISOBAR_PRECIP_BBOX, ISOBAR_PRECIP_HOURLY_VAR, ISOBAR_PRECIP_MODEL);
  if (token !== isobarRenderToken || viewMode !== 'isobars' || !isobarSeries) return;
  if (precip) {
    isobarSeries.precipSeriesGrid = precip.seriesGrid;
    isobarSeries.precipLats = precip.lats;
    isobarSeries.precipLons = precip.lons;
    isobarUpdatePrecipOverlay(isobarFrameIndex);
  } else {
    console.warn('Isobars: precipitation fetch failed entirely — precipitation overlay unavailable this render.');
  }
}

let viewMode = 'hourly'; // 'hourly' | 'accumulated'
let accumDays = 5;

// Persist the map view selection so it carries across location switches (each
// resort reloads this page in the iframe, which would otherwise reset to the
// default hourly view). Same-origin localStorage survives that reload.
function pwPersist(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

// Fits the camera to the whole southern-Australia/Tasman/NZ box the isobar
// view fetches over (see ISOBAR_BBOX) — the resort's normal close-up oblique
// framing (zoom ~13, pitch ~62) would show at most a tiny sliver of an area
// this size, so the isobars would be invisible even when the fetch and
// contouring both worked perfectly. Levels the pitch out too: a
// continent-scale view tilted to a resort's usual near-horizon angle reads
// as broken, not "zoomed out."
function flyToIsobarRegion() {
  if (!map) return;
  map.fitBounds(
    [[ISOBAR_BBOX.lonMin, ISOBAR_BBOX.latMin], [ISOBAR_BBOX.lonMax, ISOBAR_BBOX.latMax]],
    { padding: 40, pitch: 0, bearing: 0, duration: 1500, essential: true }
  );
}
// Flies back to the resort's own establishing shot — used when leaving
// Isobars for any other mode, all of which expect the usual close-up view.
function flyToResortView() {
  if (!map) return;
  map.flyTo({ center: LOC.center, zoom: LOC.zoom, pitch: LOC.pitch, bearing: LOC.bearing, duration: 1500, essential: true });
}

function setViewMode(mode) {
  const prevMode = viewMode;
  // No NZ radar coverage for this resort (the US ones) — fall back rather
  // than entering a mode that can never load anything.
  if (mode === 'radar' && !RADAR_AVAILABLE) mode = 'hourly';
  // Split screen only has meaning for the hourly forecast — it compares two
  // models' hourly drapes, and none of the other modes have a per-model
  // breakdown at all. Leave it on the way out rather than stranding a second
  // map showing a stale hour behind the new view.
  if (splitMode && mode !== 'hourly') exitSplitMode();
  viewMode = mode;
  pwPersist('sp-view-mode', mode);
  // Tell the host page which layer is showing, so it can put it in the URL
  // ("/map/<resort>/<mode>") — that's what makes layer usage visible in the
  // per-path analytics breakdown, and what makes a layer link shareable.
  // Harmless when this page is opened directly: postMessage to self.
  try { window.parent.postMessage({ type: 'map-view-mode', mode }, '*'); } catch (e) {}
  document.querySelectorAll('#mode-switch .pill-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('period-switch').style.display = mode === 'accumulated' ? 'flex' : 'none';
  // No forecast data backs the Live temperature map, the Radar map, or the
  // Isobars map (none of them have a per-model breakdown), so the model
  // switcher has nothing to do there.
  document.getElementById('model-switch').style.display = (mode === 'live' || mode === 'radar' || mode === 'isobars') ? 'none' : 'block';
  syncTopControlsLayout();
  if (mode === 'live') closeModelMenu();
  document.getElementById('timeline').style.display = mode === 'hourly' ? 'flex' : 'none';
  document.getElementById('speed-select').style.display = mode === 'hourly' ? 'flex' : 'none';
  document.getElementById('info-hourly').style.display = mode === 'hourly' ? 'block' : 'none';
  document.getElementById('info-accum').style.display = mode === 'accumulated' ? 'block' : 'none';
  // Resorts with no PredictWind stations configured (PW_STATIONS empty —
  // see PW_CONFIG) have nothing to show here but an endless "Couldn't load
  // observations… Retrying…" loop, since there's no data source to ever
  // resolve. Skip the panel entirely for them rather than leaving that
  // stuck message up.
  const showLivePanel = mode === 'live' && PW_STATIONS.length > 0;
  document.getElementById('info-live').style.display = showLivePanel ? 'block' : 'none';
  // Radar and Isobars have no info-* panel of their own — none of the three
  // above ever show for them, which used to leave #snow-info's own
  // background/padding/shadow chrome floating bottom-left with nothing
  // inside it (the reported blank rounded box). Hide the whole drawer for
  // those two modes (and for Live when there's no station data to show)
  // instead of just its (already-empty) children.
  document.getElementById('snow-info').style.display =
    (mode === 'radar' || mode === 'isobars' || (mode === 'live' && !showLivePanel)) ? 'none' : '';
  // Radar is the one exception to the line above: with the accumulation drape
  // on it DOES have a panel (the mm legend), so this puts the drawer back.
  radarSyncAccumPanel();
