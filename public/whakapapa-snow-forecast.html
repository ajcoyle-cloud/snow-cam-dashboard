    `;
    const el = wrap.querySelector('.resort-pill');
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isSelf) {
        // This resort's own pill — same map instance, so flying back to its
        // default always lands exactly right. Ramp auto-rotate back in once
        // it settles (the pill click itself stopped rotation via the
        // interaction listener).
        map.flyTo({ center: r.center, zoom: r.zoom, pitch: r.pitch, bearing: r.bearing, duration: 2000, essential: true });
        map.once('moveend', () => {
          if (typeof window.__startAutoRotateRampIn === 'function') window.__startAutoRotateRampIn();
        });
        return;
      }
      // Switching to a DIFFERENT resort — fly this same map instance there
      // and swap its data on arrival (see switchResort above). The terrain
      // is one shared global DEM (not resort-bounded), so tiles for the
      // destination load in along the way same as any ordinary pan/zoom.
      switchResort(key);
    });
    // anchor 'bottom' puts the dot (not the pill) exactly on the resort's
    // coordinate — the pill floats above it, clear of the terrain.
    resortPillMarkers[key] = new maplibregl.Marker({ element: wrap, anchor: 'bottom' }).setLngLat([r.lon, r.lat]).addTo(map);
    const stemEl = wrap.querySelector('.resort-pill-stem');
    stemEl.style.height = `${el.offsetWidth}px`;
  });
  updateResortPillVisibility();
  map.on('zoom', updateResortPillVisibility);
}

// Build one model's hourly series. GFS exposes a direct freezing-level field
// and precip/wind; the other models don't, so their freezing level is derived
// the same way the main dashboard does it — linear interpolation between a
// summit and base temperature sample — and they borrow GFS's precip/wind
// (the only source that has it) rather than going without.
// gfsBaseHourly is always GFS's own base-elevation fetch (windspeed_850hPa/
// winddirection_850hPa), regardless of which model's summit/base this row
// otherwise comes from — only GFS requests wind at all (see
// forecastUrlsFor), same reasoning as the existing `gfs` param for the
// summit-level (700hPa) wind below.
function buildModelHours(summit, base, gfs, gfsBaseHourly) {
  if (!summit) return null;
  const useDirectFL = !!summit.freezinglevel_height;
  return summit.time.map((t, i) => {
    const summitT = summit.temperature_2m[i];
    const baseT = base?.temperature_2m?.[i] ?? null;
    let fl = useDirectFL ? summit.freezinglevel_height[i] : null;
    if (fl == null && baseT != null && summitT != null && baseT !== summitT) {
      fl = LOC.baseElev + (baseT * (LOC.summitElev - LOC.baseElev)) / (baseT - summitT);
    }
    let snowMm = summit.snowfall?.[i] != null
      ? Math.min(summit.snowfall[i] * 10, MAX_HOURLY_SNOWFALL_MM)
      : null;
    // Some models (notably AIFS, which predicts total precip but has no true
    // rain/snow-separation microphysics) intermittently report 0mm snowfall
    // despite sub-zero temps and real precipitation — a known upstream data
    // gap, not an absence of snow. Estimate from precip using the same ~7:1
    // snow-to-liquid ratio the main dashboard falls back to in this case.
    const summitPrecip = summit.precipitation?.[i] ?? null;
    if (summitT < 0 && summitPrecip > 0 && snowMm === 0) {
      snowMm = Math.min(summitPrecip * 7, MAX_HOURLY_SNOWFALL_MM);
    }

    // Wet-bulb snow/sleet boundaries. Open-Meteo downscales wet-bulb to each
    // elevation we request, so a summit and a base reading give a wet-bulb
    // lapse we can solve for the two elevations that matter: where wet-bulb
    // crosses WET_BULB_SNOW_MAX_C (snow above it) and where it crosses
    // WET_BULB_RAIN_MIN_C (rain below it). Between them is sleet.
    //
    // This replaces the flat freezing-level-minus-300m snow line for the
    // drape: 300m was a fixed stand-in for exactly this crossing, and it's
    // only right for one particular humidity. Both stay null when the model
    // has no wet-bulb or the profile is degenerate, and every consumer falls
    // back to the old SNOW_OFFSET rule in that case.
    const summitWB = summit.wet_bulb_temperature_2m?.[i] ?? null;
    const baseWB = base?.wet_bulb_temperature_2m?.[i] ?? null;
    const wbElevAt = (target) => {
      if (summitWB == null || baseWB == null || summitWB === baseWB) return null;
      return LOC.baseElev + (target - baseWB) * (LOC.summitElev - LOC.baseElev) / (summitWB - baseWB);
    };
    const snowLineWB = wbElevAt(WET_BULB_SNOW_MAX_C);
    const rainLineWB = wbElevAt(WET_BULB_RAIN_MIN_C);

    return {
      time: t,
      temp: summitT,
      baseTemp: baseT,
      summitWetBulb: summitWB,
      baseWetBulb: baseWB,
      snowLineWB,
      rainLineWB,
      precip: gfs?.precipitation?.[i] ?? null,
      snowfallMm: snowMm,
      freezingLevel: fl,
      windSpeedKmh: gfs?.windspeed_700hPa?.[i] ?? null,
      windDirDeg: gfs?.winddirection_700hPa?.[i] ?? null,
      // Base-elevation (850hPa) wind — used to interpolate a base-to-summit
      // wind gradient in the orographic overlay instead of applying the
      // summit-level reading uniformly at every elevation. null when
      // gfsBaseHourly wasn't fetched/available (e.g. demo fallback data);
      // callers fall back to the summit vector in that case.
      windSpeedKmhBase: gfsBaseHourly?.windspeed_850hPa?.[i] ?? null,
      windDirDegBase: gfsBaseHourly?.winddirection_850hPa?.[i] ?? null
    };
  }).filter(r => r.temp != null && r.freezingLevel != null && r.snowfallMm != null);
}

// The "Average" model — mean of every loaded model's temp/snowfall/freezing
// level per hour. Precip/wind aren't averaged (only GFS has them at all).
function buildAverageHours(sources) {
  const loaded = sources.filter(Boolean);
  if (loaded.length === 0) return null;
  const base = loaded.reduce((longest, s) => s.length > longest.length ? s : longest, loaded[0]);
  return base.map((_, i) => {
    const rows = loaded.map(s => s[i]).filter(Boolean);
    if (rows.length === 0) return null;
    const avg = (pick) => {
      const vals = rows.map(pick).filter(v => v != null);
      return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
    };
    // Median for snowfall — UKMO consistently forecasts higher than
    // GFS/ECMWF/AIFS for this region, and a mean lets that one outlier drag
    // the accumulated total up every hour. Median excludes whichever model
    // is consistently highest (or lowest) instead of diluting toward it.
    const median = (pick) => {
      const vals = rows.map(pick).filter(v => v != null).sort((a, b) => a - b);
      if (!vals.length) return null;
      const mid = Math.floor(vals.length / 2);
      return vals.length % 2 !== 0 ? vals[mid] : (vals[mid - 1] + vals[mid]) / 2;
    };
    const first = rows[0];
    // Average the wet-bulb readings, then re-solve the snow/rain crossings from
    // those — averaging the crossing ELEVATIONS directly would let one model
    // with a degenerate (null) profile silently drop out of the mean at a
    // different set of hours than the wet-bulb it came from.
    const summitWB = avg(r => r.summitWetBulb);
    const baseWB = avg(r => r.baseWetBulb);
    const wbElevAt = (target) => (summitWB == null || baseWB == null || summitWB === baseWB)
      ? null
      : LOC.baseElev + (target - baseWB) * (LOC.summitElev - LOC.baseElev) / (summitWB - baseWB);
    return {
      time: first.time,
      temp: avg(r => r.temp),
      baseTemp: avg(r => r.baseTemp),
      summitWetBulb: summitWB,
      baseWetBulb: baseWB,
      snowLineWB: wbElevAt(WET_BULB_SNOW_MAX_C),
      rainLineWB: wbElevAt(WET_BULB_RAIN_MIN_C),
      precip: first.precip,
      snowfallMm: median(r => r.snowfallMm),
      freezingLevel: avg(r => r.freezingLevel),
      windSpeedKmh: first.windSpeedKmh,
      windDirDeg: first.windDirDeg,
      windSpeedKmhBase: first.windSpeedKmhBase,
      windDirDegBase: first.windDirDegBase
    };
  }).filter(Boolean).filter(r => r.temp != null && r.freezingLevel != null && r.snowfallMm != null);
}

// The 8 Open-Meteo requests one resort's forecast needs (summit+base for
// each of GFS/ECMWF/AIFS/UKMO). Shared between this page's own fetch and the
// background prefetch of every OTHER resort, so both build identical URLs
// (required for the response cache below to actually hit).
function forecastUrlsFor(r) {
  const base = `https://api.open-meteo.com/v1/forecast?latitude=${r.lat}&longitude=${r.lon}&temperature_unit=celsius&timezone=${r.timezone}&forecast_days=16`;
  return {
    gfsSummitUrl: `${base}&wind_speed_unit=kmh&elevation=${r.summitElev}&hourly=temperature_2m,wet_bulb_temperature_2m,precipitation,snowfall,freezinglevel_height,windspeed_700hPa,winddirection_700hPa&models=gfs_global`,
    // windspeed_850hPa/winddirection_850hPa (~1500m, roughly base-elevation)
    // feeds the orographic overlay's base-to-summit wind interpolation (see
    // buildModelHours/orographicsnow:// protocol) — same field the Forecast
    // tab's own separate fetch already uses for its base-level wind.
    gfsBaseUrl: `${base}&wind_speed_unit=kmh&elevation=${r.baseElev}&hourly=temperature_2m,wet_bulb_temperature_2m,windspeed_850hPa,winddirection_850hPa&models=gfs_global`,
    ecmwfSummitUrl: `${base}&elevation=${r.summitElev}&hourly=temperature_2m,wet_bulb_temperature_2m,precipitation,snowfall&models=ecmwf_ifs025`,
    ecmwfBaseUrl: `${base}&elevation=${r.baseElev}&hourly=temperature_2m,wet_bulb_temperature_2m&models=ecmwf_ifs025`,
    aifsSummitUrl: `${base}&elevation=${r.summitElev}&hourly=temperature_2m,wet_bulb_temperature_2m,precipitation,snowfall&models=ecmwf_aifs025_single`,
    aifsBaseUrl: `${base}&elevation=${r.baseElev}&hourly=temperature_2m,wet_bulb_temperature_2m&models=ecmwf_aifs025_single`,
    ukmoSummitUrl: `${base}&elevation=${r.summitElev}&hourly=temperature_2m,wet_bulb_temperature_2m,precipitation,snowfall&models=ukmo_seamless`,
    ukmoBaseUrl: `${base}&elevation=${r.baseElev}&hourly=temperature_2m,wet_bulb_temperature_2m&models=ukmo_seamless`,
  };
}

async function loadForecast() {
  const {
    gfsSummitUrl, gfsBaseUrl, ecmwfSummitUrl, ecmwfBaseUrl,
    aifsSummitUrl, aifsBaseUrl, ukmoSummitUrl, ukmoBaseUrl
  } = forecastUrlsFor(LOC);

  // Kicked off here (not awaited yet) so it runs concurrently with the main
  // 8-request Promise.all below rather than adding serial latency — see
  // elevationBandUrlsFor's doc comment for why this is GFS-only.
  const bandDefs = elevationBandUrlsFor(LOC);
  const bandFetchPromise = Promise.all(bandDefs.map((b) => fetchJsonCached(b.url)));

  // GFS is the heaviest request (more fields than the other three, and the
  // one other models' precip/wind rows borrow via buildModelHours' 3rd arg)
  // so it gets more timeout headroom and an extra retry — but it is NOT a
  // single point of failure for the other three: each model below is built
  // independently, so GFS having a bad day doesn't throw away perfectly
  // good ECMWF/AIFS/UKMO data. (buildModelHours' `gfs` param is read with
  // `?.` throughout, so passing it null when GFS failed just means those
  // rows lack precip/wind, not that the whole model comes back null — its
  // temp/freezing-level/snowfall come from the model's own summit/base data.)
  // The 2-day demo placeholder is now only the fallback of last resort when
  // truly nothing came back at all, not whenever GFS specifically was slow.
  const gfsFetchOpts = { timeoutMs: 15000, retries: 2 };
  const [gfs, gfsBaseJson, ecmwfSummitJson, ecmwfBaseJson, aifsSummitJson, aifsBaseJson, ukmoSummitJson, ukmoBaseJson] = await Promise.all([
    fetchJsonCached(gfsSummitUrl, gfsFetchOpts), fetchJsonCached(gfsBaseUrl, gfsFetchOpts),
    fetchJsonCached(ecmwfSummitUrl), fetchJsonCached(ecmwfBaseUrl),
    fetchJsonCached(aifsSummitUrl), fetchJsonCached(aifsBaseUrl),
    fetchJsonCached(ukmoSummitUrl), fetchJsonCached(ukmoBaseUrl),
  ]);
  const gfsHourly = gfs ? gfs.hourly : null;
  const gfsBase = gfsBaseJson ? gfsBaseJson.hourly : null;
  const ecmwfSummit = ecmwfSummitJson ? ecmwfSummitJson.hourly : null;
  const ecmwfBase = ecmwfBaseJson ? ecmwfBaseJson.hourly : null;
  const aifsSummit = aifsSummitJson ? aifsSummitJson.hourly : null;
  const aifsBase = aifsBaseJson ? aifsBaseJson.hourly : null;
  const ukmoSummit = ukmoSummitJson ? ukmoSummitJson.hourly : null;
  const ukmoBase = ukmoBaseJson ? ukmoBaseJson.hourly : null;

  modelHours.gfs = gfsHourly ? buildModelHours(gfsHourly, gfsBase, gfsHourly, gfsBase) : null;
  modelHours.ecmwf = ecmwfSummit ? buildModelHours(ecmwfSummit, ecmwfBase, gfsHourly, gfsBase) : null;
  modelHours.aifs = aifsSummit ? buildModelHours(aifsSummit, aifsBase, gfsHourly, gfsBase) : null;
  modelHours.ukmo = ukmoSummit ? buildModelHours(ukmoSummit, ukmoBase, gfsHourly, gfsBase) : null;
  modelHours.average = buildAverageHours([modelHours.gfs, modelHours.ecmwf, modelHours.aifs, modelHours.ukmo]);

  if (!modelHours.gfs && !modelHours.ecmwf && !modelHours.aifs && !modelHours.ukmo) {
    // Every model failed — genuinely nothing to show, not just GFS being slow.
    modelHours = { gfs: buildDemoForecast(), ecmwf: null, aifs: null, ukmo: null, average: null };
  }

  // Resolve the elevation-band fetch kicked off above. A band that failed
  // (null hourly) becomes null in the array rather than throwing — same
  // "missing data degrades gracefully" contract as the model fetches above;
  // computeElevationBandTotals/getDepthAtElevation fall back to the old
  // straight-line taper if too few bands came back to interpolate between.
  const bandJsons = await bandFetchPromise;
  elevationBandHours = bandDefs.map((b, i) => {
    const hourly = bandJsons[i] ? bandJsons[i].hourly : null;
    if (!hourly || !hourly.time) return null;
    return {
      elev: b.elev,
      hours: hourly.time.map((t, idx) => {
        const temp = hourly.temperature_2m?.[idx] ?? null;
        const precip = hourly.precipitation?.[idx] ?? 0;
        let snowCm = hourly.snowfall?.[idx] || 0;
        // Same fallback ratio buildModelHours uses (see its own comment) —
        // applied at THIS elevation's own temperature, not borrowed from the
        // summit/base pair, so a band's fallback actually reflects whether
        // that specific elevation was below freezing.
        if (temp != null && temp < 0 && precip > 0 && snowCm === 0) {
          snowCm = Math.min(precip * 7, MAX_HOURLY_SNOWFALL_MM) / 10;
        }
        return { time: t, snowCm };
      }),
    };
  });

  restoreSelectedModel();
  buildModelMenu();
  forecastHours = modelHours[selectedModel] || modelHours.average
    || modelHours.gfs || modelHours.ecmwf || modelHours.aifs || modelHours.ukmo || [];
  openFromQueryParams();
  // restoreMapSettings() (map 'load' handler) may have already called
  // renderHiResAccum() once — but that can easily land before this async
  // weather fetch resolves, rendering an empty/blank drape (hiResAccumWindow
  // returns [] with no forecastHours yet). Re-render now that real data
  // just arrived, so the Accumulated view never gets stuck on that blank
  // first pass. openFromQueryParams() above already ran openMapView(), so
  // map/initMap() are guaranteed to exist by this point.
  if (isHighResMode) renderHiResAccum();
  // Quietly warm the cache for every other resort now that this one's own
  // (much more urgent) load is done, so tapping a resort pill later finds
  // that resort's weather data already sitting in sessionStorage instead of
  // waiting on a fresh 8-request fetch after the fly-in animation lands.
  prefetchOtherResorts();
}

// Which model is shown persists across resort switches (this page reloads
// fresh in the iframe each time), same pattern as restoreViewMode() below.
// High-Res is exempt from that persistence: it shares the same
// 'sp-map-model' localStorage key as the regular Map tab, so switching
// models there (e.g. to compare ECMWF) would silently carry over here too —
// and because High-Res's wind-redistributed totals scale directly off
// whichever model is active, that made its numbers look wildly inflated with
// no visible explanation. Always starting High-Res on one fixed model keeps
// it predictable; a user can still switch models manually within this one
// session via the dropdown, it just won't persist as the default.
//
// That fixed model is now GFS rather than the blended average: average is no
// longer offered in the dropdown, and leaving High-Res anchored on it would
// have shown a label with no matching (or active) entry in the list.
function restoreSelectedModel() {
  if (isHighResMode) { selectedModel = 'gfs'; return; }
  let saved = null;
  try { saved = localStorage.getItem('sp-map-model'); } catch (e) {}
  // MODEL_META, not just modelHours — a previously persisted 'average' still
  // has a built series behind it, so without this check it would keep being
  // restored as the active model after being removed from the options.
  selectedModel = (saved && MODEL_META[saved] && modelHours[saved]) ? saved : 'gfs';
}

function selectModel(key) {
  if (!modelHours[key] || key === selectedModel) { closeModelMenu(); return; }
  selectedModel = key;
  pwPersist('sp-map-model', key);
  forecastHours = modelHours[key];
  buildModelMenu();
  closeModelMenu();
  if (viewMode === 'accumulated') renderAccumulatedView();
  else if (viewMode === 'hourly') openMapView(Math.min(currentIndex, forecastHours.length - 1));
}

// Selectable models. 'average' is deliberately absent — the blended series is
// still computed (see modelHours.average) and still serves as the fallback when
// the chosen model has no data for a resort, it's just not offered as a choice
// here any more.
const MODEL_META = {
  gfs: { label: 'GFS Model', color: '#3b82f6' },
  ecmwf: { label: 'ECMWF IFS', color: '#10b981' },
  aifs: { label: 'AIFS', color: '#f59e0b' },
  ukmo: { label: 'UKMO', color: '#f472b6' },
};

function buildModelMenu() {
  const btn = document.getElementById('model-switch-label');
  const list = document.getElementById('model-switch-list');
  if (!btn || !list) return;
  btn.textContent = MODEL_META[selectedModel]?.label || 'GFS Model';
  list.innerHTML = Object.keys(MODEL_META).map(key => {
    const available = !!modelHours[key];
    const active = key === selectedModel;
    return `<button class="model-option ${active ? 'active' : ''}" ${available ? '' : 'disabled'} onclick="selectModel('${key}')">
      <span class="model-option-swatch" style="background:${MODEL_META[key].color}"></span>
      ${MODEL_META[key].label}
    </button>`;
  }).join('');
  // Label text width just changed, which shifts #model-switch's left edge —
  // recompute the Live/Hourly/Accum/Radar (+period) group's clearance.
  syncTopControlsLayout();
}

// Desktop-only: #top-controls is left-anchored at 50%+8px and grows
// rightward as the Accum-mode period-switch appears, while #model-switch is
// independently right-anchored — on narrower desktop/laptop widths (or a
// wide model label like "ECMWF IFS") there isn't always enough room between
// them, so cap #top-controls to whatever space is actually free rather than
// letting it run into the model switch. overflow-x:auto (see CSS) makes the
// pills scroll into view in that squeezed case instead of overlapping.
function syncTopControlsLayout() {
  const topControls = document.getElementById('top-controls');
  const modelSwitch = document.getElementById('model-switch');
  if (!topControls || !modelSwitch) return;
  if (window.innerWidth <= 700) { topControls.style.maxWidth = ''; return; }
  if (getComputedStyle(modelSwitch).display === 'none') { topControls.style.maxWidth = ''; return; }
  const gap = 10;
  const modelLeft = modelSwitch.getBoundingClientRect().left;
  const topControlsLeft = topControls.getBoundingClientRect().left;
  topControls.style.maxWidth = Math.max(120, modelLeft - topControlsLeft - gap) + 'px';
}
window.addEventListener('resize', syncTopControlsLayout);

function toggleModelMenu() {
  document.getElementById('model-switch').classList.toggle('open');
}

// ── Split-screen model comparison ──────────────────────────────────────────
// Two MapLibre instances side by side, linked cameras, one timeline. Pane A is
// the existing `map`/`selectedModel` — everything already built (timeline,
// probe, drawer, snowfall marker) keeps running off it untouched, and pane B is
// purely additive: a second map that renders the same style with a different
// model's ramp. That's deliberate; making every existing global "two of
// everything" would have meant rewriting most of this file.
let splitMode = false;
let mapB = null;
let splitModelB = 'ecmwf';
let syncingCamera = false;   // guards the two-way camera sync against feedback
let applyRampTokenB = 0;

// Models are fetched on the same Open-Meteo time grid, but buildModelHours
// drops rows with missing fields, so the two panes' arrays can be different
// lengths and index i is NOT guaranteed to be the same hour in both. Always
// match on the timestamp instead. Memoised per model since the timeline scrubs
// hundreds of times per session.
let splitTimeIndexCache = {};
function hoursByTime(modelKey) {
  const hours = modelHours[modelKey];
  if (!hours) return null;
  const cached = splitTimeIndexCache[modelKey];
  if (cached && cached.src === hours) return cached.map;
  const map_ = new Map();
  hours.forEach((h) => map_.set(h.time, h));
  splitTimeIndexCache[modelKey] = { src: hours, map: map_ };
  return map_;
}
function splitHourAt(modelKey, isoTime) {
  const byTime = hoursByTime(modelKey);
  return byTime ? (byTime.get(isoTime) || null) : null;
}

function initMapB() {
  if (mapB) return;
  mapB = new maplibregl.Map({
    container: 'map-b',
    zoom: map ? map.getZoom() : LOC.zoom,
    center: map ? map.getCenter() : LOC.center,
    pitch: map ? map.getPitch() : LOC.pitch,
    bearing: map ? map.getBearing() : LOC.bearing,
    maxPitch: 85,
    attributionControl: false,
    style: buildMapStyle()
  });
  // The only on-map control set while split — the left map's own cluster is
  // hidden in CSS because its top-right corner is the divider. Linked cameras
  // mean driving either map moves both, so one cluster is enough.
  mapB.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showZoom: true, showCompass: true }), 'top-right');
  // Two-way camera link. Either map can be driven directly; whichever moved
  // pushes its camera to the other. jumpTo (not easeTo) so the follower lands
  // in the same frame — easing here reads as the panes lagging each other.
  const link = (from, to) => from.on('move', () => {
    if (syncingCamera || !splitMode) return;
    syncingCamera = true;
    to.jumpTo({
      center: from.getCenter(), zoom: from.getZoom(),
      pitch: from.getPitch(), bearing: from.getBearing()
    });
    syncingCamera = false;
  });
  link(map, mapB);
  link(mapB, map);
}

// Same deferred-apply dance as applyRampWhenReady, against pane B's instance:
// the color-relief layer isn't queryable until its style has attached.
function applyRampToMapB(rampArray) {
  if (!mapB) return;
  const token = ++applyRampTokenB;
  const tryApply = () => {
    if (token !== applyRampTokenB) return;
    if (mapB.getLayer('snow-relief')) mapB.setPaintProperty('snow-relief', 'color-relief-color', rampArray);
    else setTimeout(tryApply, 80);
  };
  tryApply();
}

function toggleSplitMode() {
  // The desktop-only guard gates ENTERING only. Gating both directions meant a
  // window narrowed below the breakpoint while split was on could never be
  // toggled back out — it just sat there with two ~190px panes.
  if (splitMode) { exitSplitMode(); return; }
  if (window.innerWidth <= 700) return;
  enterSplitMode();
}

function enterSplitMode() {
  if (viewMode !== 'hourly') setViewMode('hourly');
  splitMode = true;
  document.getElementById('map-screen').classList.add('split-mode');
  document.getElementById('split-toggle').classList.add('active');
  // Two 3D maps want every pixel of width available.
  enterFullscreenView();
  // Default pane B to a model that isn't pane A, so the comparison is
  // meaningful the instant it opens rather than showing the same map twice.
  if (splitModelB === selectedModel) {
    splitModelB = Object.keys(MODEL_META).find(k => k !== selectedModel && modelHours[k]) || splitModelB;
  }
  initMapB();
  buildSplitSelectors();
  // The containers just changed size; MapLibre only re-reads that on resize.
  requestAnimationFrame(() => { try { map && map.resize(); mapB && mapB.resize(); } catch (e) {} });
  renderSplitAll();
}

function exitSplitMode() {
  splitMode = false;
  document.getElementById('map-screen').classList.remove('split-mode');
  document.getElementById('split-toggle').classList.remove('active');
  requestAnimationFrame(() => { try { map && map.resize(); mapB && mapB.resize(); } catch (e) {} });
  // Hand the bottom graph back to the single-model sparkline.
  pwRenderFreezingOverlay();
}

function buildSplitSelectors() {
  const fill = (el, selected) => {
    if (!el) return;
    el.innerHTML = Object.keys(MODEL_META)
      .filter(k => modelHours[k])
      .map(k => `<option value="${k}" ${k === selected ? 'selected' : ''}>${MODEL_META[k].label}</option>`)
      .join('');
  };
  fill(document.getElementById('split-model-a'), selectedModel);
  fill(document.getElementById('split-model-b'), splitModelB);
  const sa = document.getElementById('split-swatch-a');
  const sb = document.getElementById('split-swatch-b');
  if (sa) sa.style.background = MODEL_META[selectedModel]?.color || '#fff';
  if (sb) sb.style.background = MODEL_META[splitModelB]?.color || '#fff';
}

function setSplitModel(pane, key) {
  if (!modelHours[key]) return;
  if (pane === 'a') {
    // Pane A is the real selectedModel, so route through the normal path —
    // that keeps forecastHours, the timeline length and the probe consistent.
    selectModel(key);
  } else {
    splitModelB = key;
  }
  buildSplitSelectors();
  renderSplitAll();
}

// Everything that has to redraw when the hour or either model changes.
function renderSplitAll() {
  if (!splitMode) return;
  renderSplitPaneB();
  renderSplitDelta();
  renderSplitComparisonOverlay();
  renderDivergenceStrip();
}

// Pane B's drape for whatever hour pane A is currently showing.
function renderSplitPaneB() {
  const aHour = forecastHours[currentIndex];
  if (!aHour) return;
  const bHour = splitHourAt(splitModelB, aHour.time);
  applyRampToMapB(buildSnowRamp(bHour));
}

// One pane's headline numbers for an hour: snow line and this hour's rate.
function splitPaneStats(hour) {
  if (!hour) return '—';
  const snowing = hour.snowfallMm >= SNOWFALL_THRESHOLD_MM;
  const line = snowing
    ? (hour.snowLineWB != null ? hour.snowLineWB : hour.freezingLevel - SNOW_OFFSET)
    : hour.freezingLevel;
  return `${Math.round(line)}m · ${(hour.snowfallMm / 10).toFixed(2)}cm/hr`;
}

function renderSplitDelta() {
  const aHour = forecastHours[currentIndex];
  if (!aHour) return;
  const bHour = splitHourAt(splitModelB, aHour.time);

  const statsA = document.getElementById('split-stats-a');
  const statsB = document.getElementById('split-stats-b');
  if (statsA) statsA.textContent = splitPaneStats(aHour);
  if (statsB) statsB.textContent = splitPaneStats(bHour);

  const row = document.getElementById('sd-row');
  const agree = document.getElementById('sd-agree');
  if (!row) return;
  if (!bHour) {
    row.innerHTML = '<div class="sd-item"><span class="sd-val">—</span></div>';
    if (agree) agree.textContent = '';
    return;
  }

  const snowLineOf = (h) => (h.snowfallMm >= SNOWFALL_THRESHOLD_MM)
    ? (h.snowLineWB != null ? h.snowLineWB : h.freezingLevel - SNOW_OFFSET)
    : h.freezingLevel;
  const dFreeze = aHour.freezingLevel - bHour.freezingLevel;
  const dSnowLine = snowLineOf(aHour) - snowLineOf(bHour);
  const dRate = (aHour.snowfallMm - bHour.snowfallMm) / 10; // cm/hr

  // Totals across the whole forecast, so a small hourly gap that persists all
  // storm is still visible as the big number it adds up to.
  let totalA = 0, totalB = 0;
  forecastHours.forEach((h) => {
    const b = splitHourAt(splitModelB, h.time);
    if (!b) return;
    totalA += h.snowfallMm / 10;
    totalB += b.snowfallMm / 10;
  });
  const dTotal = totalA - totalB;

  // Signed, and coloured by which model is higher, so the direction of the
  // disagreement is readable without doing the subtraction yourself.
  const sgn = (v, digits, unit) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(digits)}${unit}`;
  const colorFor = (v) => v === 0 ? 'rgba(255,255,255,0.75)'
    : (v > 0 ? MODEL_META[selectedModel]?.color : MODEL_META[splitModelB]?.color) || '#fff';
  const item = (label, val, color) =>
    `<div class="sd-item"><span class="sd-label">${label}</span><span class="sd-val" style="color:${color}">${val}</span></div>`;

  row.innerHTML =
    item('Snow line', sgn(dSnowLine, 0, 'm'), colorFor(dSnowLine)) +
    item('Freezing', sgn(dFreeze, 0, 'm'), colorFor(dFreeze)) +
    item('This hr', sgn(dRate, 2, 'cm'), colorFor(dRate)) +
    item('Total', sgn(dTotal, 1, 'cm'), colorFor(dTotal));

  if (agree) {
    // A blunt but useful summary of "should I trust this forecast?": models
    // agreeing closely on both depth and where the snow line sits is a much
    // stronger signal than either model on its own.
    const rateScale = Math.max(0.2, Math.max(aHour.snowfallMm, bHour.snowfallMm) / 10);
    const score = Math.max(0, 100 - (Math.abs(dSnowLine) / 4) - (Math.abs(dRate) / rateScale) * 45);
    const band = score >= 80 ? ['Strong agreement', '#34d399']
      : score >= 55 ? ['Broad agreement', '#a3e635']
      : score >= 30 ? ['Notable spread', '#fbbf24']
      : ['Models disagree', '#f87171'];
    agree.textContent = band[0];
    agree.style.color = band[1];
  }
}

// The bottom graph, in split mode: both models' freezing level as a line and
// their snowfall as a filled area, in each model's own colour, on one shared
// pair of scales. Overlaying them (rather than giving each pane its own graph)
// is the whole point — the gap between the two lines IS the disagreement, and
// it's directly readable as vertical distance.
function renderSplitComparisonOverlay() {
  const host = document.getElementById('fl-overlay');
  if (!host) return;
  const aHours = forecastHours;
  if (!aHours || aHours.length < 2) { host.style.display = 'none'; return; }

  host.style.display = 'block';
  const W = host.clientWidth || 280, H = host.clientHeight || 150;
  const P = { l: 12, r: 12, t: 16, b: 8 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  if (pw <= 0 || ph <= 0) { host.style.display = 'none'; return; }

  // Freezing level occupies the upper 62%, snowfall the lower 38% — they're
  // different units, so they get separate bands rather than a shared axis.
  const flH = ph * 0.62, snowH = ph * 0.30, snowTop = P.t + ph - snowH;

  const series = [
    { key: selectedModel, hours: aHours },
    { key: splitModelB, hours: aHours.map(h => splitHourAt(splitModelB, h.time)) }
  ];

  const flVals = [];
  let maxSnow = 0;
  series.forEach(s => s.hours.forEach(h => {
    if (!h) return;
    if (h.freezingLevel != null) flVals.push(h.freezingLevel);
    if (h.snowfallMm != null) maxSnow = Math.max(maxSnow, h.snowfallMm);
  }));
  if (flVals.length < 2) { host.style.display = 'none'; return; }

  let lo = Math.min(...flVals), hi = Math.max(...flVals);
  if (hi - lo < 150) { const m = (hi + lo) / 2; lo = m - 75; hi = m + 75; }
  const padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
  if (maxSnow <= 0) maxSnow = 1;

  const X = (i) => P.l + (aHours.length === 1 ? 0 : i / (aHours.length - 1)) * pw;
  const YF = (v) => P.t + flH - ((v - lo) / (hi - lo)) * flH;
  const YS = (mm) => P.t + ph - (mm / maxSnow) * snowH;

  let out = '';
  series.forEach((s) => {
    const color = MODEL_META[s.key]?.color || '#fff';
    // Snowfall first so the freezing-level lines always sit on top of it.
    let area = '', started = false;
    s.hours.forEach((h, i) => {
      if (!h || h.snowfallMm == null) return;
      area += `${started ? 'L' : 'M'}${X(i).toFixed(1)},${YS(h.snowfallMm).toFixed(1)}`;
      started = true;
    });
    if (started) {
      const lastI = s.hours.length - 1;
      out += `<path d="${area} L${X(lastI).toFixed(1)},${(P.t + ph).toFixed(1)} L${X(0).toFixed(1)},${(P.t + ph).toFixed(1)} Z" fill="${color}" fill-opacity="0.22"/>`;
      out += `<path d="${area}" fill="none" stroke="${color}" stroke-width="1.4" stroke-opacity="0.85"/>`;
    }
    // Freezing level.
    let d = '', begun = false;
    s.hours.forEach((h, i) => {
      if (!h || h.freezingLevel == null) return;
      d += `${begun ? 'L' : 'M'}${X(i).toFixed(1)},${YF(h.freezingLevel).toFixed(1)}`;
      begun = true;
    });
    if (begun) out += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>`;
  });

  // Divider between the two bands, and the current-hour cursor.
  out += `<line x1="${P.l}" y1="${snowTop.toFixed(1)}" x2="${(P.l + pw).toFixed(1)}" y2="${snowTop.toFixed(1)}" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>`;
  const cx = X(currentIndex);
  out += `<line x1="${cx.toFixed(1)}" y1="${P.t}" x2="${cx.toFixed(1)}" y2="${(P.t + ph).toFixed(1)}" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>`;

  const svg = host.querySelector('svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = out;

  // Caption doubles as the legend: each model named in the colour its own two
  // curves are drawn in, so the graph needs no separate key.
  const cap = document.getElementById('fl-caption');
  if (cap) {
    const chip = (k) => `<span style="color:${MODEL_META[k]?.color || '#fff'}">${MODEL_META[k]?.label || k}</span>`;
    cap.innerHTML = `${chip(selectedModel)} <span style="opacity:0.45">vs</span> ${chip(splitModelB)} <span style="opacity:0.45">· freezing level / snowfall</span>`;
  }
}

// Per-hour disagreement across the whole forecast, as a strip above the
// timeline. Height and colour both key off how far apart the models are that
// hour, so a glance finds the periods worth actually looking at — that's much
// faster than scrubbing 384 hours hunting for where they diverge.
let divergeBarsKey = null;
let divergeBarsMarkup = '';

function renderDivergenceStrip() {
  const host = document.getElementById('split-diverge');
  const svg = document.getElementById('split-diverge-svg');
  if (!host || !svg || !forecastHours || !forecastHours.length) return;
  const W = host.clientWidth || 400, H = host.clientHeight || 26;
  const n = forecastHours.length;

  // The bars only change when the models, the data or the width change — but
  // the cursor moves on every timeline tick. Rebuilding ~380 rects of SVG for
  // each tick of playback was pure waste, so cache the bar markup and redraw
  // only the cursor line in between.
  const key = `${selectedModel}|${splitModelB}|${n}|${Math.round(W)}|${H}`;
  if (key === divergeBarsKey) {
    const cx = (currentIndex + 0.5) * (W / n);
    svg.innerHTML = divergeBarsMarkup +
      `<line x1="${cx.toFixed(1)}" y1="0" x2="${cx.toFixed(1)}" y2="${H}" stroke="#fff" stroke-width="1.5" stroke-opacity="0.9"/>`;
    return;
  }

  // Normalise the two disagreement axes against their own spread so the strip
  // stays informative whether it's a big storm or a quiet week.
  const rows = forecastHours.map((h) => {
    const b = splitHourAt(splitModelB, h.time);
    if (!b) return null;
    return {
      dRate: Math.abs(h.snowfallMm - b.snowfallMm) / 10,
      dLine: Math.abs((h.snowLineWB ?? h.freezingLevel) - (b.snowLineWB ?? b.freezingLevel))
    };
  });
  const maxRate = Math.max(0.05, ...rows.filter(Boolean).map(r => r.dRate));
  const maxLine = Math.max(50, ...rows.filter(Boolean).map(r => r.dLine));

  const bw = W / n;
  let out = '';
  rows.forEach((r, i) => {
    if (!r) return;
    // Depth disagreement dominates (it's what people care about); snow-line
    // disagreement contributes at a third of the weight.
    const score = Math.min(1, (r.dRate / maxRate) * 0.75 + (r.dLine / maxLine) * 0.25);
    if (score < 0.02) return;
    const h = Math.max(1.5, score * (H - 4));
    const hue = 55 - score * 55; // amber -> red as they diverge
    out += `<rect x="${(i * bw).toFixed(2)}" y="${(H - h - 2).toFixed(2)}" width="${Math.max(0.7, bw - 0.25).toFixed(2)}" height="${h.toFixed(2)}" fill="hsl(${hue.toFixed(0)},92%,58%)" fill-opacity="${(0.35 + score * 0.55).toFixed(2)}"/>`;
  });
  divergeBarsKey = key;
  divergeBarsMarkup = out;

  const cx = (currentIndex + 0.5) * bw;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = out +
    `<line x1="${cx.toFixed(1)}" y1="0" x2="${cx.toFixed(1)}" y2="${H}" stroke="#fff" stroke-width="1.5" stroke-opacity="0.9"/>`;
}

// Click anywhere on the strip to jump the shared timeline to that hour.
function onDivergeClick(e) {
  if (!splitMode || !forecastHours || !forecastHours.length) return;
  const host = document.getElementById('split-diverge');
  const rect = host.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  openMapView(Math.min(forecastHours.length - 1, Math.floor(frac * forecastHours.length)));
}
function closeModelMenu() {
  document.getElementById('model-switch')?.classList.remove('open');
}
document.addEventListener('click', (e) => {
  const el = document.getElementById('model-switch');
  if (el && el.classList.contains('open') && !el.contains(e.target)) closeModelMenu();
});

// Fallback so the demo still works offline / if the API is unreachable.
function buildDemoForecast() {
  const rows = [];
  const start = new Date();
  start.setMinutes(0, 0, 0);
  for (let i = 0; i < 48; i++) {
    const t = new Date(start.getTime() + i * 3600 * 1000);
    const wave = Math.sin(i / 6) * 0.5 + 0.5; // a storm-like bump
    const snowfallMm = i > 14 && i < 22 ? (8 + wave * 14) : 0;
    rows.push({
      time: t.toISOString().slice(0, 16),
      temp: -2 + Math.sin(i / 8) * 3,
      precip: snowfallMm > 0 ? snowfallMm / 10 : 0,
      snowfallMm,
      freezingLevel: 1500 + Math.sin(i / 10) * 300,
      windSpeedKmh: 20 + wave * 35,
      windDirDeg: (270 + i * 4) % 360
    });
  }
  return rows;
}

// en-NZ's combined date+time toLocaleString (e.g. "Thu, 9 Jul at 8:00 pm")
// doesn't fit the timeslider's label pill — built by hand instead, dropping
// "at" and the ":00" for on-the-hour times ("8pm" not "8:00pm"), used by both
// the hourly and radar timeslider labels.
function fmtClock(d) {
  let h = d.getHours();
  const m = d.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return m === 0 ? `${h}${ampm}` : `${h}:${String(m).padStart(2, '0')}${ampm}`;
}
function fmtTime(iso) {
  const d = new Date(iso);
  const datePart = d.toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' });
  return `${datePart} ${fmtClock(d)}`;
}

// ── Map ────────────────────────────────────────────────────────────────────
let map = null;

// The original, un-clipped lift-line FeatureCollection for whichever resort
// is loaded (set alongside the 'resort-lifts' source below) — queried lift
// taps look the full geometry up here by id rather than trusting whatever
// queryRenderedFeatures hands back, which can be tile-clipped (see
// liftFeatureAt's own comment for why that matters).
let currentLiftData = null;

// Tells the parent app (if embedded) once there's actually something worth
// looking at, so it can hold a cover overlay over the old content until this
// new resort's map is ready instead of flashing a blank/half-loaded map
// during the iframe swap. Deliberately gated on the map STYLE only, not on
// the weather fetch (openMapView() shows a valid terrain/satellite map
// immediately regardless of forecast data — the snow overlay/data panel can
// fill in a moment later without feeling broken). The weather fetch alone
// has been observed taking 20-30s on a slow connection; waiting on it here
// would hold the cover on far longer than the map is actually blank for.
let mapStyleReady = false;
// 'idle' means requested tiles have loaded and no camera transition is in
// progress — it does NOT guarantee the 3D terrain mesh MapLibre builds from
// those DEM tiles has actually been incorporated yet, and — critically — the
// DEM-sampled elevation MapLibre uses to position the camera's ALTITUDE at a
// given center can still be creeping toward its final value for a beat after
// 'idle'. That's why the wrong framing was INTERMITTENT: at identical
// zoom/pitch/bearing/center, whether the camera sits high (wide view) or low
// (tight view) depends on what elevation was sampled at the exact instant of
// the reveal. So don't just wait for a "plausible" reading — wait for it to
// go STABLE (unchanged within ~1m across several consecutive polls), which
// means the sampling has actually settled and the camera won't shift after
// we reveal.
// `loc` defaults to the module-level LOC (the only caller this was written
// for — the initial page load's establishing shot, always checking THIS
// page's own resort) — switchResort's cross-resort landing passes the
// destination resort's config explicitly instead, since LOC itself isn't
// reassigned to the new resort until finishResortSwitch runs, after this
// has already confirmed the new center's terrain has settled.
// Resolves once MapLibre reports 'idle' — camera transitions finished AND every
// requested tile loaded and rendered. Strictly stronger than polling elevation:
// tile loads arrive in bursts, so a lull between two bursts looks identical to
// "finished" from a sampled reading, while the DEM is still only half there.
//
// 'idle' won't re-fire if the map is already idle and nothing further is
// requested, so the timeout isn't just a safety valve — it's the normal exit
// when there was nothing left to wait for.
function waitForMapIdle(cb, timeoutMs = 4000) {
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    map.off('idle', finish);
    cb();
  };
  const timer = setTimeout(finish, timeoutMs);
  map.on('idle', finish);
}

function waitForTerrainStable(cb, prev, stableCount, attempt, loc) {
  loc = loc || LOC;
  prev = (prev === undefined) ? null : prev;
  stableCount = stableCount || 0;
  attempt = attempt || 0;
  const elev = demElevationAt(loc.center);
  const plausible = elev != null && elev > loc.baseElev * 0.5;
  const steady = plausible && prev != null && Math.abs(elev - prev) < 1;
  const nextStable = steady ? stableCount + 1 : 0;
  // Require ~3 consecutive steady reads (≈240ms of no movement), capped so a
  // permanently-jittery reading can't hang the reveal forever.
  if ((nextStable >= 3) || attempt >= 30) { cb(); return; }
  setTimeout(() => waitForTerrainStable(cb, elev, nextStable, attempt + 1, loc), 80);
}

function maybeSignalMapReady() {
  if (!mapStyleReady || window.parent === window) return;
  // This whole establishing-shot cinematic exists to reveal the resort's
  // own close-up oblique pose (LOC.center/zoom/pitch/bearing) — it runs
  // once per page load via map.once('idle', ...) below, independently of
  // and usually AFTER setViewMode() has already run (loadForecast's weather
  // fetch, which restoreViewMode waits on, is typically slower than the
  // map style reaching 'idle'). When Isobars is the mode restored from a
  // previous visit, setViewMode('isobars') already flew the camera out to
  // flyToIsobarRegion()'s flat country-scale view — then this sequence
  // landed later and silently flew it right back to the resort close-up,
  // undoing that. Isobars' own flat overview has no use for a close-up
  // "establishing pose then fly in" reveal anyway, so just fit the isobar
  // region directly and signal ready, skipping the rest of this function.
  if (viewMode === 'isobars') {
    flyToIsobarRegion();
    window.parent.postMessage({ type: 'map-ready' }, '*');
    return;
  }
  // Auto-rotate does not run during load/fly-in (it's only kicked off once
  // the fly-in lands), so there's nothing to pause here — the camera bearing
  // is wherever the constructor set it. Snap to the exact default bearing so
  // the establishing pose and fly-in start from a known orientation.
  map.jumpTo({ center: LOC.center, zoom: LOC.zoom, pitch: LOC.pitch, bearing: LOC.bearing });
  // Cheap and harmless even if unnecessary: forces MapLibre to re-derive its
  // internal projection state from the container's current size right after
  // the snap, in case jumpTo() alone doesn't fully refresh whatever the
  // renderer uses to map zoom -> actual field of view.
  try { map.resize(); } catch (e) {}
  // The snap can itself require a few new edge tiles (rotating back to the
  // default bearing changes what's at the corners of the frustum) — wait
  // for a second 'idle' so the revealed frame is guaranteed fully loaded at
  // the EXACT bearing it's revealed at, not just the one it was idle at a
  // moment ago.
  map.once('idle', () => {
    waitForTerrainStable(() => {
      // Perform the fly-in on THIS map — the new resort's own instance, with
      // its terrain already loaded and settled (waitForTerrainStable above).
      // Reveal at a pulled-back "establishing" pose, then fly in to the exact
      // default. Because the fly happens on the instance that actually stays,
      // landing on loaded terrain, the fly-in ALWAYS ends precisely on the
      // settled default view. The previous approach flew the OLD map to the
      // new coordinates (destination terrain not loaded → camera too high) and
      // then crossfaded to a different, correctly-framed new instance, which
      // is why the fly-in landing never matched the loaded view.
      // Reveal at a pulled-back establishing pose, then fly in. Start well
      // back (≈2.6 zoom levels out) so there's a real approach to see, and
      // hold that establishing shot until the parent's ~0.4s crossfade has
      // finished revealing this frame BEFORE the fly begins — otherwise the
      // first chunk of the approach happens while the frame is still fading
      // in, so you only catch the last ~1s and it feels like it rushes
      // straight into a close-up.
      const startZoom = Math.max(LOC.zoom - 2.6, 8.5);
      map.jumpTo({ center: LOC.center, zoom: startZoom, pitch: LOC.pitch, bearing: LOC.bearing });
      window.parent.postMessage({ type: 'map-ready' }, '*');
      setTimeout(() => {
        map.flyTo({ center: LOC.center, zoom: LOC.zoom, pitch: LOC.pitch, bearing: LOC.bearing, duration: 2600, essential: true });
        // Let the fly-in settle wherever it naturally lands — do NOT jumpTo the
        // exact pose afterward. In this MapLibre's terrain camera, jumping to
        // the same zoom the fly just reached recomputes the camera height and
        // lurches into a visibly closer view, so the "pin" was itself the big
        // jump at the end of the animation. Once landed, ramp the decorative
        // auto-rotate in from a standstill.
        map.once('moveend', () => {
          if (typeof window.__startAutoRotateRampIn === 'function') window.__startAutoRotateRampIn();
        });
      }, 450);
    });
  });
}

// The base style, factored out of initMap so the split-screen comparison pane
// (see initMapB) can build a second map that renders identically to the first —
// same terrain source, same hillshade, same snow-relief drape to paint a ramp
// into. Anything that differs between the two panes is the ramp, nothing else.
function buildMapStyle() {
  return {
      version: 8,
      sources: {
        terrain: { type: 'raster-dem', url: 'https://tiles.mapterhorn.com/tilejson.json', tileSize: 512 },
        satellite: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
        }
      },
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': '#2d5a1b' } },
        { id: 'satellite', type: 'raster', source: 'satellite', paint: { 'raster-opacity': 1, 'raster-saturation': 0.1, 'raster-contrast': 0.05 } },
        {
          id: 'depth-shade', type: 'hillshade', source: 'terrain',
          paint: {
            'hillshade-shadow-color': 'rgba(30,20,10,0.45)',
            'hillshade-highlight-color': 'rgba(255,255,255,0)',
            'hillshade-accent-color': 'rgba(80,60,40,0.2)',
            'hillshade-illumination-direction': 310,
            'hillshade-exaggeration': 0.6
          }
        },
        {
          // Forecasted snow coverage, tinted by elevation from the snow line
          // (freezing level − 300m) up to the summit, transparent below.
          //
          // The ramp (buildAccumRamp/buildSnowRamp) is fit entirely from THIS
          // resort's own forecast — there's no real gridded precipitation
          // field behind it, just "how much did/will Whakapapa get, mapped
          // onto whatever elevation the DEM reports at each pixel". Fine
          // right around the resort, where the assumption "same storm" holds.
          // But color-relief paints the ENTIRE 'terrain' source with no
          // horizontal distance falloff at all (its input is purely
          // ['elevation'] — MapLibre's style spec has no "distance from a
          // point" expression to gate it with) — so zooming/panning out far
          // enough to see e.g. the Kaimanawa Range or Lake Taupo (60-90km
          // away) paints those hills with Whakapapa's own storm total the
          // moment they cross ITS snow line, regardless of what that area's
          // own forecast actually says (reported bug: "11.4cm near Lake
          // Taupo" that the per-location tables don't support). minzoom
          // caps how far out this can be seen before the misleading colour
          // disappears — real fix would need a genuine spatial precip grid
          // (like the Isobars feature's gridded fetch), not just an
          // elevation ramp.
          id: 'snow-relief', type: 'color-relief', source: 'terrain', minzoom: 11,
          paint: { 'color-relief-color': ['interpolate', ['linear'], ['elevation'], 0, 'rgba(255,255,255,0)'] }
        }
      ],
      terrain: { source: 'terrain', exaggeration: 1.2 }
  };
}

function initMap() {
  if (map) return;
  map = new maplibregl.Map({
    container: 'map',
    zoom: LOC.zoom,
    center: LOC.center,
    pitch: LOC.pitch,
    bearing: LOC.bearing,
    maxPitch: 85,
    attributionControl: false,
    style: buildMapStyle()
  });

  // Keyboard shortcuts (desktop — these only fire once the map iframe has
  // focus, i.e. after the user has clicked/interacted with the map).
  window.addEventListener('keydown', (e) => {
    // Space plays/pauses whichever timeline the current view shows.
    if (e.code === 'Space' || e.key === ' ') {
      const ae = document.activeElement;
      if (ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type === 'text'))) return;
      e.preventDefault(); // stop the page from scrolling
      if (typeof viewMode !== 'undefined') {
        if (viewMode === 'hourly') togglePlay();
        else if (viewMode === 'live') pwTogglePlay();
        else if (viewMode === 'radar') radarTogglePlay();
        // accumulated view has no timeline — nothing to toggle
      }
      return;
    }
    // Press "c" over the map to read the current camera params, for dialing a
    // resort's default view in to a hand-picked framing: navigate to the view
    // you want, press c, copy the popup text. Kept permanently as a tuning aid.
    if ((e.key === 'c' || e.key === 'C') && map) {
      const cc = map.getCenter();
      window.prompt('Camera (copy this):', JSON.stringify({
        center: [ +cc.lng.toFixed(5), +cc.lat.toFixed(5) ],
        zoom: +map.getZoom().toFixed(2),
        pitch: +map.getPitch().toFixed(1),
        bearing: +map.getBearing().toFixed(1)
      }));
    }
  });

  // MapLibre reads the container's actual pixel size to compute the camera
  // projection — for a pitched 3D view, that's what determines the real
  // field of view for a given "zoom" number, not just how large things look.
  // A single resize() call at 'load' (see below) assumed the container was
  // already at its final size by then, but comparing a fly-in landing
  // screenshot against a freshly-loaded page at IDENTICAL zoom/pitch/bearing
  // showed drastically different fields of view (wide vs. tightly cropped) —
  // exactly what a wrong canvas size at first render would cause, since a
  // one-shot resize() can still fire before the iframe's layout has actually
  // settled. Watch the container itself and resize on every real change
  // instead of guessing when "settled" is.
  try {
    map.resize(); // immediate correction; ResizeObserver's own first callback is async
    const mapContainerEl = document.getElementById('map');
    if (mapContainerEl && typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => map.resize()).observe(mapContainerEl);
    }
  } catch (e) {}

  // Clear "bluebird" sky, only visible above the horizon when the camera
  // pitches up further than the default view. Set via Map#setSky once the
  // style has actually finished loading — calling it immediately after
  // the constructor (or putting "sky" directly in the style object) is
  // too early and the call is silently dropped. Not a layers[] entry
  // either: this MapLibre version's style spec layers[] array doesn't
  // accept a "sky" type at all, and adding one there fails validation
  // for the whole style. Unlike Mapbox's gradient-based sky, MapLibre's
  // model is just a sky-color (zenith) blending into a horizon-color —
  // bright blue overhead fading to a pale, almost-white blue at the
  // horizon. Overridden to a dark navy night sky further below, once the
  // rest of 'load' has run, if the settings-cog "Dark mode" toggle
  // was left on from a previous visit (restoreMapSettings()) — see
  // setDarkMode() near the dark-terrain trial code.
  map.on('load', () => {
    // Container sizing is handled by the ResizeObserver set up right after
    // construction, above.
    map.setSky(SKY_DAY);

    // generateId (inside applyLiftDataForResort) assigns each feature a
    // stable id = its index in liftData.features, so a tap can look the
    // untouched original geometry back up (see liftFeatureAt) instead of
    // trusting whatever queryRenderedFeatures returns, which is tile-clipped.
    applyLiftDataForResort(resortKey);
    // Live PredictWind observation pills + temperature profile (both resorts).
    initStationPill();
    // Report-sourced live temp pill (Roundhill/Tukino only — see its own
    // comment above initReportPill's definition); a no-op for every other
    // resort since REPORT_TEMP_ENDPOINTS has no entry for them.
    initReportPill(resortKey);
    // Other-resort navigation pills. Gated by zoom level, and hidden outright
    // in the two views they'd only clutter — Isobars and the radar
    // accumulation drape (see updateResortPillVisibility).
    initResortPills();
    // Snow Test tab (?snow=1) turns the particle trial on automatically —
    // everyday resort/map views leave it off (see toggleSnowParticles).
    if (new URLSearchParams(window.location.search).get('snow') === '1') toggleSnowParticles();
    mapStyleReady = true;
    // A switch requested (e.g. by the parent app's location switcher) before
    // the map/style was ready to fly anywhere yet — run it now.
    if (queuedResortSwitch) {
      const k = queuedResortSwitch;
      queuedResortSwitch = null;
      switchResort(k, false);
    }
    // 'load' only means the style/sources attached, not that terrain/
    // satellite tiles have actually finished loading and rendering —
    // revealing this frame right here left it visibly still settling
    // (terrain popping in) for a moment after the crossfade, which never
    // quite matched where the pill's flyTo (on the OLD, already-loaded page)
    // had landed after its full 2.5s animation. 'idle' fires once camera
    // transitions are done AND every requested tile has loaded, so waiting
    // for it guarantees this frame is the fully-settled one.
    map.once('idle', maybeSignalMapReady);

    // Re-apply settings-cog preferences (Winter snow / Dark mode)
    // left on from a previous visit — after everything above so the layers
    // setDarkMode()/applyWinterSnow() reference ('satellite', 'depth-shade',
    // 'resort-lifts-line') already exist. Declared later in this script
    // (function-hoisted, safe to call from here).
    restoreMapSettings();
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showZoom: true, showCompass: true }), 'top-right');
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
  // The compact attribution control is a <details> element that MapLibre
  // auto-opens the moment it first populates with attribution text (sources
  // load asynchronously, so this can happen well after map creation) — force
  // it closed that one time so only the small (i) icon shows by default,
  // without blocking the user from opening it themselves afterwards.
  const attribEl = document.querySelector('.maplibregl-ctrl-attrib');
  const attribInner = attribEl?.querySelector('.maplibregl-ctrl-attrib-inner');
  if (attribEl && attribInner) {
    const closeOnceTextAppears = () => {
      if (attribInner.textContent.trim() === '') return;
      attribEl.removeAttribute('open');
      attribEl.classList.remove('maplibregl-compact-show');
      observer.disconnect();
    };
    const observer = new MutationObserver(closeOnceTextAppears);
    observer.observe(attribInner, { childList: true, characterData: true, subtree: true });
  }

  // ── Tap-to-select a lift line — name, length, vertical rise pill ─────────
  // A bare point hit-test against a 1.4px-wide line is a near-impossible
  // touch target, so query a small box around the tap instead of the exact
  // pixel — the standard trick for making thin line layers tappable.
  function liftFeatureAt(point) {
    if (!map.getLayer('resort-lifts-line') || !currentLiftData) return null;
    const bbox = [[point.x - 8, point.y - 8], [point.x + 8, point.y + 8]];
    const feats = map.queryRenderedFeatures(bbox, { layers: ['resort-lifts-line'] });
    if (!feats[0]) return null;
    // queryRenderedFeatures clips a line's geometry to whatever internal
    // tile the hit landed in — fine for a short lift fully inside one tile,
    // but a long one (e.g. Sky Waka Gondola, ~1.8km) spans several tiles at
    // closer zooms, so the clipped hit alone drastically under-reports
    // length/vertical rise. generateId (set on the source above) gives each
    // feature a stable id = its index into currentLiftData.features, so look
    // the real, un-clipped feature back up there instead of trusting the
    // rendered geometry.
    return currentLiftData.features[feats[0].id] || feats[0];
  }

  function formatLiftLength(m) {
    return m >= 1000 ? `${(m / 1000).toFixed(2)}km` : `${Math.round(m)}m`;
  }

  // Sums segment lengths along the line (approxDistanceKm's equirectangular
  // approximation — plenty accurate at lift-line scale, see its own comment),
  // then reads DEM elevation at every vertex via queryTerrainElevation for
  // vertical rise. max-min rather than first-vs-last: OSM doesn't guarantee
  // a lift's coordinate order runs bottom station to top station.
  function liftStats(coordinates) {
    let lengthM = 0;
    for (let i = 1; i < coordinates.length; i++) {
      const [lon1, lat1] = coordinates[i - 1];
      const [lon2, lat2] = coordinates[i];
      const cosAvgLatRad = Math.cos(((lat1 + lat2) / 2) * Math.PI / 180);
      lengthM += approxDistanceKm(lat1, lon1, lat2, lon2, cosAvgLatRad) * 1000;
    }
    // Real metres (see demElevationAt) — the exaggerated read had every lift's
    // quoted rise 20% high, e.g. a 300m chair advertised as ↑360m.
    const elevations = coordinates
      .map((c) => demElevationAt(c))
      .filter((v) => v != null);
    const riseM = elevations.length >= 2 ? Math.max(...elevations) - Math.min(...elevations) : null;
    return { lengthM, riseM };
  }

  let liftPopupEl = null;

  function removeLiftPopup() {
    if (liftPopupEl) { liftPopupEl.remove(); liftPopupEl = null; }
  }

  // Tap-to-dismiss instead of .click-popup's 4s auto-fade: this pill names
  // the whole line, not a snapshot value that goes stale, so there's no
  // "it'll be wrong in a few seconds" pressure to clear it automatically.
  // Tapping the pill itself closes it directly (below); tapping elsewhere
  // closes it via the plain `removeLiftPopup()` the two click handlers below
  // already call whenever a tap doesn't land on a lift — deliberately NOT a
  // fresh map.once('click', ...) registered on every open, which stacks a
  // new listener per popup and depends on assumptions about MapLibre's
  // internal event-dispatch ordering that aren't worth the risk here.
  function showLiftPopup(x, y, text) {
    removeLiftPopup();
    const el = document.createElement('div');
    el.className = isHighResMode ? 'lift-popup hi-res' : 'lift-popup';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.textContent = text;
    el.addEventListener('click', (ev) => { ev.stopPropagation(); removeLiftPopup(); });
    document.getElementById('map-screen').appendChild(el);
    liftPopupEl = el;
  }

  function showLiftClickPopup(point, feature) {
    const p = feature.properties;
    const name = p.name || p.ref || (p.aerialway ? p.aerialway.replace(/_/g, ' ') : 'Lift');
    const { lengthM, riseM } = liftStats(feature.geometry.coordinates);
    const parts = [name, formatLiftLength(lengthM)];
    if (riseM != null) parts.push(`↑${Math.round(riseM)}m`);
    showLiftPopup(point.x, point.y, parts.join(' · '));
  }

  map.on('click', (e) => {
    // High-Res has its own precise, position-aware probe (see below) — this
    // generic one reports a single flat per-hour/per-elevation number with
    // no real x/y variation, which is exactly what High-Res must NOT show.
    if (isHighResMode) return;
    // Tap-to-select a lift line wins over the snow-depth probe underneath
    // it, and works in every view mode (including Live/Isobars, unlike the
    // depth probe below) since it has nothing to do with snowfall data.
    const liftFeature = liftFeatureAt(e.point);
    if (liftFeature) { showLiftClickPopup(e.point, liftFeature); return; }
    removeLiftPopup(); // tapped elsewhere — close any lift popup left open
    // Radar's accumulated drape has its own readout: the summed total under
    // your finger, which is the whole point of the layer ("did THIS range get
    // hammered?"). Reported straight off the same grid the colours came from,
    // so the number and the colour can't disagree.
    if (viewMode === 'radar') {
      if (!radarAccumOn || !radarAccumGrid) return;
      const mmHere = RadarAccum.sampleMm(radarAccumGrid, e.lngLat.lng, e.lngLat.lat);
      // Outside the mosaic's quad entirely (sampleMm returns null) — say
      // nothing rather than reporting a confident 0mm for "no radar here".
      if (mmHere == null) return;
      showClickPopup(e.point.x, e.point.y, `${mmHere < 10 ? mmHere.toFixed(1) : Math.round(mmHere)}mm`);
      return;
    }
    // The click-to-probe popup reports snow depth (cm) for the snowfall/
    // accumulated views; it has no meaning on the Live temperature map or
    // the Isobars map, so skip it there.
    if (viewMode === 'live' || viewMode === 'isobars') return;
    const rawElev = sampleElevationMedian(e.lngLat);
    if (rawElev == null) return;
    // Belt-and-braces clamp to this resort's configured upper bound, so the
    // probe can never answer for terrain above the top of the ramp. The
    // impossible readings this was originally added for (a "3241m" sample for
    // a ~2797m summit) weren't the tileset spiking at all — they were the
    // exaggerated-elevation bug demElevationAt now corrects.
    const elev = Math.min(rawElev, TOP_ELEV);
    const depthCm = getDepthAtElevation(elev);
    // The drape starts painting at the RAIN line (the violet sleet band) but
    // getDepthAtElevation only counts SNOW, from the snow line up — so a tap
    // anywhere in the sleet band is tinted yet legitimately 0cm of snow.
    // Reporting a bare "0.0cm" over obviously-coloured terrain reads as a bug;
    // name the phase instead so the tint and the number agree. currentSleetBand
    // is the band the drape was actually painted with (see sleetBandFor) — the
    // point is to answer "is this pixel violet?", which is exactly the question
    // buildSnowRamp already answered, so re-deriving it here from the hour's
    // raw wet-bulb lines would just be a second formula free to disagree.
    const inSleetBand = viewMode === 'hourly' && currentSleetBand
      && elev >= currentSleetBand.floor && elev < currentSleetBand.top;
    const label = inSleetBand && depthCm < 0.05 ? 'sleet' : `${depthCm.toFixed(1)}cm`;
    if (viewMode === 'accumulated') {
      // Move the black snowfall pill to the tapped point (depth there) and
      // restart its 4s fade — the pill is the readout on the accumulated map.
      flashSnowfallMarker(e.lngLat, `❄ ${depthCm.toFixed(1)} cm`);
    } else {
      showClickPopup(e.point.x, e.point.y, label);
    }
  });

  // High-Res: precise, position-aware tap-to-probe for the Accumulated
  // drape — same shared math the drape itself sums (orographicAccumAtPoint),
  // over whichever static 5/10/15 day window is currently showing, so the
  // number always matches the colour under your finger. Full per-point
  // precision — this is O(hours) for one tap, not O(pixels x hours) like
  // the drape.
  map.on('click', (e) => {
    if (!isHighResMode) return;
    const liftFeatureHiRes = liftFeatureAt(e.point);
    if (liftFeatureHiRes) { showLiftClickPopup(e.point, liftFeatureHiRes); return; }
    removeLiftPopup(); // tapped elsewhere — close any lift popup left open
    const rawElevTap = sampleElevationMedian(e.lngLat);
    if (rawElevTap == null) return;
    const elevTap = Math.min(rawElevTap, TOP_ELEV);

    const hours = hiResAccumWindow();
    if (hours.length === 0) return;
    const grad = orographicSampleGradient(e.lngLat);
    if (!grad) { showClickPopup(e.point.x, e.point.y, 'Unavailable'); return; }
    const cm = orographicAccumAtPoint(orographicPrecomputeHours(hours), elevTap, grad.gradEast, grad.gradNorth);
    showClickPopup(e.point.x, e.point.y, `${cm.toFixed(0)}cm`);
  });

  // A user drag/zoom/rotate/pitch invalidates every particle's last screen
  // than let it draw bogus streaks connecting stale to fresh projections.
  // The decorative auto-rotate below also fires movestart/moveend every
  // single frame via setBearing(), but those calls have no originalEvent
  // (only real user gestures do) — skip pausing for those so the overlay
  // keeps flowing smoothly while the camera idles.
  let windInteractionActive = false;
  map.on('movestart', (e) => {
    if (!e.originalEvent) return;
    windInteractionActive = true;
  });
  map.on('moveend', () => {
    if (!windInteractionActive) return;
    windInteractionActive = false;
  });

  // Very slow auto-rotate, purely decorative — stops for good the moment the
  // user actually touches the map (drag, zoom, pinch, scroll) so it never
  // fights their own camera control. It does NOT start on load: it's kicked
  // off (ramped in) once the fly-in lands the camera on the default view (see
  // the fly-in reveal and the self-pill handler), so nothing rotates during
  // the approach. Also toggleable via the rotate button.
  const AUTO_ROTATE_SPEED = 0.015;   // degrees per frame at full speed
  const AUTO_ROTATE_RAMP_MS = 2500;  // ease the speed up from 0 over this long
  let autoRotateActive = false;
  let autoRotateRampStart = null;    // performance.now() when a ramp began; null = full speed
  const mapEl = document.getElementById('map');
  const rotateStep = () => {
    if (!autoRotateActive) return;
    let speed = AUTO_ROTATE_SPEED;
    if (autoRotateRampStart != null) {
      const t = Math.min((performance.now() - autoRotateRampStart) / AUTO_ROTATE_RAMP_MS, 1);
      speed = AUTO_ROTATE_SPEED * (t * t); // quadratic ease-in: starts still, builds smoothly to full
      if (t >= 1) autoRotateRampStart = null;
    }
    map.setBearing(map.getBearing() + speed);
    requestAnimationFrame(rotateStep);
  };
  const stopAutoRotate = () => {
    autoRotateActive = false;
    autoRotateRampStart = null;
    document.getElementById('rotate-toggle').classList.remove('active');
  };
  const startAutoRotate = (ramp) => {
    if (autoRotateActive) return;
    autoRotateActive = true;
    autoRotateRampStart = ramp ? performance.now() : null;
    document.getElementById('rotate-toggle').classList.add('active');
    requestAnimationFrame(rotateStep);
    armInteractionStop();
  };
  // Auto-rotate stops for good the moment the user touches the map (drag, zoom,
  // pinch, scroll) so it never fights their own camera control — re-armed each
  // time rotation is (re)started.
  const armInteractionStop = () => {
    ['mousedown', 'touchstart', 'wheel'].forEach((evt) =>
      mapEl.addEventListener(evt, stopAutoRotate, { once: true, passive: true })
    );
  };
  // Exposed for the top-left rotate button.
  window.toggleAutoRotate = () => {
    if (autoRotateActive) stopAutoRotate();
    else startAutoRotate(true);
  };
  // Called once the camera lands on the default view (fly-in complete) to ramp
  // the decorative rotation in from a standstill.
  window.__startAutoRotateRampIn = () => startAutoRotate(true);
  // Exposed so a programmatic resort-switch flyTo (switchResort — not a real
  // user gesture, so armInteractionStop's own mousedown/touchstart/wheel
  // listeners never fire for it) can still pause rotation before flying,
  // the same way a real click/drag already does.
  window.__stopAutoRotate = stopAutoRotate;
}

// ── Trial: real 3D snow particles ────────────────────────────────────────
// A MapLibre "custom layer" drawing raw WebGL point sprites positioned with
// MercatorCoordinate.fromLngLat(lngLat, altitudeMeters) — the same 3D space
// (and the same projection matrix) the terrain itself renders into, so with
// depth testing on, mountains between a flake and the camera occlude it
// correctly. This is a first trial: off by default, toggled via the
// snowflake button next to the rotate control, not tied to any real
// forecast/weather data.
function createSnowLayer(loc) {
  const PARTICLE_COUNT = 700;
  // Spawn area is a rough circle around the resort's own centre — not tied to
  // the actual camera framing, so it reads fine at the default view but may
  // look sparse/dense if you zoom far in or out. (First trial used 0.03/~3km,
  // which was too tight — barely covered the visible frame at the resort's
  // usual wide, pitched establishing shot.)
  const SPAWN_RADIUS_DEG = 0.08; // ~8km at these latitudes
  const TOP_ALT = (loc.topElev || loc.summitElev + 200) + 400;
  const BOTTOM_ALT = Math.max(0, loc.baseElev - 300);
  const FALL_SPEED = 40; // metres/sec — tuned by eye, not physically modelled

  const lngs = new Float64Array(PARTICLE_COUNT);
  const lats = new Float64Array(PARTICLE_COUNT);
  const alts = new Float64Array(PARTICLE_COUNT);
  const phases = new Float32Array(PARTICLE_COUNT);
  const sways = new Float32Array(PARTICLE_COUNT);
  const verts = new Float32Array(PARTICLE_COUNT * 3);

  function respawn(i, randomAltitude) {
    const ang = Math.random() * Math.PI * 2;
    const r = Math.random() * SPAWN_RADIUS_DEG;
    lngs[i] = loc.center[0] + (Math.cos(ang) * r) / Math.cos((loc.center[1] * Math.PI) / 180);
    lats[i] = loc.center[1] + Math.sin(ang) * r;
    alts[i] = randomAltitude ? BOTTOM_ALT + Math.random() * (TOP_ALT - BOTTOM_ALT) : TOP_ALT;
    phases[i] = Math.random() * Math.PI * 2;
    sways[i] = 0.00015 + Math.random() * 0.00025; // small side-to-side drift, in degrees of longitude
  }
  for (let i = 0; i < PARTICLE_COUNT; i++) respawn(i, true);

  let program, buffer, aPos, uMatrix, lastT = null;

  return {
    id: 'snow-particles',
    type: 'custom',
    renderingMode: '3d',
    onAdd(map, gl) {
      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.error('snow-particles shader compile error:', gl.getShaderInfoLog(s));
        }
        return s;
      };
      program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, `
        uniform mat4 u_matrix;
        attribute vec3 a_pos;
        void main() {
          gl_Position = u_matrix * vec4(a_pos, 1.0);
          gl_PointSize = 7.0;
        }
      `));
      // A pure white dot barely shows up against snow-covered white terrain —
      // first trial's actual failure mode (per a live screenshot: the layer
      // was active but effectively invisible). Gives each flake a soft dark
      // rim around a white core so it reads against light AND dark
      // backgrounds instead of just one.
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `
        precision mediump float;
        void main() {
          float dist = length(gl_PointCoord - vec2(0.5));
          if (dist > 0.5) discard;
          float core = 1.0 - smoothstep(0.24, 0.4, dist);
          float rim = smoothstep(0.24, 0.4, dist) * (1.0 - smoothstep(0.4, 0.5, dist));
          vec3 color = mix(vec3(0.2, 0.28, 0.4), vec3(1.0), core);
          gl_FragColor = vec4(color, max(core, rim * 0.7));
        }
      `));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('snow-particles program link error:', gl.getProgramInfoLog(program));
      }
      aPos = gl.getAttribLocation(program, 'a_pos');
      uMatrix = gl.getUniformLocation(program, 'u_matrix');
      buffer = gl.createBuffer();
    },
    render(gl, matrix) {
      const now = performance.now();
      const dt = lastT == null ? 0 : Math.min(0.1, (now - lastT) / 1000);
      lastT = now;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        alts[i] -= FALL_SPEED * dt;
        phases[i] += dt;
        if (alts[i] < BOTTOM_ALT) respawn(i, false);
        const swayLng = Math.sin(phases[i]) * sways[i];
        const mc = maplibregl.MercatorCoordinate.fromLngLat([lngs[i] + swayLng, lats[i]], alts[i]);
        verts[i * 3] = mc.x; verts[i * 3 + 1] = mc.y; verts[i * 3 + 2] = mc.z;
      }

      gl.useProgram(program);
      gl.uniformMatrix4fv(uMatrix, false, matrix);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.enable(gl.DEPTH_TEST);
      // Flakes shouldn't occlude each other/write into the depth buffer —
      // only terrain should ever block them — just test against what's
      // already there.
      gl.depthMask(false);
      gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
      gl.depthMask(true);
    }
  };
}

let snowParticlesActive = false;
let snowParticlesAnimHandle = null;
function toggleSnowParticles() {
  if (!map) return;
  snowParticlesActive = !snowParticlesActive;
  const btn = document.getElementById('snow-toggle');
  if (btn) btn.classList.toggle('active', snowParticlesActive);
  if (snowParticlesActive) {

    const loop = () => {
