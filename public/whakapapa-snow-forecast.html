  document.getElementById('live-timeline').style.display = mode === 'live' ? 'flex' : 'none';
  document.getElementById('radar-timeline').style.display = mode === 'radar' ? 'flex' : 'none';
  document.getElementById('isobar-timeline').style.display = mode === 'isobars' ? 'flex' : 'none';
  document.getElementById('map-screen').classList.toggle('live-mode', mode === 'live');
  document.getElementById('map-screen').classList.toggle('accum-mode', mode === 'accumulated');
  document.getElementById('map-screen').classList.toggle('radar-mode', mode === 'radar');
  document.getElementById('map-screen').classList.toggle('isobars-mode', mode === 'isobars');
  // updateResortPillVisibility() normally only runs on the map's 'zoom'
  // event — call it directly here too so pills disappear the instant
  // Isobars is selected rather than waiting for the fitBounds/flyTo
  // animation's first 'zoom' tick to catch up. Guarded like the other
  // map-touching lines here: initMap() is wrapped in try/catch, so a WebGL
  // init failure can leave map null even this far into setViewMode.
  if (map) updateResortPillVisibility();
  pwUpdatePillVisibility();
  // Radar and Isobars each read their own separate visibility flag (see
  // pwVisibilityFlagFor) — keep the icon's lit state honest about
  // whichever of those is actually true instead of looking "off"/"on" out
  // of sync with what the map is showing.
  { const obsBtn = document.getElementById('obs-toggle'); if (obsBtn) obsBtn.classList.toggle('active', pwVisibilityFlagFor(mode)); }
  // Radar and Isobars are both clean reads of something other than
  // snow/temp — clear whatever colour drape the previous mode left painted
  // on 'snow-relief' so it isn't still showing through/under them. Leaving
  // either re-paints the correct ramp anyway (openMapView/
  // renderAccumulatedView/renderLiveTempView all call applyRampWhenReady
  // themselves).
  if (mode === 'radar' || mode === 'isobars') applyRampWhenReady(buildSnowRamp(null));
  // The isobar overlay is Isobars-only — hide it (rather than tear it down)
  // leaving every other mode, same pattern as radar-layer below.
  if (mode !== 'isobars') setIsobarLayerVisible(false);
  // orographic-snow-layer is tied to forecastHours[currentIndex] and only
  // refreshed from openMapView (the 'hourly' branch below) — hide it in
  // every other mode rather than leaving a stale hour's overlay showing;
  // it comes back automatically next time openMapView -> refreshOrographicSnow
  // runs (a fresh addLayer, so no explicit "show again" needed here).
  if (mode !== 'hourly' && map && map.getLayer('orographic-snow-layer')) {
    map.setLayoutProperty('orographic-snow-layer', 'visibility', 'none');
  }
  // Snowfall pin shows on hourly + accumulated; clear it in every other view.
  if ((mode === 'live' || mode === 'radar' || mode === 'isobars') && snowfallMarker) { snowfallMarker.remove(); snowfallMarker = null; }
  // The minimised-drawer summary is accumulated-only; clear it elsewhere so the
  // :empty rule keeps it hidden.
  if (mode !== 'accumulated') { const dms = document.getElementById('drawer-min-summary'); if (dms) dms.innerHTML = ''; }
  if (mode !== 'live' && mode !== 'hourly') {
    document.getElementById('fl-overlay').style.display = 'none';
  }
  if (mode !== 'live') {
    pwStopLivePlay();
    if (pwDisplayTime != null) { pwDisplayTime = null; for (const id in pwState) pwRenderPill(id); }
  }
  if (mode !== 'radar') radarStopPlay();
  if (mode !== 'isobars') isobarStopPlay();
  // Covers both radar drapes (live loop and accumulated total) — only one of
  // them is ever visible, and only in radar mode.
  radarSyncLayerVisibility();
  // Isobars is the one mode whose camera framing differs from every other
  // mode's shared "resort close-up" — fly out to it on entry, and fly back
  // on the way to any other mode (never on isobars->isobars re-renders,
  // e.g. a resort switch while already on this tab, which would otherwise
  // restart the same zoom-out animation pointlessly).
  if (mode === 'isobars' && prevMode !== 'isobars') flyToIsobarRegion();
  else if (mode !== 'isobars' && prevMode === 'isobars') flyToResortView();

  if (mode === 'hourly') {
    stopPlay();
    openMapView(currentIndex < 0 ? 0 : currentIndex);
    pwRenderFreezingOverlay();
  } else if (mode === 'live') {
    stopPlay();
    renderLiveTempView();
  } else if (mode === 'radar') {
    stopPlay();
    radarEnterMode();
  } else if (mode === 'isobars') {
    stopPlay();
    renderIsobarsView();
  } else {
    stopPlay();
    renderAccumulatedView();
  }
  // Tick the real-time freezing-level nowcast only while in live view.
  if (mode === 'live') pwStartNowcast(); else pwStopNowcast();
}

// ── Radar view: drapes the full-NZ national rain radar composite (same
// feed/calibration as public/radar-map.html and src/radarCalibration.js,
// the source of truth — mirrored here since this is a standalone static
// page outside the Vite/React build, so keep both in sync by hand).
// Previously this drew whichever single-site REGIONAL composite was nearest
// each resort, cropped to a small area around it — sharper close up, but
// each resort only ever saw its own corner of the country and resorts with
// no nearby station (loveland/mtvernon, and rainbow until now) got no radar
// at all. The national composite is coarser when zoomed in tight, but shows
// the whole picture and covers every NZ resort uniformly, which is the
// tradeoff asked for here.
const RADAR_CALIBRATION = {

  // NE/SE longitudes intentionally >180° (unwrapped) — see the long comment
  // in src/radarCalibration.js for why wrapping these breaks the drape.
  corners: [
    [164.443359375, -32.49123028794758],
    [181.82373046875, -32.37996146435729],
    [182.13134765625, -48.54570549184744],
    [164.2236328125, -48.60385760823253],
  ],
  opacity: 0.9,
};
// National composite covers all of NZ uniformly — the only resorts with no
// radar at all now are the two actually outside NZ (loveland/mtvernon).
// Hides the Radar pill entirely for resorts with no coverage, rather than
// showing a tab that can never load anything — see updateRadarAvailability
// above (also re-run on every resort switch).
let RADAR_AVAILABLE = false;
updateRadarAvailability(resortKey);

// Measured cadence of the national feed — see src/radarFeed.js / the
// radar-map.html writeup for how this was probed.
const RADAR_SLOT_MINUTES = [5, 13, 20, 28, 35, 43, 50, 58];
const radarPad2 = (n) => String(n).padStart(2, '0');
function radarFilenameFor(date) {
  return '' + date.getUTCFullYear() + radarPad2(date.getUTCMonth() + 1) + radarPad2(date.getUTCDate()) + radarPad2(date.getUTCHours()) + radarPad2(date.getUTCMinutes());
}
// Inverse of radarFilenameFor — YYYYMMDDHHmm (UTC) back to a Date, so a frame's

function radarTsToDate(ts) {
  return new Date(Date.UTC(

}

    if (hourMinutes.length > 0) {
      slot = new Date(cursor);
      slot.setUTCMinutes(hourMinutes[hourMinutes.length - 1], 0, 0);
    } else {
      slot = new Date(cursor);
      slot.setUTCHours(slot.getUTCHours() - 1, RADAR_SLOT_MINUTES[RADAR_SLOT_MINUTES.length - 1], 0, 0);

function radarFrameUrl(ts) { return `/radar-feed/${ts}.gif`; }

  return new Date(Date.UTC(+ts.slice(0, 4), +ts.slice(4, 6) - 1, +ts.slice(6, 8), +ts.slice(8, 10), +ts.slice(10, 12)));
}
function radarFormatTs(ts) {

  const { crop, isolate } = RADAR_CALIBRATION;

  const top = Math.round(ih * crop.topPct / 100), bottom = Math.round(ih * crop.bottomPct / 100);
  const left = Math.round(iw * crop.leftPct / 100), right = Math.round(iw * crop.rightPct / 100);
  const cw = Math.max(1, iw - left - right), ch = Math.max(1, ih - top - bottom);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, left, top, cw, ch, 0, 0, cw, ch);
  const imgData = ctx.getImageData(0, 0, cw, ch);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const [h, s, v] = radarRgbToHsv(d[i], d[i + 1], d[i + 2]);
    const isRain = s >= isolate.minSaturation && v >= isolate.minBrightness && v <= isolate.maxBrightness && radarHueAllowed(h);
    if (!isRain) d[i + 3] = 0;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}
// Feathers the composite's alpha down to 0 near the edge of its frame —
// purely cosmetic now that this is the national composite (not a single-site
// scan with genuine range-degradation to hide): avoids a hard rectangular
// cutoff at the image's edge if the view ever pans out far enough to see it.
// Mirrors radar-map.html's applyRadialFade (same fadeStartFrac).
function radarApplyRadialFade(canvas, fadeStartFrac = 0.82) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const maxR = Math.min(w, h) / 2;
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i + 3] === 0) continue;
      const distFrac = Math.hypot(x - cx, y - cy) / maxR;
      if (distFrac > fadeStartFrac) {
        const fade = Math.max(0, 1 - (distFrac - fadeStartFrac) / (1 - fadeStartFrac));
        d[i + 3] = Math.round(d[i + 3] * fade);
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}
// ── Regional (single-site) hi-res radar ────────────────────────────────────
// The national composite is ~2.13 km/px. A single-site PPI scan covers ~630km
// across the same 600px, i.e. ~1.05 km/px — twice the linear detail over the
// area that matters when you're looking at one field.
//
// Mirrored from src/radarRegionalCalibration.js (this page is static, outside
// the build, so it can't import) — keep both in sync by hand. Only the regions
// that have been hand-aligned against the coastline are listed; adding another
// site means calibrating its corners first, not just naming it here.
const REGIONAL_RADAR_CALIBRATIONS = {
  westland: {
    crop: { topPct: 0, bottomPct: 0, leftPct: 0, rightPct: 21 },
    isolate: { minSaturation: 15, minBrightness: 20, maxBrightness: 100,
      hueBands: { yellowGold: true, green: true, blue: true, redPurple: true } },
    corners: [[167.7392578125, -40.396764305572034], [174.61669921875, -39.926588421909436],
      [175.0341796875, -45.50634690108341], [167.200927734375, -45.34442410452239]],
    opacity: 0.9,
  },
  canterbury: {
    crop: { topPct: 0, bottomPct: 0, leftPct: 0, rightPct: 21 },
    isolate: { minSaturation: 36, minBrightness: 30, maxBrightness: 100,
      hueBands: { yellowGold: true, green: true, blue: true, redPurple: true } },
    corners: [[168.37646484375, -40.99648401437788], [175.75927734375, -41.04621681452063],
      [176.02294921875, -46.54374960273856], [168.1787109375, -46.392411189814645]],
    opacity: 0.9,
  },
  bayofplenty: {
    crop: { topPct: 0, bottomPct: 0, leftPct: 0, rightPct: 21 },
    isolate: { minSaturation: 34, minBrightness: 28, maxBrightness: 100,
      hueBands: { yellowGold: true, green: true, blue: true, redPurple: true } },
    corners: [[172.68310546875, -35.31736632923786], [179.5166015625, -35.33529320309327],
      [179.593505859375, -40.71395582628604], [172.540283203125, -40.72228267283148]],
    opacity: 0.9,
  },
  otago: {
    crop: { topPct: 0, bottomPct: 0, leftPct: 0, rightPct: 21 },
    isolate: { minSaturation: 34, minBrightness: 28, maxBrightness: 100,
      hueBands: { yellowGold: true, green: true, blue: true, redPurple: true } },
    corners: [[166.4208984375, -42.94033923363181], [173.4521484375, -42.94033923363181],
      [173.4521484375, -48.42920055556841], [166.4208984375, -48.42920055556841]],
    opacity: 0.9,
  },
};

// A PPI scan is centred on its own radar site, so the calibrated quad's midpoint
// IS the site. Nearest one to the selected resort wins — only one region is
// fetched per frame (not all four), keeping this to one extra request per tick.
function radarRegionCentre(region) {
  const c = REGIONAL_RADAR_CALIBRATIONS[region].corners;
  const lons = c.map((p) => p[0]), lats = c.map((p) => p[1]);
  return [(Math.min(...lons) + Math.max(...lons)) / 2, (Math.min(...lats) + Math.max(...lats)) / 2];
}

function radarNearestRegion() {
  let best = null, bestD = Infinity;
  for (const region of Object.keys(REGIONAL_RADAR_CALIBRATIONS)) {
    const [lon, lat] = radarRegionCentre(region);
    // Rough equirectangular distance — only used to rank sites, so the cos
    // correction at NZ latitudes is plenty.
    const dx = (lon - LOC.lon) * Math.cos((lat * Math.PI) / 180);
    const dy = lat - LOC.lat;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = region; }
  }
  return best;
}

function radarRegionalFrameUrl(region, ts) {
  return `/radar-feed-regional/${region}/${ts}.gif`;
}

// Same isolate pass as the national composite, but driven by the region's own
// thresholds — the single-site frames carry a white coastline and a white
// 55dBZ band that are visually identical, so each region was tuned separately
// for how much of that to let through.
function radarCropAndIsolateWith(img, cal) {
  const { crop, isolate } = cal;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const top = Math.round(ih * crop.topPct / 100), bottom = Math.round(ih * crop.bottomPct / 100);
  const left = Math.round(iw * crop.leftPct / 100), right = Math.round(iw * crop.rightPct / 100);
  const cw = Math.max(1, iw - left - right), ch = Math.max(1, ih - top - bottom);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, left, top, cw, ch, 0, 0, cw, ch);
  const imgData = ctx.getImageData(0, 0, cw, ch);
  const d = imgData.data;
  const bands = isolate.hueBands;
  for (let i = 0; i < d.length; i += 4) {
    const [h, s, v] = radarRgbToHsv(d[i], d[i + 1], d[i + 2]);
    let hueOk = false;
    if (bands.yellowGold && h >= 35 && h < 70) hueOk = true;
    else if (bands.green && h >= 70 && h < 160) hueOk = true;
    else if (bands.blue && h >= 160 && h < 280) hueOk = true;
    else if (bands.redPurple && (h >= 280 || h < 35)) hueOk = true;
    const isRain = s >= isolate.minSaturation && v >= isolate.minBrightness && v <= isolate.maxBrightness && hueOk;
    if (!isRain) d[i + 3] = 0;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

// Clears the national frame's alpha where the regional covers it, following the
// SAME fade curve the regional's own edge uses, so the two crossfade instead of
// stacking. Without this the overlap showed doubled/ghosted rain wherever the
// two feeds didn't align exactly — they're separate scans minutes apart, so
// they never align perfectly.
//
// The national quad is treated as an axis-aligned lat/lon box (ignoring its
// small hand-calibrated skew) and the region as an ellipse on its own quad's
// midpoint: good enough for a soft hole, not a survey.
function radarPunchRegionalHole(canvas, nationalQuad, region) {
  const cal = REGIONAL_RADAR_CALIBRATIONS[region];
  if (!cal) return canvas;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const nLons = nationalQuad.map((c) => c[0]), nLats = nationalQuad.map((c) => c[1]);
  const minLon = Math.min(...nLons), maxLon = Math.max(...nLons);
  const minLat = Math.min(...nLats), maxLat = Math.max(...nLats);
  const lons = cal.corners.map((c) => c[0]), lats = cal.corners.map((c) => c[1]);
  const centerLon = (Math.min(...lons) + Math.max(...lons)) / 2;
  const centerLat = (Math.min(...lats) + Math.max(...lats)) / 2;
  const radiusLon = (Math.max(...lons) - Math.min(...lons)) / 2;
  const radiusLat = (Math.max(...lats) - Math.min(...lats)) / 2;

  const fadeStartFrac = 0.82; // matches radarApplyRadialFade so the zones line up
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  for (let y = 0; y < h; y++) {
    const lat = maxLat - (y / h) * (maxLat - minLat);
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i + 3] === 0) continue;
      const lon = minLon + (x / w) * (maxLon - minLon);
      const distFrac = Math.hypot((lon - centerLon) / radiusLon, (lat - centerLat) / radiusLat);
      if (distFrac > 1) continue;
      const keep = distFrac <= fadeStartFrac ? 0 : (distFrac - fadeStartFrac) / (1 - fadeStartFrac);
      d[i + 3] = Math.round(d[i + 3] * keep);
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

async function radarLoadImage(url) {
  const res = await fetch(url);
  if (!res.ok) return null;
  const blob = await res.blob();
  const blobUrl = URL.createObjectURL(blob);
  try {
    return await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve({ img: im, blobUrl });
      im.onerror = reject;
      im.src = blobUrl;
    });
  } catch (e) {
    URL.revokeObjectURL(blobUrl);
    return null;
  }
}

async function radarFetchAndProcessFrame(ts) {
  const loaded = await radarLoadImage(radarFrameUrl(ts));
  if (!loaded) return null;
  try {
    // The single-site feed runs at roughly half the national cadence (~15 min
    // vs ~7.5), so an exact timestamp match only lands about every other frame.
    // Taking that literally made the patch blink between sharp and coarse on
    // alternating frames during playback, which is far more distracting than
    // the thing it was showing. Fall back through the preceding slots instead,
    // so every frame finds a scan within ~15 min and the detail simply holds.
    const region = radarNearestRegion();
    let regionalUrl = null;
    let regionalTs = null;
    if (region) {
      // ts itself first, then up to two slots back — the timestamp grid is
      // shared between the two feeds, so stepping it is exact, not guesswork.
      const slots = [ts, ...radarCandidateTimestamps(3, new Date(radarTsToDate(ts).getTime() - 60000))];
      for (const cand of slots.slice(0, 3)) {
        const rLoaded = await radarLoadImage(radarRegionalFrameUrl(region, cand));
        if (!rLoaded) continue;
        try {
          const rCanvas = radarApplyRadialFade(
            radarCropAndIsolateWith(rLoaded.img, REGIONAL_RADAR_CALIBRATIONS[region]));
          regionalUrl = rCanvas.toDataURL('image/png');
          regionalTs = cand;
        } finally {
          URL.revokeObjectURL(rLoaded.blobUrl);
        }
        break;
      }
    }
    let canvas = radarApplyRadialFade(radarCropAndIsolate(loaded.img));
    // Only punch the hole when there's actually a regional frame to fill it,
    // or the national would just be missing a chunk of rain.
    if (regionalUrl) canvas = radarPunchRegionalHole(canvas, RADAR_CALIBRATION.corners, region);
    return {
      timestamp: ts,
      dataUrl: canvas.toDataURL('image/png'),
      regionalUrl,
      regionalTs,
      region: regionalUrl ? region : null,
    };
  } finally {
    URL.revokeObjectURL(loaded.blobUrl);
  }
}

// "Last 1-2 hours" rather than the feed's full (year-plus) archive — a
// lightweight rolling window that's fast to fetch and process on tab open,
// not a scrubber through months of history.
const RADAR_MAX_FRAMES = 16; // ~2h at the feed's ~7.5-min cadence
const RADAR_REFRESH_POLL_MS = 90000;
let radarFrames = [];       // [{ timestamp, dataUrl }], oldest -> newest
let radarCurrentIndex = -1;
let radarPlayTimer = null;
let radarLoadPromise = null;
let radarPollStarted = false;

// The hi-res patch, drawn immediately above the national drape. Its own source
// has to be recreated (not just updateImage'd) when the region changes, because
// the source's `coordinates` — the quad it's projected onto — differ per site.
let radarRegionalShown = null;

function radarDrawRegional(f) {
  const hasRegional = !!(f && f.regionalUrl);
  const visible = hasRegional && viewMode === 'radar' && !radarAccumOn;
  if (!hasRegional) {
    // Hide rather than remove: frames drop in and out as the site's publishing
    // schedule drifts against the national one, and churning the layer on every
    // gap flickers.
    if (map.getLayer('radar-regional-layer')) map.setLayoutProperty('radar-regional-layer', 'visibility', 'none');
    return;
  }
  const cal = REGIONAL_RADAR_CALIBRATIONS[f.region];
  if (map.getSource('radar-regional-src') && radarRegionalShown === f.region) {
    map.getSource('radar-regional-src').updateImage({ url: f.regionalUrl });
  } else {
    if (map.getLayer('radar-regional-layer')) map.removeLayer('radar-regional-layer');
    if (map.getSource('radar-regional-src')) map.removeSource('radar-regional-src');
    map.addSource('radar-regional-src', { type: 'image', url: f.regionalUrl, coordinates: cal.corners });
    // Directly above the national drape and below the lift lines, same slot
    // reasoning as radar-layer itself.
    map.addLayer({
      id: 'radar-regional-layer', type: 'raster', source: 'radar-regional-src',
      paint: { 'raster-opacity': cal.opacity, 'raster-fade-duration': 0 },
      layout: { visibility: visible ? 'visible' : 'none' },
    }, map.getLayer('resort-lifts-line') ? 'resort-lifts-line' : undefined);
    radarRegionalShown = f.region;
    bringContoursAboveRadar();
  }
  map.setLayoutProperty('radar-regional-layer', 'visibility', visible ? 'visible' : 'none');
}

function radarDrawFrame(i) {
  if (!map || !radarFrames[i]) return;
  radarCurrentIndex = i;
  const f = radarFrames[i];
  if (map.getSource('radar-src')) {
    map.getSource('radar-src').updateImage({ url: f.dataUrl });
  } else if (map.getLayer('satellite')) {
    // 'satellite' existing is this file's established proxy for "the style
    // has actually attached" (see applyRampWhenReady above) — addSource/
    // addLayer can throw if called before that, so this must not be assumed
    // just because openMapView() already returned.
    map.addSource('radar-src', { type: 'image', url: f.dataUrl, coordinates: RADAR_CALIBRATION.corners });
    // Resort lift lines ('resort-lifts-line', added during initial map setup
    // for the resorts that have lift data) should read as ground markers
    // above the radar colour drape, not buried under it — insert radar-layer
    // before it when it exists. Not every resort has lifts (see the liftData
    // ternary above), so this must not assume the layer is there.
    map.addLayer({
      id: 'radar-layer', type: 'raster', source: 'radar-src',
      paint: { 'raster-opacity': RADAR_CALIBRATION.opacity, 'raster-fade-duration': 0 },
      layout: { visibility: viewMode === 'radar' && !radarAccumOn ? 'visible' : 'none' },
    }, map.getLayer('resort-lifts-line') ? 'resort-lifts-line' : undefined);
    // Dark mode's contour-lines layer (if already on) was inserted at this
    // same 'before resort-lifts-line' slot earlier — radar-layer just took
    // that exact spot, which would otherwise leave contours buried
    // underneath it. Re-assert contours back on top (see setDarkMode).
    bringContoursAboveRadar();
  } else {
    setTimeout(() => radarDrawFrame(i), 80);
    return;
  }
  radarDrawRegional(f);
  // While Σ Total is showing, #rtl-label is carrying the accumulation's own
  // window/progress text — the live loop still loads and polls underneath, but
  // it mustn't overwrite that from under it.
  if (!radarAccumOn) radarUpdateTimelineUi(i);
}

// Slider/label/step-button updates only, no map source changes.
function radarUpdateTimelineUi(i) {
  const f = radarFrames[i];
  if (!f) return;
  const slider = document.getElementById('rtl-slider');
  slider.max = radarFrames.length - 1;
  slider.value = i;
  document.getElementById('rtl-prev').disabled = i <= 0;
  document.getElementById('rtl-next').disabled = i >= radarFrames.length - 1;
  document.getElementById('rtl-label').textContent = radarFormatTs(f.timestamp);
}

function radarStepFrame(delta) {
  radarStopPlay();
  radarDrawFrame(Math.max(0, Math.min(radarFrames.length - 1, radarCurrentIndex + delta)));
}
function radarTogglePlay() {
  // Σ Total is one still image — nothing to animate, and letting playback run
  // would just churn the hidden live layer and fight for #rtl-label.
  if (radarAccumOn) return;
  if (radarPlayTimer) radarStopPlay(); else radarStartPlay();
}

// Steps through the real fetched frames one at a time — raw imagery only,
// no cross-fade or motion interpolation (that produced visible warping/
// tearing artifacts on some frames — see chat, removed). Fixed 1s per frame
// regardless of the real gap between frames, for a fast, snappy cycle
// through the set rather than pacing to real elapsed time.
const RADAR_PLAY_FRAME_MS = 1000;
function radarStartPlay() {
  if (radarFrames.length < 2) return;
  if (radarCurrentIndex >= radarFrames.length - 1) radarDrawFrame(0);
  document.getElementById('rtl-play').innerHTML = PAUSE_ICON_SVG;
  radarPlayTimer = setInterval(() => {
    if (radarCurrentIndex >= radarFrames.length - 1) { radarStopPlay(); return; }
    radarDrawFrame(radarCurrentIndex + 1);
  }, RADAR_PLAY_FRAME_MS);
}
function radarStopPlay() {
  if (radarPlayTimer) { clearInterval(radarPlayTimer); radarPlayTimer = null; }
  document.getElementById('rtl-play').textContent = '▶';
}

async function radarLoadFrames() {
  const found = [];
  for (const ts of radarCandidateTimestamps(24)) {
    if (found.length >= RADAR_MAX_FRAMES) break;
    const frame = await radarFetchAndProcessFrame(ts).catch(() => null);
    if (frame) found.push(frame);
  }
  if (found.length === 0) return;
  radarFrames = found.reverse(); // oldest -> newest
  radarDrawFrame(radarFrames.length - 1);
}

// Polls for a newer frame; if you're viewing the latest one ("live") it
// auto-advances so the drape tracks reality, otherwise your scrub position
// is left alone. Mirrors public/radar-map.html's refresh logic.
async function radarPollForNewFrame() {
  if (radarFrames.length === 0) return;
  const latestKnown = radarFrames[radarFrames.length - 1].timestamp;
  const candidates = radarCandidateTimestamps(4).filter((ts) => ts > latestKnown).reverse();
  for (const ts of candidates) {
    const frame = await radarFetchAndProcessFrame(ts).catch(() => null);
    if (!frame) continue;
    const wasAtLive = radarCurrentIndex === radarFrames.length - 1 && !radarPlayTimer;
    const currentTs = radarFrames[radarCurrentIndex]?.timestamp;
    radarFrames.push(frame);
    if (radarFrames.length > RADAR_MAX_FRAMES) radarFrames.shift();
    document.getElementById('rtl-slider').max = radarFrames.length - 1;
    if (wasAtLive) {
      radarDrawFrame(radarFrames.length - 1);
    } else {
      const idx = radarFrames.findIndex((f) => f.timestamp === currentTs);
      radarCurrentIndex = idx >= 0 ? idx : 0;
      document.getElementById('rtl-slider').value = radarCurrentIndex;
      document.getElementById('rtl-prev').disabled = radarCurrentIndex <= 0;
      document.getElementById('rtl-next').disabled = radarCurrentIndex >= radarFrames.length - 1;
    }
  }
}

function radarEnterMode() {
  // Whether the Σ Total drape was left on (and over what window) is
  // remembered across visits/reloads, same as the view mode itself.
  radarLoadAccumPrefs();
  radarSyncAccumPanel();
  radarSyncLayerVisibility();
  if (!radarPollStarted) {
    radarPollStarted = true;
    setInterval(radarPollForNewFrame, RADAR_REFRESH_POLL_MS);
  }
  // The live frames still load underneath even when arriving straight into the
  // accumulated view — toggling Σ off has to be instant, not another wait.
  if (radarFrames.length > 0) {
    radarDrawFrame(radarCurrentIndex < 0 ? radarFrames.length - 1 : radarCurrentIndex);
  } else if (!radarLoadPromise) {
    if (!radarAccumOn) document.getElementById('rtl-label').textContent = 'Loading…';
    radarLoadPromise = radarLoadFrames();
  }
  if (radarAccumOn) radarEnsureAccum();
}

document.getElementById('rtl-slider').addEventListener('input', (e) => {
  radarStopPlay();
  radarDrawFrame(parseInt(e.target.value, 10));
});

// ── Accumulated rain radar (Σ Total) ────────────────────────────────────────
// The live loop answers "where is it raining now"; this answers "where did it
// all land". Every frame in the window is summed as rate x time into one still
// image, so the morning after a storm you can see which ranges actually got
// worked over instead of guessing from the last frame. Engine: RadarAccum
// (public/radar-accum.js) — reconstructed from the feed's own history on
// demand, so nothing has to have been left running overnight.
const RADAR_ACCUM_SRC = 'radar-accum-src';
const RADAR_ACCUM_LAYER = 'radar-accum-layer';
// Rebuild rather than reuse once a cached total is this old — new frames have
// published by then and the total is visibly behind.
const RADAR_ACCUM_STALE_MS = 15 * 60 * 1000;
const RADAR_ACCUM_CACHE_KEY = 'sp-radar-accum-cache';

// The window slider's stops. Deliberately NOT a linear 1..48 range: at the
// short end an hour either way changes the picture, while at the long end it's
// noise, and a linear range would also cram 48 positions into ~130px — about
// 2.5px per stop, which is not a thumb target on a phone. Sixteen stops keeps
// every one comfortably tappable and still spans 1h to 2 days.
//
// The upper bound is a cost decision, not a data limit: the feed's history goes
// back over a month, but 48h is ~390 frames (~35MB, well over half a minute of
// fetching), and beyond that the wait stops being worth it.
const RADAR_ACCUM_HOUR_STEPS = [1, 2, 3, 4, 6, 8, 10, 12, 15, 18, 21, 24, 30, 36, 42, 48];
const radarAccumHoursToIndex = (h) => {
  let best = 0;
  for (let i = 0; i < RADAR_ACCUM_HOUR_STEPS.length; i++) {
    if (Math.abs(RADAR_ACCUM_HOUR_STEPS[i] - h) < Math.abs(RADAR_ACCUM_HOUR_STEPS[best] - h)) best = i;
  }
  return best;
};

let radarAccumOn = false;
let radarAccumHours = 12;
// The summed field itself ({ mm, width, height }) — kept in memory because the
// tap readout samples it, not just the coloured image.
let radarAccumGrid = null;
let radarAccumMeta = null;
let radarAccumToken = 0;
let radarAccumAbort = null;
let radarAccumPrefsLoaded = false;

function radarAccumSetStatus(text) {
  document.getElementById('rtl-label').textContent = text;
}

// One place decides which of the two radar drapes is showing. Called from
// setViewMode, from the accumulation toggle, and whenever either layer is
// (re)created — otherwise the two can both end up visible and stack.
function radarSyncLayerVisibility() {
  if (!map) return;
  const live = viewMode === 'radar' && !radarAccumOn;
  const accum = viewMode === 'radar' && radarAccumOn;
  if (map.getLayer('radar-layer')) map.setLayoutProperty('radar-layer', 'visibility', live ? 'visible' : 'none');
  // The hi-res regional patch rides with the live loop — it has no meaning over
  // the accumulation, which is summed from the national frames only.
  if (map.getLayer('radar-regional-layer')) {
    const hasRegional = !!radarFrames[radarCurrentIndex]?.regionalUrl;
    map.setLayoutProperty('radar-regional-layer', 'visibility', (live && hasRegional) ? 'visible' : 'none');
  }
  if (map.getLayer(RADAR_ACCUM_LAYER)) map.setLayoutProperty(RADAR_ACCUM_LAYER, 'visibility', accum ? 'visible' : 'none');
  // The coastline reference belongs to the accumulated drape only — the live
  // loop is animated and reads fine against the basemap it doesn't hide.
  RadarAccum.setOutlineVisible(map, accum);
}

// Radar normally hides the drawer entirely (it has no info panel of its own),
// but the accumulation view does have one to show — the mm legend.
function radarSyncAccumPanel() {
  const on = viewMode === 'radar' && radarAccumOn;
  document.getElementById('info-radar-accum').style.display = on ? 'block' : 'none';
  if (viewMode === 'radar') document.getElementById('snow-info').style.display = on ? '' : 'none';
  document.getElementById('rtl-accum').classList.toggle('active', radarAccumOn);
  document.getElementById('radar-timeline').classList.toggle('accum-on', radarAccumOn);
  document.getElementById('rtl-accum-slider').value = radarAccumHoursToIndex(radarAccumHours);
  document.getElementById('rtl-accum-hours').textContent = `${radarAccumHours}h`;
  // Resort pills are hidden over the accumulation drape — this is the single
  // choke point every accum state change goes through (toggle, view switch,
  // restored preference), so the pills can't get out of step with it.
  updateResortPillVisibility();
}

function radarLoadAccumPrefs() {
  if (radarAccumPrefsLoaded) return;
  radarAccumPrefsLoaded = true;
  try {
    const h = parseInt(localStorage.getItem('sp-radar-accum-hours'), 10);
    if (RADAR_ACCUM_HOUR_STEPS.includes(h)) radarAccumHours = h;
    if (localStorage.getItem('sp-radar-accum') === '1') radarAccumOn = true;
  } catch (e) {}
}

function radarToggleAccum() {
  radarAccumOn = !radarAccumOn;
  pwPersist('sp-radar-accum', radarAccumOn ? '1' : '0');
  radarSyncAccumPanel();
  radarSyncLayerVisibility();
  if (radarAccumOn) {
    radarStopPlay();
    radarEnsureAccum();
  } else {
    // Back to the live loop — abandon any build still running, and put the
    // scrubber's own label back (it was carrying build progress).
    radarAccumToken++;
    if (radarAccumAbort) { radarAccumAbort.abort(); radarAccumAbort = null; }
    if (radarCurrentIndex >= 0) radarUpdateTimelineUi(radarCurrentIndex);
  }
}

// Dragging the slider only moves the number — the rebuild waits for release.
// Each window is ~100 fetches and several seconds of summing, so rebuilding per
// input event would fire a dozen of them on one drag.
document.getElementById('rtl-accum-slider').addEventListener('input', (e) => {
  radarAccumHours = RADAR_ACCUM_HOUR_STEPS[parseInt(e.target.value, 10)];
  document.getElementById('rtl-accum-hours').textContent = `${radarAccumHours}h`;
});
document.getElementById('rtl-accum-slider').addEventListener('change', () => {
  pwPersist('sp-radar-accum-hours', String(radarAccumHours));
  // Not forced: if the drag ended back on the window already built, this hits
  // the cache and redraws instantly instead of refetching it all.
  radarEnsureAccum();
});

// Puts a colourised accumulation image on the map, creating the layer the first
// time. Split out from radarDrawAccum so progressive partials can update the
// drape without touching the legend panel, which describes the finished window.
function radarDrawAccumImage(png) {
  if (!map) return false;
  if (map.getSource(RADAR_ACCUM_SRC)) {
    map.getSource(RADAR_ACCUM_SRC).updateImage({ url: png });
  } else if (map.getLayer('satellite')) {
    // 'satellite' existing is this file's established proxy for "the style has
    // actually attached" — see radarDrawFrame, same guard and same reason.
    map.addSource(RADAR_ACCUM_SRC, { type: 'image', url: png, coordinates: RadarAccum.CORNERS });
    map.addLayer({
      id: RADAR_ACCUM_LAYER, type: 'raster', source: RADAR_ACCUM_SRC,
      paint: { 'raster-opacity': 1, 'raster-fade-duration': 0 },
      layout: { visibility: 'none' }, // radarSyncLayerVisibility below decides
    }, map.getLayer('resort-lifts-line') ? 'resort-lifts-line' : undefined);
    // Same slot radar-layer and dark mode's contours compete for — re-assert
    // contours above whatever just took it (see radarDrawFrame).
    bringContoursAboveRadar();
  } else {
    return false; // style not attached yet
  }
  // Coastline reference on top of the drape. Same anchor the accumulation layer
  // used, so it lands directly above it — and after bringContoursAboveRadar()
  // above, so dark mode's contour raster can't end up over the top of it.
  RadarAccum.ensureOutline(map, map.getLayer('resort-lifts-line') ? 'resort-lifts-line' : undefined);
  radarSyncLayerVisibility();
  return true;
}

// Draws (or updates) the accumulation drape and refreshes the legend panel.
function radarDrawAccum(res) {
  if (!map) return;
  if (!radarDrawAccumImage(RadarAccum.colourise(res.mm, res.width, res.height))) {
    setTimeout(() => radarDrawAccum(res), 80);
    return;
  }
  radarRenderAccumPanel(res);
}

function radarRenderAccumPanel(res) {
  const here = RadarAccum.sampleMm(res, LOC.center[0], LOC.center[1]);
  const label = LOC.shortName || LOC.name;
  // res.hours, not radarAccumHours: mid-drag the slider is already showing the
  // window you're about to build, while this panel describes the one on screen.
  const shownHours = res.hours || radarAccumHours;
  document.getElementById('radar-accum-title').textContent = `Radar Rain Total — ${shownHours}h`;
  document.getElementById('radar-accum-total').textContent =
    here == null ? '—' : `${here < 10 ? here.toFixed(1) : Math.round(here)} mm`;
  const hrs = res.coverageHours.toFixed(1);
  document.getElementById('radar-accum-sub').innerHTML =
    `at ${label}<br>${RadarAccum.formatWindow(res.firstTs, res.lastTs)}` +
    `<br>${res.framesUsed} frames · ${hrs}h covered`;
  // legend() returns bands high->low for a stacked list; the ramp reads
  // low->high left to right, so flip it. Only every other boundary gets a label
  // — eleven numbers across ~260px is unreadable, and the ramp's shape carries
  // the rest.
  const bands = RadarAccum.legend().slice().reverse();
  const lowEdge = (row) => row.label.split('–')[0];
  document.getElementById('radar-accum-legend').innerHTML =
    `<div class="ral-bar">${bands.map((b) => `<i style="background:${b.css}"></i>`).join('')}</div>` +
    `<div class="ral-ticks">${bands
      .filter((_, i) => i % 2 === 0 || i === bands.length - 1)
      .map((b) => `<span>${lowEdge(b)}</span>`).join('')}<span>mm</span></div>`;
  document.getElementById('radar-accum-note').textContent =
    'Radar water-equivalent estimate, not a gauge. ~1mm ≈ 1cm snow above the snow line. Tap anywhere for a total.';
  radarAccumSetStatus(`Σ ${shownHours}h to ${radarFormatTs(res.lastTs)}`);
}

// sessionStorage so a page reload (or a fresh iframe when the Map tab is
// reopened) doesn't pay for the whole rebuild again. Only the log-quantised
// grid PNG is stored, not the Float32 field — a couple of hundred KB instead of
// 2.4MB, and it re-expands to both the drape and the tap-readout grid.
function radarSaveAccumCache(res) {
  try {
    sessionStorage.setItem(RADAR_ACCUM_CACHE_KEY, JSON.stringify({
      hours: radarAccumHours, builtAt: Date.now(), gridPng: res.gridPng,
      framesUsed: res.framesUsed, coverageHours: res.coverageHours,
      firstTs: res.firstTs, lastTs: res.lastTs, maxMm: res.maxMm,
    }));
  } catch (e) { /* quota or private mode — the in-memory copy still works */ }
}

async function radarRestoreAccumCache() {
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(RADAR_ACCUM_CACHE_KEY)); } catch (e) { return null; }
  if (!saved || saved.hours !== radarAccumHours || !saved.gridPng) return null;
  if (Date.now() - saved.builtAt > RADAR_ACCUM_STALE_MS) return null;
  try {
    const grid = await RadarAccum.pngToGrid(saved.gridPng);
    return { ...saved, mm: grid.mm, width: grid.width, height: grid.height };
  } catch (e) { return null; }
}

// Shows the accumulation for the current window, reusing whatever's already
// built where possible: the in-memory copy first, then this session's cache,
// then a full rebuild from the feed.
async function radarEnsureAccum(force) {
  if (!radarAccumOn) return;
  if (!force && radarAccumMeta && radarAccumMeta.hours === radarAccumHours &&
      Date.now() - radarAccumMeta.builtAt < RADAR_ACCUM_STALE_MS) {
    radarDrawAccum(radarAccumMeta);
    return;
  }
  const token = ++radarAccumToken;
  if (radarAccumAbort) radarAccumAbort.abort();
  const ac = new AbortController();
  radarAccumAbort = ac;

  if (!force) {
    const cached = await radarRestoreAccumCache();
    if (token !== radarAccumToken) return;
    if (cached) {
      radarAccumGrid = cached;
      radarAccumMeta = cached;
      radarAccumAbort = null; // nothing was ever started for this token
      radarDrawAccum(cached);
      return;
    }
  }

  radarAccumSetStatus(`Building ${radarAccumHours}h total…`);
  let res = null;
  try {
    res = await RadarAccum.build({
      lookbackHours: radarAccumHours,
      signal: ac.signal,
      onProgress: ({ done, total, phase }) => {
        if (token !== radarAccumToken) return;
        radarAccumSetStatus(phase === 'fetch'
          ? `Reading radar history ${done}/${total}…`
          : `Adding it up ${done}/${total}…`);
      },
      // Show the total forming rather than a blank map behind a counter. Each
      // partial is a real accumulation of the oldest frames so far, so it grows
      // toward the answer instead of flickering.
      onPartial: ({ mm, width, height }) => {
        if (token !== radarAccumToken || !map) return;
        radarDrawAccumImage(RadarAccum.colourise(mm, width, height));
      },
    });
  } catch (e) {
    console.warn('Radar accumulation failed:', e);
  }
  if (token !== radarAccumToken) return;
  radarAccumAbort = null;
  if (!res) {
    radarAccumSetStatus('Radar history unavailable');
    return;
  }
  const withMeta = { ...res, hours: radarAccumHours, builtAt: Date.now() };
  radarAccumGrid = withMeta;
  radarAccumMeta = withMeta;
  radarDrawAccum(withMeta);
  radarSaveAccumCache(res);
}

function setPeriod(days) {
  accumDays = days;
  pwPersist('sp-accum-days', days);
  document.querySelectorAll('#period-switch .pill-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.days, 10) === days));
  renderAccumulatedView();
}

function enterFullscreenView() {
  const el = document.getElementById('map-screen');
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (!req) return;
  // Fullscreen needs transient user activation. Split mode calls this on the
  // user's click so it normally succeeds, but the browser still rejects if the
  // activation has lapsed (or the embedder disallows it) — swallow that so a
  // refused fullscreen degrades to "split screen, not fullscreen" instead of an
  // unhandled rejection that aborts the rest of the setup.
  try {
    const r = req.call(el);
    if (r && typeof r.catch === 'function') r.catch(() => {});
  } catch (e) {}
}

function exitFullscreenView() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (exit) exit.call(document);
}

function updateFullscreenUI() {
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  document.getElementById('map-screen').classList.toggle('is-fullscreen', isFs);
}
['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach((evt) =>
  document.addEventListener(evt, updateFullscreenUI)
);
// Redraw the freezing-level sparkline (sized in pixels) when the map resizes.
window.addEventListener('resize', () => { if (typeof viewMode !== 'undefined' && viewMode === 'live') pwRenderFreezingOverlay(); });
// Split mode's panes, comparison graph and divergence strip are all sized in
// pixels too, and entering/leaving fullscreen fires resize — so re-measure the
// second map and redraw both SVGs. Also drops out of split if the window is
// narrowed to mobile width, where the feature is hidden entirely.
window.addEventListener('resize', () => {
  if (!splitMode) return;
  if (window.innerWidth <= 700) { exitSplitMode(); return; }
  try { mapB && mapB.resize(); } catch (e) {}
  renderSplitComparisonOverlay();
  renderDivergenceStrip();
});

// ── Timeline scrubber: drag-to-seek + play/pause autoplay ────────────────────
document.getElementById('tl-slider').addEventListener('input', (e) => {
  stopPlay();
  openMapView(parseInt(e.target.value, 10));
});

let playTimer = null;
let playSpeed = 3;
const BASE_INTERVAL_MS = 700;

// Blend two hours' freezing level/snowfall linearly so the snow-relief ramp
// (built from whichever blended values come out) animates as a continuous
// fade between hours instead of jumping in discrete steps during playback.
function blendHour(a, b, t) {
  // Carry the wet-bulb snow/rain lines through the blend. Without them
  // buildSnowRamp saw them as absent for every animation frame and silently
  // fell back to the freezing-level-minus-300m line — so hitting play dropped
  // the sleet band entirely and jumped the snow line (~70m at Whakapapa),
  // then openMapView put both back at each full-hour tick. Null-safe on both
  // sides so a model without wet-bulb still blends to null rather than NaN.
  const lerp = (x, y) => (x == null || y == null) ? null : x + (y - x) * t;
  return {
    freezingLevel: a.freezingLevel + (b.freezingLevel - a.freezingLevel) * t,
    snowfallMm: a.snowfallMm + (b.snowfallMm - a.snowfallMm) * t,
    snowLineWB: lerp(a.snowLineWB, b.snowLineWB),
    rainLineWB: lerp(a.rainLineWB, b.rainLineWB)
  };
}

function togglePlay() {
  if (playTimer) stopPlay();
  else startPlay();
}

function startPlay() {
  if (currentIndex < 0) return;
  if (currentIndex >= forecastHours.length - 1) openMapView(0); // restart from the beginning
  document.getElementById('tl-play').innerHTML = PAUSE_ICON_SVG;
  if (playTimer) cancelAnimationFrame(playTimer);

  const tickMs = BASE_INTERVAL_MS / playSpeed;
  let tickStart = performance.now();

  // fromBands/toBands — the real per-elevation curves for the two hours
  // currently being animated between — only change once per tick (~230-
  // 700ms), not on every requestAnimationFrame callback (~60/s). Cached
  // here and only refreshed when currentIndex actually advances, so the
  // real scan through each band's hourly series (computeElevationBandRates)
  // doesn't redo needless work 60 times a second for two hours that haven't
  // changed — only the cheap per-frame blend below does.
  let cachedIndex = -1, fromBands = null, toBands = null;
  const refreshBandCache = () => {
    if (cachedIndex === currentIndex) return;
    cachedIndex = currentIndex;
    const from = forecastHours[currentIndex];
    const to = forecastHours[currentIndex + 1];
    const fromCm = from.snowfallMm >= SNOWFALL_THRESHOLD_MM ? from.snowfallMm / 10 : 0;
    const toCm = to.snowfallMm >= SNOWFALL_THRESHOLD_MM ? to.snowfallMm / 10 : 0;
    fromBands = fromCm > 0 ? computeElevationBandRates(from.time, fromCm) : null;
    toBands = toCm > 0 ? computeElevationBandRates(to.time, toCm) : null;
  };
  refreshBandCache();

  const frame = (now) => {
    if (currentIndex >= forecastHours.length - 1) { stopPlay(); return; }
    const t = Math.min(1, (now - tickStart) / tickMs);
    const from = forecastHours[currentIndex];
    const to = forecastHours[currentIndex + 1];
    const blended = blendHour(from, to, t);
    // Real per-elevation blend between the two real hours' own curves, not
    // just their flat totals — elevationBandsFor produces the same fixed
    // elevation set for every hour of one resort, so blending by index is
    // safe. Only falls back to null (the old flat behaviour) when either
    // hour genuinely has no curve to blend (e.g. a non-snowing hour, or the
    // band fetch failed) — there's nothing real to interpolate toward in
    // that case either way.
    currentHourBandRates = (fromBands && toBands && fromBands.length === toBands.length)
      ? fromBands.map((b, i) => ({ elev: b.elev, cm: b.cm + (toBands[i].cm - b.cm) * t }))
      : null;
    applyRampWhenReady(buildSnowRamp(blended));
    // Pane B animates on the same blend fraction between ITS OWN two hours, so
    // both panes stay on the same instant rather than one sliding ahead.
    if (splitMode) {
      const bFrom = splitHourAt(splitModelB, from.time);
      const bTo = splitHourAt(splitModelB, to.time);
      if (bFrom && bTo) applyRampToMapB(buildSnowRamp(blendHour(bFrom, bTo, t)));
    }
    // Keep the tap-to-probe in sync during smooth playback too, not just at
    // each full-hour tick (openMapView) — same boundary logic as there/
    // buildSnowRamp, so a tap mid-animation still matches what's rendered.
    const blendedSnowing = blended.snowfallMm >= SNOWFALL_THRESHOLD_MM;
    // The violet band moves with the blend too — read off the same blended
    // hour the ramp above was built from, not the hour tick's raw values.
    currentSleetBand = sleetBandFor(blended);
    currentSnowLine = blendedSnowing
      ? (blended.snowLineWB != null ? blended.snowLineWB : blended.freezingLevel - SNOW_OFFSET)
      : blended.freezingLevel;
    currentHourCm = blendedSnowing ? blended.snowfallMm / 10 : 0;
    showSnowfallMarker(blendedSnowing ? `❄ ${(blended.snowfallMm / 10).toFixed(2)} cm/hr` : '');

    if (t >= 1) {
      openMapView(currentIndex + 1);
      tickStart = now;
      if (currentIndex >= forecastHours.length - 1) return; // stopPlay() already ran inside openMapView
      refreshBandCache();
    }
    playTimer = requestAnimationFrame(frame);
  };
  playTimer = requestAnimationFrame(frame);
}

function stopPlay() {
  if (playTimer) { cancelAnimationFrame(playTimer); playTimer = null; }
  document.getElementById('tl-play').textContent = '▶';
}

function setSpeed(speed) {
  playSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.speed, 10) === speed);
  });
  if (playTimer) startPlay(); // restart at the new rate without losing playback state
}

// This page always opens straight into the 3D map — to the hour given by
// ?time=2026-06-25T20:00 if present, otherwise the closest hour to now.
function openFromQueryParams() {
  // openMapView() itself now handles forecastHours being empty (it still
  // creates the base map either way) — this must not bail out before ever
  // reaching it, or the map never initializes while data is slow to load.
  if (forecastHours.length === 0) { openMapView(0); restoreViewMode(); return; }
  const targetTime = new URLSearchParams(window.location.search).get('time');
  const targetMs = targetTime ? new Date(targetTime).getTime() : Date.now();
  let bestIdx = 0, bestDiff = Infinity;
  forecastHours.forEach((r, i) => {
    const diff = Math.abs(new Date(r.time).getTime() - targetMs);
    if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
  });
  openMapView(bestIdx);
  restoreViewMode();
}

// Send the lapse-rate profile (a, b) to the parent app so it can calculate
// temperatures at any elevation (e.g., webcam locations). Also persist to
// localStorage so it's available on the Webcams tab even when the map iframe
// isn't loaded.
//
// resortKey is stamped onto the payload because 'sp-pw-profile' is a single
// shared localStorage key written by every resort's map page (this same HTML
// file serves all of them via ?resort=) — without it, the React side has no
// way to tell "this fit is Whakapapa's two on-mountain stations" apart from
// "this fit is whichever resort's map tab was open last", and could show a
// completely different mountain's temperature on Whakapapa's webcams.
function pwBroadcastProfile() {
  if (pwProfile) {
    const payload = { ...pwProfile, resort: resortKey };
    // Broadcast to parent if in an iframe
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'pw-profile', profile: payload }, '*');
    }
    // Persist to localStorage for cross-tab availability
    try { localStorage.setItem('sp-pw-profile', JSON.stringify(payload)); } catch (e) {}
  }
}

// Re-apply the view mode (live/hourly/accumulated, plus accumulated period)
// saved on the previous resort, so switching location keeps the same view.
function restoreViewMode() {
  // High-Res is Hourly-forecast only — never restore Live/Accumulated/Radar
  // from localStorage (shared same-origin with the regular Map tab, which
  // could easily have left it on something else). viewMode's own initial
  // value ('hourly', declared above) is already correct; just don't touch it.
  if (isHighResMode) return;
  let saved = null, savedDays = NaN;
  try {
    saved = localStorage.getItem('sp-view-mode');
    savedDays = parseInt(localStorage.getItem('sp-accum-days'), 10);
  } catch (e) { return; }
  // ?view= wins over the remembered mode: it's set from the host page's URL
  // (see buildPath in App.jsx), so following "/map/cardrona/radar" has to land
  // on Radar even if this browser last left the map on Hourly.
  const requestedView = new URLSearchParams(window.location.search).get('view');
  if (['live', 'hourly', 'accumulated', 'radar', 'isobars'].includes(requestedView)) saved = requestedView;
  if (saved === 'accumulated') {
    if ([5, 10, 15].includes(savedDays)) accumDays = savedDays;
    document.querySelectorAll('#period-switch .pill-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.days, 10) === accumDays));
    setViewMode('accumulated');
  } else if (saved === 'live') {
    setViewMode('live');
  } else if (saved === 'radar') {
    setViewMode('radar');
  } else if (saved === 'isobars') {
    setViewMode('isobars');
  }
  // 'hourly' or unset: openMapView already established the default hourly view.
}

// initMap() used to only be reachable via loadForecast() -> openFromQueryParams()
// -> openMapView(), all the way at the end of the weather fetch's async chain —
// so the map/terrain never appeared until every model's fetch had settled,
// taking 20-30s on a slow connection despite the terrain having nothing to do
// with that data. Kick it off immediately and independently instead; it's
// idempotent (openMapView()'s own initMap() call below just no-ops once this
// has already run). Wrapped in try/catch: if map/WebGL init throws for any
// reason, the weather fetch below absolutely must still run regardless —
// forecastHours must never depend on the map having succeeded.
try { initMap(); } catch (e) { console.error('initMap failed', e); }
loadForecast();
//
// ── Live PredictWind observation stations ──────────────────────────────────
// PredictWind serves NowCasting stations as packed map-tile JSON (see
// scripts/predictwind_obs.py for the format). We fetch the tile via the /pw-obs
// proxy, decode each station's delta-encoded series, drop a colour-coded temp
// pill on the map, and open a modal with full obs + a 12h temp plot on click.
// Units: temp = raw/10 °C, speed/gust = raw/10 knots (shown as km/h), dir = deg.
// Per-resort observation stations (with the z10 tiles they live in). We fetch
// all the resort's tiles and merge their tracks. Chosen for an elevation spread
// wide enough to fit a lapse rate.
const PW_CONFIG = {
  ruapehu: {
    tiles: [[10, 390, 1011], [10, 390, 1010], [10, 389, 1011], [10, 389, 1010]],
    stations: [
      // Only these two actually sit on the mountain — the rest are valley/
      // town stations kept purely to anchor the low end of the lapse-rate
      // fit (pill: false below skips creating a map marker for them; they
      // still feed pwProfile/the temp overlay via pwState).
      { trackId: '363045', name: 'Whakapapa 2000m' },
      { trackId: '363044', name: 'Halidays Hut' },
      { trackId: '363039', name: 'Desert Road', pill: false },
      { trackId: '362779', name: 'National Park Township', pill: false },
      { trackId: '362785', name: 'Waiouru Aerodrome', pill: false },
      { trackId: '363053', name: 'Raetihi', pill: false },
    ],
  },
  cardrona: {
    tiles: [[10, 369, 992], [10, 368, 993], [10, 368, 992], [10, 369, 993]],
    stations: [
      { trackId: '363167', name: 'Treble Cone' },        // 1791 m
      { trackId: '363042', name: 'Pisa' },               // 1408 m
      { trackId: '362792', name: 'Crown Range Road' },   // 1067 m
      { trackId: '362817', name: 'Crown Terrace' },      // 608 m
      { trackId: '363027', name: 'Wanaka Airport' },     // 349 m
    ],
  },
  // 5 nearest PredictWind track stations to Loveland Ski Area (39.6803,
  // -105.8989), picked for an elevation spread wide enough to fit a lapse
  // rate, same as the other resorts.
  loveland: {
    tiles: [[10, 636, 210], [10, 636, 209], [10, 635, 211], [10, 633, 209]],
    stations: [

let PW_TILES = (PW_CONFIG[resortKey] || { tiles: [], stations: [] }).tiles;
let PW_STATIONS = (PW_CONFIG[resortKey] || { tiles: [], stations: [] }).stations;
const KT_TO_KMH = 1.852;

let pwVisible = true; // observation pills shown by default
// Isobars and Radar each get their OWN independent visibility flag rather

// same obs-toggle icon can still turn them on within either mode
// specifically, without that choice bleeding into the other modes once
// you switch back.
let pwVisibleIsobars = false;
let pwVisibleRadar = false;
function pwVisibilityFlagFor(mode) {
  if (mode === 'isobars') return pwVisibleIsobars;
  if (mode === 'radar') return pwVisibleRadar;
  return pwVisible;

function pwRealPillsShouldShow() { return pwVisibilityFlagFor(viewMode); }
function pwPseudoPillsShouldShow() { return pwVisibilityFlagFor(viewMode); }
// Re-applies current visibility to every already-rendered pill marker —
// without this, switching mode wouldn't hide/show anything until whatever

function pwUpdatePillVisibility() {

    if (el) el.style.display = pwRealPillsShouldShow() ? '' : 'none';
